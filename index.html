        const g_a2 = this.convBackwardInput(g_c3, 32, c3.H, c3.W, this.w3, 32, c2.H, c2.W, 1);
        const g_c2 = this.leakyReluBackward(g_a2, c2.data);
        const g_a1 = this.convBackwardInput(g_c2, 32, c2.H, c2.W, this.w2, 16, c1.H, c1.W, 2);
        const g_c1 = this.leakyReluBackward(g_a1, c1.data);
        const rawGrad = this.convBackwardInput(g_c1, 16, c1.H, c1.W, this.w1, 3, CRITIC_SIZE, CRITIC_SIZE, 2);

        // 3. 4-scale dilated Gaussian/Laplacian pyramid conditioning (dilations 1, 2, 4, 8)
        const condGrad = new Float32Array(CRITIC_LEN);
        const dilations = [1, 2, 4, 8];
        const weights = [0.25, 0.25, 0.20, 0.15];
        for (let i = 0; i < CRITIC_LEN; i++) condGrad[i] = 0.15 * rawGrad[i];

        for (let dIdx = 0; dIdx < dilations.length; dIdx++) {
          const d = dilations[dIdx];
          const w = weights[dIdx];
          for (let c = 0; c < 3; c++) {
            const base = c * CRITIC_PIXELS;
            for (let y = 0; y < CRITIC_SIZE; y++) {
              const ym = Math.max(0, y - d);
              const yp = Math.min(CRITIC_SIZE - 1, y + d);
              for (let x = 0; x < CRITIC_SIZE; x++) {
                const xm = Math.max(0, x - d);
                const xp = Math.min(CRITIC_SIZE - 1, x + d);
                const blur =
                  (rawGrad[base + ym * CRITIC_SIZE + xm] +
                    2 * rawGrad[base + ym * CRITIC_SIZE + x] +
                    rawGrad[base + ym * CRITIC_SIZE + xp] +
                    2 * rawGrad[base + y * CRITIC_SIZE + xm] +
                    4 * rawGrad[base + y * CRITIC_SIZE + x] +
                    2 * rawGrad[base + y * CRITIC_SIZE + xp] +
                    rawGrad[base + yp * CRITIC_SIZE + xm] +
                    2 * rawGrad[base + yp * CRITIC_SIZE + x] +
                    rawGrad[base + yp * CRITIC_SIZE + xp]) / 16.0;
                condGrad[base + y * CRITIC_SIZE + x] += w * blur;
              }
            }
          }
        }

        // 4. RMS Normalization
        let sumSq = 0.0;
        for (let i = 0; i < CRITIC_LEN; i++) sumSq += condGrad[i] * condGrad[i];
        const gradEnergy = sumSq / CRITIC_LEN;
        const invRms = 1.0 / Math.sqrt(gradEnergy + 1e-8);

        // 5. Paranoia Step & Doubt Collapse
        const nextCanvas = new Float32Array(CRITIC_LEN);
        const decay = 1.0 - doubt * 0.08;
        for (let i = 0; i < CRITIC_LEN; i++) {
          const val = canvas[i] * decay + condGrad[i] * invRms * ascentRate;
          nextCanvas[i] = Math.tanh(val);
        }

        const conf = 1.0 / (1.0 + Math.exp(-finalMean));
        const tension = Math.min(1.0, Math.max(0.0, gradEnergy * 0.5 + conf * 0.5));
        return { nextCanvas, tension };
      }
    }

    const fallbackEngine = new InMemoryPatchGAN();

    // -------------------------------------------------------------------------
    // DOUBT COLLAPSE: RADIAL INWARD ADVECTION + DARK GAUSSIAN SEED STATIC
    // -------------------------------------------------------------------------
    function applyDoubtCollapse(nchw, strength) {
      const warped = new Float32Array(TENSOR_LEN);
      const half = SIZE * 0.5;
      const pull = 1.0 + strength * 0.035;
      for (let c = 0; c < 3; c++) {
        const base = c * PIXELS;
        for (let y = 0; y < SIZE; y++) {
          const sy = Math.min(SIZE - 1, Math.max(0, Math.round(half + (y - half) * pull)));
          for (let x = 0; x < SIZE; x++) {
            const sx = Math.min(SIZE - 1, Math.max(0, Math.round(half + (x - half) * pull)));
            const idx = base + y * SIZE + x;
            const noise = (Math.random() - 0.5) * 0.10 * strength;
            const src = nchw[base + sy * SIZE + sx];
            const prior = bustPriorNCHW[idx];
            warped[idx] = Math.max(-1.0, Math.min(1.0, src * (1.0 - strength * 0.09) + prior * (strength * 0.06) + noise));
          }
        }
      }
      return warped;
    }

    // -------------------------------------------------------------------------
    // INITIALIZE ONNXRUNTIME-WEB OR FALLBACK
    // -------------------------------------------------------------------------
    async function initEngine() {
      seedChiaroscuroBust(targetFaceNCHW, true);
      hostPortrait.set(targetFaceNCHW);
      computeLowBand(hostPortrait, hostLowBand);
      nextHostPortrait.set(hostPortrait);
      nextHostLowBand.set(hostLowBand);
      for (let k = 0; k < 4; k++) {
        portraits[k].set(targetFaceNCHW);
        computeLowBand(portraits[k], portraitsLow[k]);
      }
      canvasNCHW.set(targetFaceNCHW);
      if (typeof IS_MOBILE !== "undefined" && IS_MOBILE) {
        useFallback = true;
        console.info("[ParanoiaLoop] Mobile mode: lightweight InMemoryPatchGAN critic active");
        runLoop();
        return;
      }
      try {
        const base = (typeof APP_BASE_URL === "string" && APP_BASE_URL)
          ? APP_BASE_URL
          : ((self.location && self.location.origin && self.location.origin !== "null") ? self.location.origin + "/" : "");
        importScripts(base + "vendor/ort/ort.all.min.js");
        ort.env.wasm.wasmPaths = base + "vendor/ort/";
        ort.env.wasm.numThreads = 1;
        let criticBytes = null;
        let lastCriticErr = null;
        for (let a = 0; a < 3; a++) {
          try {
            const cr = await fetch(base + "paranoia_critic.onnx");
            if (!cr.ok) throw new Error("HTTP " + cr.status);
            criticBytes = new Uint8Array(await cr.arrayBuffer());
            break;
          } catch (ce) {
            lastCriticErr = ce;
            if (a < 2) await new Promise((r) => setTimeout(r, 600 * (a + 1)));
          }
        }
        if (!criticBytes) throw lastCriticErr || new Error("Failed to fetch paranoia_critic.onnx");
        ortSession = await ort.InferenceSession.create(criticBytes, {
          executionProviders: ["webgpu", "wasm"],
        });
        console.info("[ParanoiaLoop] Active: paranoia_critic.onnx");
      } catch (err) {
        useFallback = true;
        console.warn("[ParanoiaLoop] Fallback active (InMemoryPatchGAN):", err && err.message ? err.message : err);
      }
      runLoop();
    }

    let hasLiveFace = false;
    let donorSeedStage = 0;
    let gazeX = 0.5;
    let gazeY = 0.5;
    let lastGazeTime = -99999;

    // Critic parameters & de-striped delta buffers (native 128x128) — smooth band-free discrimination on the macro eye
    let pAscentRate = 0.520;
    let pCriticWeight = 0.24;
    let pRadius = 0.145;
    let pChimeraBlend = 0.45;
    const criticDelta = new Float32Array(CRITIC_LEN);
    const criticSmooth = new Float32Array(CRITIC_LEN);

    async function runLoop() {
      let startTime = null;
      while (true) {
        if (!hasLiveFace) {
          await new Promise((r) => setTimeout(r, 30));
          continue;
        }
        if (startTime === null) startTime = performance.now();
        const elapsed = (performance.now() - startTime) * 0.001;
        stepCount++;
        const ascentRate = pAscentRate;
        const jx = (Math.random() - 0.5) * 0.06;
        const jy = (Math.random() - 0.5) * 0.06;

        let nextFromCritic = null;
        if (!useFallback && ortSession) {
          try {
            const feeds = {
              canvas: new ort.Tensor("float32", canvasNCHW, [1, 3, SIZE, SIZE]),
              ascent_rate: new ort.Tensor("float32", new Float32Array([ascentRate]), [1, 1]),
              doubt_factor: new ort.Tensor("float32", new Float32Array([doubtFactor]), [1, 1]),
              jitter_offset: new ort.Tensor("float32", new Float32Array([jx, jy]), [1, 2]),
            };
            const results = await ortSession.run(feeds);
            nextFromCritic = new Float32Array(results.next_canvas.data);
            tensionMetric = results.tension_metric.data[0];
          } catch (_runErr) {
            useFallback = true;
          }
        }

        if (useFallback) {
          const res = fallbackEngine.step(canvasNCHW, ascentRate, doubtFactor, jx, jy);
          nextFromCritic = res.nextCanvas;
          tensionMetric = res.tension;
        }

        // Sequential pair-of-eyes anatomical zones so the Discriminator interrogates both eyes, brows & bridge
        const landmarks = [
          { x: 0.24, y: 0.50 }, // 0: Left Iris
          { x: 0.24, y: 0.30 }, // 1: Left Brow
          { x: 0.50, y: 0.46 }, // 2: Nose Bridge
          { x: 0.76, y: 0.50 }, // 3: Right Iris
          { x: 0.76, y: 0.30 }, // 4: Right Brow
          { x: 0.50, y: 0.70 }, // 5: Lower Lids
        ];
        // Roving Discriminator interrogation glides across the macro eye anatomy
        const cycle = elapsed * 0.30;
        const idxA = Math.floor(cycle) % landmarks.length;
        const idxB = (idxA + 1) % landmarks.length;
        const activeFeatureMap = [0, 0, 2, 1, 1, 3];
        activeFeatureIdx = activeFeatureMap[idxA];
        const frac = cycle - Math.floor(cycle);
        const smoothFrac = frac * frac * (3.0 - 2.0 * frac);
        const autoFx = landmarks[idxA].x * (1.0 - smoothFrac) + landmarks[idxB].x * smoothFrac;
        const autoFy = landmarks[idxA].y * (1.0 - smoothFrac) + landmarks[idxB].y * smoothFrac;
        const gazeBlend = Math.max(0.0, 1.0 - (performance.now() - lastGazeTime) / 1800.0);
        const fx = autoFx * (1.0 - gazeBlend) + gazeX * gazeBlend;
        const fy = autoFy * (1.0 - gazeBlend) + gazeY * gazeBlend;
        const invFocusSigma2 = 1.0 / (2.0 * pRadius * pRadius);
        const patchRadius = Math.max(pRadius * 2.05, 0.180);
        const invPatchSigma2 = 1.0 / (2.0 * patchRadius * patchRadius);
        const hostLow = hostLowBand;

        // Suppress PatchGAN strided-conv banding/stripes while preserving smooth regional adversarial critique
        for (let i = 0; i < TENSOR_LEN; i++) criticDelta[i] = nextFromCritic[i] - canvasNCHW[i];
        computeLowBand(criticDelta, criticSmooth, 5, SIZE, blurScratch);

        // Update 128x128 proxy canvas for critic feedback & landmark tracking (full 1024x1024 stitching runs on GPU)
        const invSize = 1.0 / SIZE;
        for (let y = 0; y < SIZE; y++) {
          const py = y * invSize;
          const dyf = py - fy;
          const dyf2 = dyf * dyf;
          const rowOff = y * SIZE;
          for (let x = 0; x < SIZE; x++) {
            const dxf = x * invSize - fx;
            const d2 = dxf * dxf + dyf2;
            const focus = Math.exp(-d2 * invFocusSigma2);
            const patchMask = Math.exp(-d2 * invPatchSigma2);

            const idx = rowOff + x;
            const w0 = W0[idx], w1 = W1[idx], w2 = W2[idx], w3 = W3[idx];
            const stitchMask = Math.min(1.0, FMASK[idx] * patchMask * 1.35);

            const hostStep = 0.008 + 0.22 * patchMask;
            const dLum = 0.299 * criticSmooth[idx] + 0.587 * criticSmooth[PIXELS + idx] + 0.114 * criticSmooth[2 * PIXELS + idx];
            const localBlend = 0.004 + patchMask * (pChimeraBlend * 0.65) + focus * (pChimeraBlend * 0.35);
            const criticWeight = focus * pCriticWeight;
            const keepWeight = Math.max(0.0, 1.0 - criticWeight - localBlend);
            for (let c = 0; c < 3; c++) {
              const i = c * PIXELS + idx;
              hostPortrait[i] += (nextHostPortrait[i] - hostPortrait[i]) * hostStep;
              hostLow[i] += (nextHostLowBand[i] - hostLow[i]) * hostStep;

              const donorLow =
                portraitsLow[0][i] * w0 +
                portraitsLow[1][i] * w1 +
                portraitsLow[2][i] * w2 +
                portraitsLow[3][i] * w3;
              const donorHigh =
                (portraits[0][i] - portraitsLow[0][i]) * w0 +
                (portraits[1][i] - portraitsLow[1][i]) * w1 +
                (portraits[2][i] - portraitsLow[2][i]) * w2 +
                (portraits[3][i] - portraitsLow[3][i]) * w3;
              const hostHigh = hostPortrait[i] - hostLow[i];

              const lowBand = hostLow[i] * (1.0 - 0.85 * stitchMask) + donorLow * (0.85 * stitchMask);
              const highBand = hostHigh * (1.0 - stitchMask) + donorHigh * stitchMask;
              const chimeraTarget = Math.max(-1.0, Math.min(1.0, lowBand + highBand));

              const criticVal = canvasNCHW[i] + dLum * 0.88 + criticSmooth[i] * 0.12;
              canvasNCHW[i] = criticVal * criticWeight + canvasNCHW[i] * keepWeight + chimeraTarget * localBlend;
            }
          }
        }

        // Gentle breathing doubtFactor without PatchGAN banding
        doubtFactor = 0.08 + 0.10 * Math.sin(elapsed * 0.45);

        // Detect the bright white sclera corner immediately beside the inner tear duct (left=0, right=1)
        function findPairTearDuct(side) {
          const isLeft = side === 0;
          const xMin = isLeft ? 36 : 75;
          const xMax = isLeft ? 52 : 91;
          const scleraPts = [];
          for (let y = 58; y <= 73; y++) {
            for (let x = xMin; x <= xMax; x++) {
              const idx = y * SIZE + x;
              const r = canvasNCHW[idx] * 0.5 + 0.5;
              const g = canvasNCHW[PIXELS + idx] * 0.5 + 0.5;
              const b = canvasNCHW[2 * PIXELS + idx] * 0.5 + 0.5;
              const lum = 0.299 * r + 0.587 * g + 0.114 * b;
              const sat = Math.max(r, g, b) - Math.min(r, g, b);
              if (lum > 0.32 && sat < 0.26) {
                scleraPts.push([x, y, lum]);
              }
            }
          }
          let bestX = isLeft ? 45.0 : 83.0;
          let bestY = 66.0;
          if (scleraPts.length >= 4) {
            // Sort toward the inner tear duct (rightmost sclera for left eye, leftmost sclera for right eye)
            scleraPts.sort((a, b) => isLeft ? (b[0] - a[0]) : (a[0] - b[0]));
            const topN = Math.max(3, Math.min(12, Math.floor(scleraPts.length * 0.22)));
            let sx = 0.0, sy = 0.0, sw = 0.0;
            for (let i = 0; i < topN; i++) {
              const w = scleraPts[i][2];
              sx += scleraPts[i][0] * w;
              sy += scleraPts[i][1] * w;
              sw += w;
            }
            // Sit directly inside the white sclera corner right next to the tear duct, resting on the lower lid rim
            bestX = (sx / sw) + (isLeft ? -0.8 : 0.8);
            bestY = (sy / sw) + 1.2;
          }
          const u = Math.max(isLeft ? 0.29 : 0.59, Math.min(isLeft ? 0.41 : 0.71, (bestX + 0.5) / SIZE));
          const v = Math.max(0.42, Math.min(0.54, 1.0 - (bestY + 0.5) / SIZE));
          return [u, v];
        }
        const [lxTear, lyTear] = findPairTearDuct(0);
        const [rxTear, ryTear] = findPairTearDuct(1);

        // Real-time anchor-guided live pupil tracker on 128x128 morphed buffer (tracks live shape warps within tight ±7px leash)
        function findPairPupil(side) {
          const isLeft = side === 0;
          const nomX = anchorPupils[isLeft ? 0 : 2] * SIZE - 0.5;
          const nomY = (1.0 - anchorPupils[isLeft ? 1 : 3]) * SIZE - 0.5;
          const xMin = Math.max(8, Math.round(nomX - 7));
          const xMax = Math.min(SIZE - 9, Math.round(nomX + 7));
          const yMin = Math.max(20, Math.round(nomY - 7));
          const yMax = Math.min(SIZE - 21, Math.round(nomY + 7));
          let bestX = nomX, bestY = nomY, bestScore = -1e9;
          const lumAt128 = (px, py) => {
            const x = Math.max(0, Math.min(SIZE - 1, Math.round(px)));
            const y = Math.max(0, Math.min(SIZE - 1, Math.round(py)));
            const idx = y * SIZE + x;
            return 0.299 * (canvasNCHW[idx] * 0.5 + 0.5)
                 + 0.587 * (canvasNCHW[PIXELS + idx] * 0.5 + 0.5)
                 + 0.114 * (canvasNCHW[2 * PIXELS + idx] * 0.5 + 0.5);
          };
          for (let y = yMin; y <= yMax; y++) {
            for (let x = xMin; x <= xMax; x++) {
              // Full 2.3:1 elliptical iris disc (rx=4, ry=9): rejects thin lashes & ignores specular catchlights via cap
              let discSum = 0.0, discCnt = 0;
              for (let dy = -9; dy <= 9; dy += 2) {
                const ny = dy / 9.0;
                const maxDx = Math.floor(4.0 * Math.sqrt(Math.max(0.0, 1.0 - ny * ny)));
                for (let dx = -maxDx; dx <= maxDx; dx++) {
                  discSum += Math.min(lumAt128(x + dx, y + dy), 0.44);
                  discCnt++;
                }
              }
              const discLum = discSum / Math.max(1, discCnt);
              const flL = 0.5 * (lumAt128(x - 6, y) + lumAt128(x - 7, y + 1));
              const flR = 0.5 * (lumAt128(x + 6, y) + lumAt128(x + 7, y + 1));
              const minFlank = Math.min(flL, flR);
              const avgFlank = 0.5 * (flL + flR);
              const belowLum = lumAt128(x, y + 11);
              const dist2 = (x - nomX) * (x - nomX) * 2.2 + (y - nomY) * (y - nomY) * 1.6;
              const score = minFlank * 1.25 + avgFlank * 0.35 + belowLum * 0.22 - discLum * 2.85 - dist2 * 0.012;
              if (score > bestScore) { bestScore = score; bestX = x; bestY = y; }
            }
          }
          // Sub-pixel dark-iris centroid refinement around (bestX, bestY)
          let wx = 0.0, wy = 0.0, ws = 0.0;
          for (let dy = -6; dy <= 6; dy++) {
            const ny = dy / 6.5;
            const maxDx = Math.floor(3.4 * Math.sqrt(Math.max(0.0, 1.0 - ny * ny)));
            for (let dx = -maxDx; dx <= maxDx; dx++) {
              const l = lumAt128(bestX + dx, bestY + dy);
              const w = Math.max(0.0, 0.40 - l);
              if (w > 0.0) {
                const w2 = w * w;
                wx += (bestX + dx) * w2;
                wy += (bestY + dy) * w2;
                ws += w2;
              }
            }
          }
          const fx = ws > 1e-5 ? (wx / ws) : bestX;
          const fy = ws > 1e-5 ? (wy / ws) : bestY;
          return [(fx + 0.5) / SIZE, 1.0 - (fy + 0.5) / SIZE];
        }
        const [lxPupil, lyPupil] = findPairPupil(0);
        const [rxPupil, ryPupil] = findPairPupil(1);

        // Detect exact live FFHQ mouth vertical center (horizontal lip parting line) on 128x128 canvasNCHW
        function findMouthCenter() {
          let bestY = 92.5, bestS = 1e9;
          for (let y = 88; y <= 98; y++) {
            let lSum = 0.0;
            for (let x = 56; x <= 72; x++) {
              const idx = y * SIZE + x;
              lSum += 0.299 * canvasNCHW[idx] + 0.587 * canvasNCHW[PIXELS + idx] + 0.114 * canvasNCHW[2 * PIXELS + idx];
            }
            const s = (lSum / 17.0) + 0.020 * (y - 92.5) * (y - 92.5);
            if (s < bestS) { bestS = s; bestY = y; }
          }
          return [0.50, 1.0 - (bestY + 0.5) / SIZE];
        }
        const [mxMouth, myMouth] = findMouthCenter();

        // Pack 128x128 de-striped critic delta -> interleaved RGBA Float32Array for GPU 1024x1024 compositor
        const deltaRGBA = new Float32Array(PIXELS * 4);
        const criticGain = 1.15;
        for (let i = 0; i < PIXELS; i++) {
          const dLum = 0.299 * criticSmooth[i] + 0.587 * criticSmooth[PIXELS + i] + 0.114 * criticSmooth[2 * PIXELS + i];
          deltaRGBA[i * 4 + 0] = (dLum * 0.85 + criticSmooth[i] * 0.15) * criticGain;
          deltaRGBA[i * 4 + 1] = (dLum * 0.85 + criticSmooth[PIXELS + i] * 0.15) * criticGain;
          deltaRGBA[i * 4 + 2] = (dLum * 0.85 + criticSmooth[2 * PIXELS + i] * 0.15) * criticGain;
          deltaRGBA[i * 4 + 3] = 1.0;
        }

        self.postMessage(
          {
            type: "critic_step",
            delta: deltaRGBA.buffer,
            tension: tensionMetric,
            eyes: [lxTear, lyTear, rxTear, ryTear],
            pupils: [lxPupil, lyPupil, rxPupil, ryPupil],
            mouth: [mxMouth, myMouth],
            feature: [fx, 1.0 - fy, cycle],
            radius: pRadius,
            criticWeight: pCriticWeight,
            chimeraBlend: pChimeraBlend,
          },
          [deltaRGBA.buffer]
        );
        // Minimal yield for 30+ fps neural fluidity
        await new Promise((r) => setTimeout(r, 4));
      }
    }

    self.onmessage = (e) => {
      if (e.data && e.data.type === "gaze") {
        gazeX = e.data.x;
        gazeY = e.data.y;
        lastGazeTime = performance.now();
      } else if (e.data && e.data.type === "params") {
        pAscentRate = e.data.ascent;
        pCriticWeight = e.data.critic;
        pRadius = e.data.radius;
        pChimeraBlend = e.data.chimera;
      } else if (e.data && e.data.type === "seed" && e.data.nchw) {
        targetFaceNCHW = new Float32Array(e.data.nchw);
        canvasNCHW.set(targetFaceNCHW);
        hostPortrait.set(targetFaceNCHW);
        computeLowBand(hostPortrait, hostLowBand);
        nextHostPortrait.set(hostPortrait);
        nextHostLowBand.set(hostLowBand);
        inDoubtPhase = false;
        doubtFactor = 0.0;
        plateauCounter = 0;
      } else if (e.data && e.data.type === "connect_gen" && e.ports && e.ports[0]) {
        e.ports[0].onmessage = (ge) => {
          if (ge.data && ge.data.type === "new_face" && ge.data.face) {
            const incoming = new Float32Array(ge.data.face);
            const rgba1024 = ge.data.rgba1024;
            const depth224 = ge.data.depth224;
            if (ge.data.eyeGeom && ge.data.eyeGeom.pupils) {
              const ep = ge.data.eyeGeom.pupils;
              if (!hasLiveFace || ge.data.updateHost) {
                anchorPupils = ep.slice();
              } else {
                for (let k = 0; k < 4; k++) anchorPupils[k] = anchorPupils[k] * 0.72 + ep[k] * 0.28;
              }
            }
            let role = "slot";
            let slot = 0;
            if (!hasLiveFace) {
              hasLiveFace = true;
              role = "init";
              hostPortrait.set(incoming);
              computeLowBand(hostPortrait, hostLowBand);
              nextHostPortrait.set(hostPortrait);
              nextHostLowBand.set(hostLowBand);
              for (let k = 0; k < 4; k++) {
                portraits[k].set(incoming);
                computeLowBand(portraits[k], portraitsLow[k]);
              }
              canvasNCHW.set(incoming);
              targetFaceNCHW.set(incoming);
            } else {
              if (donorSeedStage < 3) {
                donorSeedStage++;
                if (donorSeedStage === 1) {
                  role = "seed1";
                  portraits[1].set(incoming);
                  computeLowBand(portraits[1], portraitsLow[1]);
                  portraits[3].set(incoming);
                  computeLowBand(portraits[3], portraitsLow[3]);
                  nextHostPortrait.set(incoming);
                  computeLowBand(nextHostPortrait, nextHostLowBand);
                } else if (donorSeedStage === 2) {
                  role = "seed2";
                  portraits[2].set(incoming);
                  computeLowBand(portraits[2], portraitsLow[2]);
                } else {
                  role = "seed3";
                  portraits[3].set(incoming);
                  computeLowBand(portraits[3], portraitsLow[3]);
                }
              } else if (ge.data.updateHost) {
                role = "host";
                nextHostPortrait.set(incoming);
                computeLowBand(nextHostPortrait, nextHostLowBand);
              } else {
                // Only update an idle donor slot opposite the spotlight so parts never swap abruptly in place
                role = "slot";
                slot = nextSlot === activeFeatureIdx ? (nextSlot + 2) % 4 : nextSlot;
                portraits[slot].set(incoming);
                computeLowBand(portraits[slot], portraitsLow[slot]);
                nextSlot = (nextSlot + 1) % 4;
              }
            }
            if (rgba1024) {

              if (depth224) xfers.push(depth224);
              self.postMessage({ type: "donor_hi", role, slot, rgba1024, depth224, eyeGeom: ge.data.eyeGeom || null }, xfers);

      }

    initEngine();

  <script>
    (function () {

        layout(location = 0) in vec2 a_pos;

        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_prev_chimera;
        uniform sampler2D u_host;
        uniform sampler2D u_d0;
        uniform sampler2D u_d1;
        uniform sampler2D u_d2;
        uniform sampler2D u_d3;
        uniform sampler2D u_critic_delta;
        uniform vec2 u_spot;
        uniform float u_radius;
        uniform float u_critic_weight;
        uniform float u_chimera_blend;
        uniform float u_dt_step;
        uniform float u_init;

        void main() {
          vec3 hostSharp = textureLod(u_host, v_uv, 0.0).rgb * 2.0 - 1.0;
          if (u_init > 0.5) {
            fragColor = vec4(hostSharp, 1.0);
            return;
          }
          vec3 hostLow = textureLod(u_host, v_uv, 4.2).rgb * 2.0 - 1.0;
          vec3 hostHigh = hostSharp - hostLow;

          vec3 d0Sharp = textureLod(u_d0, v_uv, 0.0).rgb * 2.0 - 1.0;
          vec3 d1Sharp = textureLod(u_d1, v_uv, 0.0).rgb * 2.0 - 1.0;
          vec3 d2Sharp = textureLod(u_d2, v_uv, 0.0).rgb * 2.0 - 1.0;
          vec3 d3Sharp = textureLod(u_d3, v_uv, 0.0).rgb * 2.0 - 1.0;

          vec3 d0Low = textureLod(u_d0, v_uv, 4.2).rgb * 2.0 - 1.0;
          vec3 d1Low = textureLod(u_d1, v_uv, 4.2).rgb * 2.0 - 1.0;
          vec3 d2Low = textureLod(u_d2, v_uv, 4.2).rgb * 2.0 - 1.0;
          vec3 d3Low = textureLod(u_d3, v_uv, 4.2).rgb * 2.0 - 1.0;

          vec2 e0 = (v_uv - vec2(0.24, 0.50)) / vec2(0.22, 0.22); // left eye
          vec2 e1 = (v_uv - vec2(0.76, 0.50)) / vec2(0.22, 0.22); // right eye
          vec2 e2 = (v_uv - vec2(0.50, 0.46)) / vec2(0.18, 0.26); // nose bridge & inner brows
          vec2 e3 = (v_uv - vec2(0.50, 0.74)) / vec2(0.38, 0.20); // lower lids & upper cheeks
          float w0 = exp(-0.5 * dot(e0, e0));
          float w1 = exp(-0.5 * dot(e1, e1));
          float w2 = exp(-0.5 * dot(e2, e2));
          float w3 = exp(-0.5 * dot(e3, e3));
          float featureMask = min(1.0, w0 + w1 + w2 + w3);
          float wSum = w0 + w1 + w2 + w3 + 1e-5;
          w0 /= wSum; w1 /= wSum; w2 /= wSum; w3 /= wSum;

          vec2 df = v_uv - u_spot;
          float d2 = dot(df, df);
          float focus = exp(-d2 / (2.0 * u_radius * u_radius));
          float patchR = max(u_radius * 2.05, 0.150);
          float patchMask = exp(-d2 / (2.0 * patchR * patchR));
          float stitchMask = min(1.0, featureMask * patchMask * 1.35);

          vec3 donorLow = d0Low * w0 + d1Low * w1 + d2Low * w2 + d3Low * w3;

          vec3 lowBand = mix(hostLow, donorLow, 0.85 * stitchMask);
          vec3 highBand = mix(hostHigh, donorHigh, stitchMask);
          vec3 chimeraTarget = clamp(lowBand + highBand, -1.0, 1.0);

          vec3 prev = texture(u_prev_chimera, v_uv).rgb;
          vec3 cDelta = texture(u_critic_delta, v_uv).rgb;
          vec3 criticVal = clamp(prev + cDelta, -1.0, 1.0);

          float localBlend = 1.0 - pow(max(0.0, 1.0 - (0.004 + patchMask * (u_chimera_blend * 0.65) + focus * (u_chimera_blend * 0.35))), u_dt_step);
          float criticW = clamp(focus * u_critic_weight * u_dt_step, 0.0, 0.45);
          float keepW = max(0.0, 1.0 - criticW - localBlend);

        }

      // Pass 1: Temporal Optical-Flow & Advection FBO (1024x1024)
      const FS_ADVECTION = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_prev_neural;
        uniform sampler2D u_curr_neural;
        uniform sampler2D u_feedback;
        uniform float u_blend;
        uniform float u_tension;
        uniform float u_flow_scale;
        uniform float u_fbo_blend;
        uniform float u_edge_curl;
        uniform float u_brush_streak;
        uniform vec2 u_cursor;
        uniform float u_cursor_vel;
        uniform float u_mood;
        uniform float u_time;
        uniform vec2 u_tear_origin;
        uniform float u_tear_head_y;
        uniform float u_tear_alpha;
        uniform float u_tear_dir;
        uniform vec2 u_feature_pos;
        uniform float u_feature_cycle;
        uniform float u_dt;
        uniform vec4 u_tear_eyes;
        uniform vec2 u_mouth_pos;

        float tearHash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float tearNoise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(tearHash(i), tearHash(i + vec2(1.0, 0.0)), f.x),
            mix(tearHash(i + vec2(0.0, 1.0)), tearHash(i + vec2(1.0, 1.0)), f.x),
            f.y

        float tearFbm(vec2 p) {

          v += 0.56 * tearNoise(p);
          v += 0.30 * tearNoise(p * 2.07 + vec2(3.7, 1.9));
          v += 0.14 * tearNoise(p * 4.13 + vec2(8.3, 5.1));

        vec2 evalSingleTear(vec2 uv, vec2 orig, float headY, float dir, float t, vec2 faceCurl) {
          float dropDist = max(0.0, orig.y - headY);
          float span = clamp((orig.y - uv.y) / 0.22, 0.0, 1.0);
          float brushWarp = (tearFbm(vec2(uv.x * 26.0, uv.y * 11.0 + orig.x * 17.0)) - 0.5) * 0.0052;
          float contourBend = clamp(faceCurl.x, -0.35, 0.35) * 0.012 * smoothstep(0.0, 0.35, span);
          float meander = dir * 0.016 * smoothstep(0.0, 0.75, span)
                        + 0.005 * sin(uv.y * 24.0 + orig.x * 19.0 + t * 0.12) * smoothstep(0.0, 0.25, span)
                        + contourBend + brushWarp;
          float dx = uv.x - (orig.x + meander);

          // Soft vertical brush density breakup matching the oil-paint canvas grain
          float bristle = tearFbm(vec2(uv.x * 48.0, uv.y * 13.0 + orig.y * 11.0));
          float softGain = mix(0.62, 1.16, bristle);

          // Initial paint well blurs softly at the eye margin and dissolves as the drop detaches
          float poolFade = 1.0 - smoothstep(0.015, 0.095, dropDist);
          float poolX = dx / 0.0068;
          float poolY = (uv.y - orig.y) / 0.0145;
          float pool = exp(-(poolX * poolX + poolY * poolY) * 0.65) * poolFade;

          // Narrower feathered wake fading out from the eye (relToHead=1) towards the teardrop (relToHead=0)
          float trailLen = max(0.014, dropDist);
          float relToHead = clamp((uv.y - headY) / trailLen, 0.0, 1.0);
          float fadeFromEye = 1.0 - smoothstep(0.05, 0.85, relToHead);
          float inSpan = (1.0 - smoothstep(orig.y - 0.007, orig.y + 0.007, uv.y)) * smoothstep(headY - 0.014, headY + 0.009, uv.y);

          float coreW = 0.0042 * (0.48 + 0.52 * fadeFromEye) * (0.72 + 0.55 * bristle);
          float haloW = 0.0092 * (0.55 + 0.45 * fadeFromEye);
          float wakeCore = exp(-(dx / coreW) * (dx / coreW) * 0.80);
          float wakeHalo = exp(-(dx / haloW) * (dx / haloW) * 0.65) * 0.36;
          float wake = (wakeCore + wakeHalo) * inSpan * fadeFromEye;

          // Painterly blurred teardrop head with wide oil-wash penumbra instead of a hard oval
          float bX = dx / 0.0058;
          float bY = (uv.y - headY) / 0.0165;
          float r2 = bX * bX + bY * bY;
          float beadCore = exp(-r2 * 0.72);
          float beadHalo = exp(-r2 * 0.28) * 0.42;
          float bead = clamp((beadCore + beadHalo) * mix(0.76, 1.12, bristle), 0.0, 1.0);

          float wash = clamp((pool * 0.58 + wake * 0.82 + bead * 0.92) * softGain, 0.0, 1.0);
          return vec2(wash, beadCore);

        vec4 sampleBicubic(sampler2D tex, vec2 uv) {
          vec2 texSize = vec2(256.0);
          vec2 invSize = 1.0 / texSize;
          vec2 p = uv * texSize - 0.5;
          vec2 f = fract(p);
          vec2 i = floor(p);
          vec2 f2 = f * f;
          vec2 f3 = f2 * f;
          vec2 w0 = -0.5 * f3 + f2 - 0.5 * f;
          vec2 w1 = 1.5 * f3 - 2.5 * f2 + 1.0;
          vec2 w2 = -1.5 * f3 + 2.0 * f2 + 0.5 * f;
          vec2 w3 = 0.5 * f3 - 0.5 * f2;

          vec4 col = vec4(0.0);
          for (int y = -1; y <= 2; y++) {
            float wy = (y == -1) ? w0.y : (y == 0) ? w1.y : (y == 1) ? w2.y : w3.y;
            for (int x = -1; x <= 2; x++) {
              float wx = (x == -1) ? w0.x : (x == 0) ? w1.x : (x == 1) ? w2.x : w3.x;
              col += texture(tex, (i + vec2(float(x), float(y)) + 0.5) * invSize) * (wx * wy);
            }
          }
          return col;
        }

        // Evaluates one organic, slightly angled & bowed oil-brush swipe in rotated stroke coords
        // Returns vec4(swipeVel.x, swipeVel.y, hitWeight, bristleValue)
        vec4 evalBrushStroke(vec2 uv, vec2 anchor, float dirX, float angleSlope, float curveK, float halfH, float spanX, float tailStartFrac, float amp, float seed, float env) {
          vec2 sDir = normalize(vec2(dirX, angleSlope * dirX));
          vec2 sPerp = vec2(-sDir.y, sDir.x);
          vec2 delta = uv - anchor;
          float along = dot(delta, sDir);
          float alongC = clamp(along, -0.06, 0.78);
          float perp = dot(delta, sPerp) + curveK * alongC * alongC;

          float edgeWarp = (tearFbm(vec2(along * 4.5 + seed * 0.13, perp * 18.0 + seed * 0.07)) - 0.5) * 0.042;
          float bandMask = smoothstep(0.0, 0.030, halfH - abs(perp) + edgeWarp);
          float startMask = smoothstep(-0.022, 0.016, along + edgeWarp * 0.42);
          float tailFade = 1.0 - smoothstep(spanX * tailStartFrac, spanX, along);
          float hit = bandMask * startMask * tailFade * env;
          if (hit <= 0.002) return vec4(0.0);

          float bCoarse = tearFbm(vec2(along * 1.9 - u_time * 0.0044, perp * 22.0 + seed * 0.19));
          float bFine   = tearFbm(vec2(along * 3.8 + u_time * 0.0036, perp * 62.0 + seed * 0.31));
          float bMicro  = tearFbm(vec2(along * 6.5 - u_time * 0.0028, perp * 112.0 + seed * 0.47));
          float br = clamp(0.38 * bCoarse + 0.42 * bFine + 0.20 * bMicro, 0.0, 1.0);
          float bristleSpeed = 0.24 + 1.48 * smoothstep(0.22, 0.78, br);

          return vec4(sDir * (amp * hit * bristleSpeed), hit, br);
        }

        void main() {
          // Flip Y when sampling PyTorch NCHW buffer (pure undistorted macro eye anatomy)
          vec2 nUV = vec2(v_uv.x, 1.0 - v_uv.y);
          float griefMod = 0.40 + 0.60 * u_mood;
          vec4 neural4 = clamp(texture(u_curr_neural, nUV), -1.0, 1.0);
          vec3 neural = neural4.rgb;

          vec2 eyeRim = (nUV - vec2(0.50, 0.585)) / vec2(0.19, 0.032);

          float ductPool = clamp(exp(-dot(duct, duct)), 0.0, 1.0);
          float nLum = dot(clamp(neural * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float tearRimGate = smoothstep(0.14, 0.42, nLum);
          neural = clamp(neural + vec3(0.07, 0.08, 0.09) * (ductPool * 0.55 + wetRim * 0.22) * tearRimGate * (0.68 + 0.32 * griefMod), -1.0, 1.0);

          // Fast hardware-filtered central-difference gradient for viscous curl advection
          vec2 eps = vec2(1.0 / 512.0);
          float lL = dot(texture(u_curr_neural, nUV - vec2(eps.x, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lR = dot(texture(u_curr_neural, nUV + vec2(eps.x, 0.0)).rgb, vec3(0.299, 0.587, 0.114));
          float lD = dot(texture(u_curr_neural, nUV + vec2(0.0, eps.y)).rgb, vec3(0.299, 0.587, 0.114));
          float lU = dot(texture(u_curr_neural, nUV - vec2(0.0, eps.y)).rgb, vec3(0.299, 0.587, 0.114));
          vec2 grad = vec2(lR - lL, lU - lD);
          vec2 curl = vec2(-grad.y, grad.x);

          // 1. Edge-weighted curl advection + slow painterly single tear integration into paint FBO
          vec2 singleTear = (u_tear_alpha > 0.001)
            ? evalSingleTear(v_uv, u_tear_origin, u_tear_head_y, u_tear_dir, u_time, curl)
            : vec2(0.0);
          float tearInk = singleTear.x * u_tear_alpha;
          float tearBead = singleTear.y * u_tear_alpha;

          // Subtle wet skin darkening beneath tear (keeps the glass-like refraction in VS_PARTICLES crystal clear)
          vec3 sootPaint = mix(neural * 0.45, vec3(-0.85, -0.88, -0.90), 0.45);
          neural = mix(neural, sootPaint, clamp(tearInk, 0.0, 1.0) * 0.14);
          float dropCrest = smoothstep(0.35, 0.92, tearBead);
          neural = clamp(neural + vec3(0.14, 0.16, 0.19) * dropCrest, -1.0, 1.0);

          // Pair-of-eyes protection ellipse so both full eyes (including outer corners) stay crisp
          vec2 rawDelta = v_uv - vec2(0.50, 0.50);
          vec2 faceDelta = rawDelta / vec2(0.455, 0.360);
          float r = length(faceDelta);

          // Time-evolving multi-scale FBM curl turbulence + restrained radial drift
          vec2 smokeCoord = v_uv * 7.2 + vec2(sin(u_time * 0.13) * 0.25, cos(u_time * 0.14) * 0.25);
          float sC = tearFbm(smokeCoord);
          float sX = tearFbm(smokeCoord + vec2(0.030, 0.0));
          float sY = tearFbm(smokeCoord + vec2(0.0, 0.030));
          vec2 turbCurl = vec2(sY - sC, -(sX - sC)) / 0.030;

          vec2 fineCoord = v_uv * 15.0 + vec2(cos(u_time * 0.18) * 0.28, sin(u_time * 0.19) * 0.28);
          float fC = tearFbm(fineCoord);
          float fX = tearFbm(fineCoord + vec2(0.022, 0.0));
          float fY = tearFbm(fineCoord + vec2(0.0, 0.022));
          vec2 fineCurl = vec2(fY - fC, -(fX - fC)) / 0.022;

          // Subtle perimeter FBM onset keeping face & lower chin crisp while outermost rim breathes softly
          float rWisp = r + (sC - 0.5) * 0.11 + (fC - 0.5) * 0.05;
          float edgeMask = smoothstep(0.88, 1.12, rWisp);
          float driftZone = smoothstep(0.92, 1.22, rWisp);
          float voidFade = 1.0 - smoothstep(1.18, 1.46, r);

          float dLen = length(rawDelta);
          vec2 outDir = (dLen > 1e-4) ? (rawDelta / dLen) : vec2(0.0, 1.0);
          vec2 wander = vec2(sin(u_time * 0.19 + v_uv.y * 4.2 + sC * 2.0), cos(u_time * 0.17 + v_uv.x * 4.2 + fC * 2.0));
          float wispGate = 0.55 + 0.90 * smoothstep(0.22, 0.78, sC);
          vec2 smokeVel = (
            turbCurl * 0.0012 +
            fineCurl * 0.0006 +
            outDir * (0.00128 * wispGate) +
            wander * 0.00018
          ) * edgeMask;

          // 1b. Eye & mouth brush streaks disabled
          vec2 swipeVel = vec2(0.0);
          float swipeStrength = 0.0;
          float activeBristle = 0.5;
          float pastEyeMask = 0.0;
          float pastMouthMask = 0.0;
          float wetDarkDeposit = 0.0;

          float dtScale = clamp(u_dt * 60.0, 0.75, 4.0);
          swipeVel *= dtScale;

          float basePrevLum = dot(clamp(texture(u_feedback, v_uv).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float streakFadeMask = max(pastEyeMask, pastMouthMask);
          float smearFreeze = clamp(max(swipeStrength, streakFadeMask), 0.0, 1.0);

          float interiorCrisp = mix(0.18, 1.0, smoothstep(0.62, 0.96, r));
          float flowAmp = (u_flow_scale + u_tension * 0.002) * interiorCrisp * (1.0 + edgeMask * u_edge_curl * 0.75);
          vec2 flow = (curl * 0.72 + grad * 0.28) * flowAmp + smokeVel;
          flow *= (1.0 - clamp(smearFreeze * 0.94, 0.0, 0.94));
          flow += curl * (0.0020 * tearInk);
          flow.y -= 0.0022 * (0.45 * tearInk + 0.65 * tearBead);

          // Uniform pigment transport preserving exact portrait paint colors along smeared streaks
          vec2 advectedUV = clamp(v_uv - flow - swipeVel, 0.001, 0.999);
          vec4 prevFrame4 = texture(u_feedback, advectedUV);
          vec3 prevFrame = prevFrame4.rgb;
          float prevSmoke = prevFrame4.a;

          // Along-stroke wet-paint bristle cohesion + dark wet ink deposit across both eyes
          if (swipeStrength > 0.01) {
            vec2 stepBack = clamp(swipeVel, vec2(-0.024), vec2(0.024));
            vec3 trailA = texture(u_feedback, clamp(advectedUV - stepBack * 0.65, 0.001, 0.999)).rgb;
            vec3 trailB = texture(u_feedback, clamp(advectedUV - stepBack * 1.45, 0.001, 0.999)).rgb;
            vec3 wetDrag = 0.56 * prevFrame + 0.28 * trailA + 0.16 * trailB;
            prevFrame = mix(prevFrame, wetDrag, clamp(swipeStrength * 0.88, 0.0, 0.88));
            if (wetDarkDeposit > 0.002) {
              // Rich dark wet burnt-umber / charcoal oil paint so bristle texture stays clearly legible
              vec3 wetDarkInk = vec3(-0.48, -0.60, -0.64);
              float inkAlpha = clamp(wetDarkDeposit * 0.78 * dtScale, 0.0, 0.92);
              prevFrame = mix(prevFrame, wetDarkInk, inkAlpha);
            }
          }

          // Gentle cross-flow color blend pulling portrait tones into fine edge wisps
          vec2 diffOff = vec2(-flow.y, flow.x) * 0.85 + vec2(0.0007, 0.0007) * driftZone;
          vec4 diffuseA = texture(u_feedback, clamp(advectedUV + diffOff, 0.001, 0.999));
          vec4 diffuseB = texture(u_feedback, clamp(advectedUV - diffOff, 0.001, 0.999));
          vec3 innerColorA = texture(u_feedback, clamp(advectedUV - outDir * 0.004, 0.001, 0.999)).rgb;
          vec3 innerColorB = texture(u_feedback, clamp(advectedUV - outDir * 0.008, 0.001, 0.999)).rgb;
          vec3 blendedPortraitCol = mix(innerColorA, innerColorB, 0.40);
          vec4 diffuseAvg = 0.62 * prevFrame4 + 0.19 * diffuseA + 0.19 * diffuseB;
          prevFrame = mix(prevFrame, mix(diffuseAvg.rgb, blendedPortraitCol, 0.24 * edgeMask), driftZone * 0.36 * (1.0 - smearFreeze));
          prevSmoke = mix(prevSmoke, diffuseAvg.a, driftZone * 0.35 * (1.0 - smearFreeze));

          // 2. Dry-brush streaks right at the portrait rim + tear bleed
          vec2 dStreak = (v_uv.y < 0.42)
            ? vec2(0.0, 0.0075)
            : vec2(sign(v_uv.x - 0.5) * -0.0065, 0.0020);
          vec3 streakA = texture(u_feedback, clamp(v_uv + dStreak, 0.001, 0.999)).rgb;
          vec3 streakB = texture(u_feedback, clamp(v_uv + dStreak * 2.2, 0.001, 0.999)).rgb;
          float ridgeGate = smoothstep(0.04, 0.28, length(grad));
          float streakWeight = edgeMask * (1.0 - 0.85 * driftZone) * u_brush_streak * (0.35 + 0.65 * ridgeGate) * (1.0 - smearFreeze);
          vec3 brushedPrev = mix(prevFrame, max(prevFrame, (streakA * 0.65 + streakB * 0.35)), streakWeight);
          if (tearInk > 0.001) {
            vec3 tearSmear = 0.5 * texture(u_feedback, clamp(advectedUV + vec2(0.0014, 0.0045), 0.001, 0.999)).rgb
                           + 0.5 * texture(u_feedback, clamp(advectedUV + vec2(-0.0014, 0.0025), 0.001, 0.999)).rgb;
            brushedPrev = mix(brushedPrev, mix(brushedPrev, tearSmear, 0.42), clamp(tearInk * 0.85, 0.0, 1.0));
          }

          // Whisper-thin smoke seed & rapid close dissipation around 360° perimeter
          float prevLum = dot(clamp(prevFrame * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float silhouetteDrop = clamp((prevLum - nLum) * 6.0, 0.0, 1.0);
          float edgeGrad = smoothstep(0.018, 0.11, length(grad));
          float emitterZone = smoothstep(0.88, 1.00, rWisp) * (1.0 - smoothstep(1.06, 1.20, rWisp));
          float filamentShape = smoothstep(0.24, 0.78, 0.45 * sC + 0.55 * fC);
          float rimSource = emitterZone * clamp(edgeGrad * 0.80 + silhouetteDrop * 0.85, 0.0, 1.0) * smoothstep(0.042, 0.14, max(nLum, prevLum));
          float emitSmoke = rimSource * (0.30 + 0.82 * filamentShape);

          float filamentMask = smoothstep(0.26, 0.74, 0.60 * fC + 0.40 * tearFbm(v_uv * 9.0 + vec2(sin(u_time * 0.15), cos(u_time * 0.15))));
          float smokeDecay = (0.014 + 0.022 * (1.0 - filamentMask) + 0.024 * smoothstep(1.06, 1.38, r)) * (1.0 + 0.5 * (1.0 - voidFade));
          float carriedSmoke = prevSmoke * (1.0 - smokeDecay) * smoothstep(0.86, 0.98, r) * voidFade;
          float outSmoke = clamp(max(carriedSmoke, emitSmoke), 0.0, 1.0);

          // Hold smeared wet oil trails longer across thicker bristle crests and let completed streaks fade out over 30s
          float baseFresh = mix(u_fbo_blend, max(0.075, u_fbo_blend * (1.0 - 0.35 * clamp(u_edge_curl, 0.0, 1.3))), edgeMask);
          float smokeHold = smoothstep(0.90, 1.06, rWisp) * smoothstep(0.04, 0.40, outSmoke) * 0.80;
          float localFresh = mix(baseFresh, 0.024, smokeHold);
          float smearHold = 0.0040 + 0.0055 * (1.0 - smoothstep(0.22, 0.78, activeBristle));
          localFresh = mix(localFresh, smearHold, clamp(swipeStrength * 0.95, 0.0, 0.95));
          // Keep the eye brush streak permanently locked (do not fade out)
          localFresh = mix(localFresh, 0.0, clamp(streakFadeMask * (1.0 - swipeStrength), 0.0, 1.0));
          localFresh = mix(localFresh, 0.14, clamp(tearInk * 0.45, 0.0, 1.0));
          float effFresh = 1.0 - pow(max(0.0, 1.0 - localFresh), dtScale);
          vec3 blended = clamp(mix(brushedPrev, neural, effFresh), -1.0, 1.0);
          fragColor = vec4(blended, outSmoke);
        }
      `;

      // Pass 2: Sculptural Impasto Relief & Dichromatic Obsidian Chiaroscuro Grading
      const FS_GRADE = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_fbo;
        uniform float u_tension;
        uniform float u_gamma;
        uniform float u_crimson;
        uniform float u_bone;
        uniform float u_vig_pow;
        uniform float u_impasto;
        uniform float u_organic_edge;
        uniform vec2 u_parallax;
        uniform float u_time;

        void main() {
          // 2.5D depth-proxy parallax from local luminance relief
          float h0 = dot(clamp(texture(u_fbo, v_uv).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          vec2 pUV = clamp(v_uv + u_parallax * (0.018 * (h0 - 0.25)), 0.001, 0.999);

          vec4 raw4 = texture(u_fbo, pUV);
          vec3 raw = raw4.rgb;
          float smokeAmt = clamp(raw4.a, 0.0, 1.0);

          // Map [-1, 1] neural tensor to [0, 1] cleanly (all bending & glitch art comes natively from StyleGAN2 channel_mask)
          vec3 t = clamp(raw * 0.5 + 0.5, 0.0, 1.0);
          float lum = dot(t, vec3(0.299, 0.587, 0.114));
          float rGrade = length((pUV - vec2(0.50, 0.44)) / vec2(0.265, 0.370));
          float smokeGlow = 0.36 * smoothstep(0.04, 0.60, smokeAmt) * smoothstep(0.028, 0.090, lum) * smoothstep(0.88, 1.08, rGrade);

          // 1. High-relief 2.5D oil-impasto normal-map lighting & local micro-detail clarity
          vec2 px = vec2(1.0 / 1024.0);
          float hL  = dot(clamp(texture(u_fbo, pUV - vec2(px.x, 0.0)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float hR  = dot(clamp(texture(u_fbo, pUV + vec2(px.x, 0.0)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float hD  = dot(clamp(texture(u_fbo, pUV - vec2(0.0, px.y)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float hU  = dot(clamp(texture(u_fbo, pUV + vec2(0.0, px.y)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float hD2 = dot(clamp(texture(u_fbo, pUV - vec2(0.0, px.y * 2.5)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float hU2 = dot(clamp(texture(u_fbo, pUV + vec2(0.0, px.y * 2.5)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));

          vec2 pxW = px * 2.2;
          float bL = dot(clamp(texture(u_fbo, pUV - vec2(pxW.x, 0.0)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float bR = dot(clamp(texture(u_fbo, pUV + vec2(pxW.x, 0.0)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float bD = dot(clamp(texture(u_fbo, pUV - vec2(0.0, pxW.y)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float bU = dot(clamp(texture(u_fbo, pUV + vec2(0.0, pxW.y)).rgb * 0.5 + 0.5, 0.0, 1.0), vec3(0.299, 0.587, 0.114));
          float localAvg = 0.5 * ((hL + hR + hD + hU) * 0.25) + 0.5 * ((bL + bR + bD + bU) * 0.25);
          float detailGate = smoothstep(0.04, 0.16, lum) * (1.0 - smoothstep(0.95, 1.25, rGrade));
          float microDetail = clamp((lum - localAvg) * 1.45, -0.12, 0.12) * detailGate;
          t = clamp(t + vec3(microDetail), 0.0, 1.0);
          lum = clamp(lum + microDetail, 0.0, 1.0);

          float ridgeRelief = clamp(abs(hD - hU) * 12.0 + abs(hD2 - hU2) * 7.0, 0.0, 1.0);
          vec3 surfN = normalize(vec3((hL - hR) * 6.0, (hD - hU) * 7.0, 0.24));
          vec3 keyL = normalize(vec3(-0.52, 0.58, 0.62));
          vec3 halfV = normalize(keyL + vec3(0.0, 0.0, 1.0));
          float spec = pow(max(dot(surfN, halfV), 0.0), 32.0);
          float lap = (hL + hR + hD + hU) * 0.25 - lum;
          float crevice = clamp(lap * 11.0, 0.0, 0.45);

          // 2. Soft orbital socket depth (FFHQ eye band)
          vec2 eL = (pUV - vec2(0.37, 0.530)) / vec2(0.095, 0.068);
          vec2 eR = (pUV - vec2(0.63, 0.530)) / vec2(0.095, 0.068);
          vec2 eMid = (pUV - vec2(0.50, 0.550)) / vec2(0.080, 0.055);
          float eyeHollow = clamp(exp(-dot(eL, eL)) + exp(-dot(eR, eR)) + 0.55 * exp(-dot(eMid, eMid)), 0.0, 1.0);

          // 3. Compensate generator radial falloff across chin, jaw, forehead, crown & lateral cheeks
          vec2 cChin = (pUV - vec2(0.50, 0.125)) / vec2(0.30, 0.140);
          vec2 cJaw = (pUV - vec2(0.50, 0.205)) / vec2(0.35, 0.145);
          vec2 cBrow = (pUV - vec2(0.50, 0.78)) / vec2(0.29, 0.16);
          vec2 cCrown = (pUV - vec2(0.50, 0.87)) / vec2(0.26, 0.12);
          vec2 cSideL = (pUV - vec2(0.27, 0.46)) / vec2(0.16, 0.32);
          vec2 cSideR = (pUV - vec2(0.73, 0.46)) / vec2(0.16, 0.32);
          float vigGate = smoothstep(0.028, 0.082, lum);
          float chinVigGate = smoothstep(0.022, 0.068, lum);
          float chinShadowMask = 1.0 - 0.50 * smoothstep(0.20, 0.46, lum);
          float chinShape = exp(-dot(cChin, cChin));
          float chinBoost = (1.58 * chinShape + 0.64 * exp(-dot(cJaw, cJaw))) * chinShadowMask * chinVigGate;
          float lumLift = chinBoost + (
            0.42 * exp(-dot(cBrow, cBrow)) +
            0.38 * exp(-dot(cCrown, cCrown)) +
            0.58 * (exp(-dot(cSideL, cSideL)) + exp(-dot(cSideR, cSideR)))
          ) * vigGate;
          float chinFloor = 0.052 * chinShape * chinVigGate;
          float balLum = max(0.0, lum * (1.0 + lumLift) + chinFloor - 0.032 * eyeHollow);
          float smokeShadowMask = 1.0 - smoothstep(0.14, 0.28, balLum);
          balLum += smokeGlow * smokeShadowMask * (0.13 + 0.85 * lum);

          // Chiaroscuro S-curve preserving full neural-bent colors & contours
          float stretched = smoothstep(0.025, 0.90, balLum);
          float gammaEff = mix(u_gamma, 1.04, smokeGlow * smokeShadowMask * 0.76);
          float curved = pow(max(stretched, 1e-4), gammaEff);
          float contrast = clamp(mix(curved, curved * curved * (3.0 - 2.0 * curved), 0.40) - crevice * u_impasto * (0.65 + 0.95 * ridgeRelief), 0.0, 1.0);

          // 4. Painterly Chiaroscuro Oil Palette (preserves native network-bent chromatic richness)
          vec3 burntUmber  = vec3(0.0);                       // #000000
          vec3 venousSlate = vec3(0.1098, 0.1333, 0.1686);    // #1c222b
          vec3 subCrimson  = vec3(0.4314, 0.1686, 0.1373);    // #6e2b23
          vec3 paleBone    = vec3(0.8471, 0.7961, 0.7216);    // #d8cbb8

          vec3 chiTone = mix(burntUmber, venousSlate, smoothstep(0.015, 0.22, contrast));
          float fleshDrive = clamp(t.r * 0.65 + (1.0 - t.b) * 0.35, 0.0, 1.0);
          float crimsonMix = smoothstep(0.12, 0.52, fleshDrive * 0.4 + contrast * 0.6) * u_crimson;
          chiTone = mix(chiTone, subCrimson, clamp(crimsonMix, 0.0, 1.0));
          chiTone = mix(chiTone, paleBone, smoothstep(0.58, 0.94, contrast) * u_bone);

          float safeLum = max(lum, 0.055);
          vec3 rawHueScale = clamp(t / safeLum, vec3(0.42), vec3(1.85));
          vec3 tintedChi = clamp(chiTone * mix(vec3(1.0), rawHueScale, 0.58), 0.0, 1.0);
          vec3 naturalGraded = clamp(t * (contrast / safeLum), 0.0, 1.0);
          vec3 col = mix(naturalGraded, tintedChi, 0.28);
          col += paleBone * spec * u_impasto * (0.16 + 0.55 * stretched + 0.90 * ridgeRelief);

          // Keep subtle portrait colors in outer wisps with restrained attenuation
          float outerDim = smoothstep(0.96, 1.34, rGrade) * smoothstep(0.04, 0.42, smokeAmt) * 0.18;
          col *= (1.0 - outerDim);

          // 5. Clean frame-edge fade to exact #000000 black
          float boxFade = 1.0 - smoothstep(0.45, 0.498, max(abs(v_uv.x - 0.5), abs(v_uv.y - 0.5)));
          float mask = boxFade * smoothstep(0.012, 0.052, balLum);
          col *= mask;

          // Interleaved gradient noise dither (scaled by mask so outer void stays exact #000000)
          float dither = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) - 0.5;
          col = clamp(col + dither * (1.5 / 255.0) * smoothstep(0.02, 0.25, mask), 0.0, 1.0);

          fragColor = vec4(col, 1.0);
        }
      `;

      // Pass 1.5: Continuous 512x512 GPU Chimera Depth Stitching & Spring-Damper Integrator
      // Constantly stitches the 5 live depth maps (host + 4 anatomical donors) in lockstep with FS_CHIMERA so 3D shape always matches the face
      const FS_DEPTH_SIM = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;

        uniform sampler2D u_prev_state;  // r: currDepth, g: velDepth, b: smoothActivity, a: targetChimeraDepth
        uniform sampler2D u_d_host;
        uniform sampler2D u_d0;
        uniform sampler2D u_d1;
        uniform sampler2D u_d2;
        uniform sampler2D u_d3;
        uniform sampler2D u_fbo;
        uniform sampler2D u_fbo_prev;
        uniform vec2 u_spot;             // GL orientation (y=0 bottom, y=1 top)
        uniform float u_radius;
        uniform float u_chimera_blend;
        uniform float u_dt;
        uniform float u_init;

        float simHash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        void main() {
          // Depth maps & FFHQ landmarks are top-to-bottom (nUV.y = 0 top, 1 bottom)
          vec2 nUV = vec2(v_uv.x, 1.0 - v_uv.y);
          float dHost = texture(u_d_host, nUV).r;
          if (u_init > 0.5) {
            fragColor = vec4(dHost, 0.0, 0.0, dHost);
            return;
          }

          float d0 = texture(u_d0, nUV).r;
          float d1 = texture(u_d1, nUV).r;
          float d2 = texture(u_d2, nUV).r;
          float d3 = texture(u_d3, nUV).r;

          // Exact same pair-of-eyes anatomical ellipses as FS_CHIMERA
          vec2 e0 = (nUV - vec2(0.24, 0.50)) / vec2(0.22, 0.22);
          vec2 e1 = (nUV - vec2(0.76, 0.50)) / vec2(0.22, 0.22);
          vec2 e2 = (nUV - vec2(0.50, 0.46)) / vec2(0.18, 0.26);
          vec2 e3 = (nUV - vec2(0.50, 0.74)) / vec2(0.38, 0.20);
          float w0 = exp(-0.5 * dot(e0, e0));
          float w1 = exp(-0.5 * dot(e1, e1));
          float w2 = exp(-0.5 * dot(e2, e2));
          float w3 = exp(-0.5 * dot(e3, e3));
          float featureMask = min(1.0, w0 + w1 + w2 + w3);
          float wSum = w0 + w1 + w2 + w3 + 1e-5;
          w0 /= wSum; w1 /= wSum; w2 /= wSum; w3 /= wSum;

          vec2 spotN = vec2(u_spot.x, 1.0 - u_spot.y);
          vec2 df = nUV - spotN;
          float d2Spot = dot(df, df);
          float focus = exp(-d2Spot / (2.0 * u_radius * u_radius));
          float patchR = max(u_radius * 2.05, 0.150);
          float patchMask = exp(-d2Spot / (2.0 * patchR * patchR));
          float stitchMask = min(1.0, featureMask * patchMask * 1.35);

          float donorD = d0 * w0 + d1 * w1 + d2 * w2 + d3 * w3;
          float chimeraD = mix(dHost, donorD, stitchMask);

          vec4 st = texture(u_prev_state, v_uv);
          float currD = st.r;
          float velD = st.g;
          float act = st.b;
          float prevTargetD = st.a;

          // Advance live composite depth target at the exact same piecewise rate as FS_CHIMERA
          float dtStep = clamp(u_dt * 28.0, 0.25, 2.0);
          float localBlend = 1.0 - pow(max(0.0, 1.0 - (0.006 + patchMask * (u_chimera_blend * 0.65) + focus * (u_chimera_blend * 0.35))), dtStep);
          float targetD = mix(prevTargetD, chimeraD, localBlend);

          // Unique per-particle random inertia & reaction speed (fast ~0.8s to slow ~3.5s)
          vec2 cell = floor(v_uv * 640.0);
          float r1 = simHash(cell + vec2(3.1, 7.7));
          float r2 = simHash(cell + vec2(19.3, 5.4));

          vec3 cNow = clamp(texture(u_fbo, v_uv).rgb * 0.5 + 0.5, 0.0, 1.0);
          vec3 cPrev = clamp(texture(u_fbo_prev, v_uv).rgb * 0.5 + 0.5, 0.0, 1.0);
          float colRate = smoothstep(0.008, 0.045, length(cNow - cPrev));

          float dt = clamp(u_dt, 0.004, 0.05);
          // Continuous critically-damped spring tracking the live composite depth (zero snapping!)
          float omega = 1.15 + 2.85 * r1;
          float diff = targetD - currD;
          float accel = diff * (omega * omega) - velD * (2.10 * omega + 0.60 * r2);
          velD = clamp(velD + accel * dt, -0.95, 0.95);
          currD = clamp(currD + velD * dt, 0.0, 1.0);

          // Smoothly integrate kinetic activity (rises gently when moving or blending, decays smoothly)
          float targetAct = clamp(abs(velD) * 4.5 + colRate * patchMask * 0.95, 0.0, 1.0);
          float actRate = targetAct > act ? (4.0 * dt) : (1.8 * dt);
          act = clamp(mix(act, targetAct, clamp(actRate, 0.0, 1.0)), 0.0, 1.0);

          fragColor = vec4(currD, velD, act, targetD);
        }
      `;

      // Pass 2: 3D Neural Depth-Map Particle Portrait (continuous zero-snap spring physics + critic spotlight + DoF bokeh)
      const VS_PARTICLES = `#version 300 es
        precision highp float;
        precision highp int;
        layout(location = 0) in vec2 a_uv;
        layout(location = 1) in vec2 a_seed;

        uniform sampler2D u_fbo;
        uniform sampler2D u_depth_state;
        uniform float u_time;
        uniform vec3 u_cam; // x: yaw, y: pitch, z: distance
        uniform vec3 u_cam_handheld; // x: roll (rad), y: panX, z: panY
        uniform float u_aspect;
        uniform vec2 u_spot;
        uniform float u_gamma;
        uniform float u_crimson;
        uniform float u_bone;
        uniform vec2 u_tear_origin;
        uniform float u_tear_head_y;
        uniform float u_tear_alpha;
        uniform float u_tear_dir;
        uniform vec2 u_blink;        // Blink-to-Transform: left/right eyelid blink [0..1]
        uniform float u_pupil_dil;   // Tension-driven pupil dilation [-1..+1]
        uniform float u_shed;        // Iris colour shedding progress [0..1]
        uniform vec4 u_pupils;       // Exact 1024x1024 detected left (xy) & right (zw) pupil centers in GL UV
        uniform vec3 u_eye_geom_l;   // Left eye exact 1024x1024 geometry: x=rIris, y=upOff, z=loOff
        uniform vec3 u_eye_geom_r;   // Right eye exact 1024x1024 geometry: x=rIris, y=upOff, z=loOff
        uniform vec2 u_saccade;      // Micro-saccade peripheral glance offset in UV
        uniform float u_cornea_only; // Mode 2: high-contrast greyscale everywhere except the two corneas/irises [0..1]
        uniform vec3 u_iris_tint;    // Target iris pigment (Blue, Red, Green, Brown, Cyan, Hazel)
        uniform float u_crt_static;  // Detuned CRT TV white-noise static on cornea & pupil [0..1]
        uniform float u_crt_burst;   // 3D particle burst flying toward viewer (+Z) from white-noise eyes [0..1]
        uniform vec4 u_fx;           // Novel events: x=eclipse, y=unused, z=unused, w=ignition
        uniform int u_frame;

        out vec3 v_col;
        out float v_alpha;
        out float v_bokeh;

        uvec3 pcg3dV(uvec3 v) {
          v = v * 1664525u + 1013904223u;
          v.x += v.y * v.z;
          v.y += v.z * v.x;
          v.z += v.x * v.y;
          v ^= v >> 16u;
          v.x += v.y * v.z;
          v.y += v.z * v.x;
          v.z += v.x * v.y;
          return v;
        }

        void main() {
          vec2 pL = u_pupils.xy;
          vec2 pR = u_pupils.zw;
          vec2 sampleUV = a_uv;

          // Micro-Saccade Glance (Idea 1): both pupils/irises dart subtly in unison inside the stationary eyelids
          if (abs(u_saccade.x) > 1e-5 || abs(u_saccade.y) > 1e-5) {
            vec2 oL = (a_uv - pL) / vec2(0.088, 0.132);
            vec2 oR = (a_uv - pR) / vec2(0.088, 0.132);
            float eyeOpenL = smoothstep(1.0, 0.36, length(oL));
            float eyeOpenR = smoothstep(1.0, 0.36, length(oR));
            sampleUV -= u_saccade * max(eyeOpenL, eyeOpenR);
            pL += u_saccade;
            pR += u_saccade;
          }

          // Tension-driven pupil dilation (strictly inside the iris: expands/contracts ONLY the pupil, outer limbal ring stays locked)
          if (abs(u_pupil_dil) > 0.002) {
            vec2 dL = a_uv - pL;
            vec2 dR = a_uv - pR;
            vec2 cL = vec2(dL.x * 2.3, dL.y);
            vec2 cR = vec2(dR.x * 2.3, dR.y);
            float rL = length(cL);
            float rR = length(cR);
            // Peak strictly at the pupil margin (~0.042) and fall to 0.0 before the outer iris/cornea rim (~0.108)
            float mL = smoothstep(0.008, 0.042, rL) * smoothstep(0.108, 0.050, rL);
            float mR = smoothstep(0.008, 0.042, rR) * smoothstep(0.108, 0.050, rR);
            vec2 dirL = (cL / max(rL, 1e-4)) * vec2(1.0 / 2.3, 1.0);
            vec2 dirR = (cR / max(rR, 1e-4)) * vec2(1.0 / 2.3, 1.0);
            sampleUV -= (dirL * mL + dirR * mR) * (u_pupil_dil * 0.015);
          }

          // Idea 1: Blink-to-Transform (upper eyelid sweeps smoothly down over each live eye opening in 3D)
          float blinkMask = 0.0;
          float blinkCrease = 0.0;
          if (u_blink.x > 0.002 || u_blink.y > 0.002) {
            for (int side = 0; side < 2; side++) {
              float b = (side == 0) ? u_blink.x : u_blink.y;
              if (b <= 0.002) continue;
              vec2 ec = (side == 0) ? pL : pR;
              vec2 ed = (a_uv - ec) / vec2(0.185, 0.175);
              float inEye = smoothstep(1.05, 0.35, length(ed));
              float lidY = mix(ec.y + 0.18, ec.y - 0.16, b);
              float underLid = smoothstep(lidY - 0.045, lidY + 0.035, a_uv.y) * inEye * b;
              float crease = exp(-((a_uv.y - lidY) / 0.016) * ((a_uv.y - lidY) / 0.016)) * inEye * b;
              if (underLid > 0.005) {
                sampleUV.y = mix(sampleUV.y, clamp(a_uv.y + 0.20 * b, 0.01, 0.98), underLid);
                blinkMask = max(blinkMask, underLid);
              }
              blinkCrease = max(blinkCrease, crease);
            }
          }
          sampleUV = clamp(sampleUV, 0.002, 0.998);
          vec4 raw4 = texture(u_fbo, sampleUV);
          vec3 t = clamp(raw4.rgb * 0.5 + 0.5, 0.0, 1.0);
          float lum = dot(t, vec3(0.299, 0.587, 0.114));

          // Read continuous spring-integrated per-particle depth, velocity & activity (zero snapping!)
          vec4 dState = texture(u_depth_state, a_uv);
          float depth = dState.r;
          float velD = dState.g;
          float act = dState.b;

          // Wide, deeply feathered organic top/bottom fade into #000000 across the FULL horizontal width (zero dark gap before side-rain)
          float topWave = 0.028 * sin(a_uv.x * 9.4 + 0.7) + 0.018 * cos(a_uv.x * 15.7 - 1.1);
          float botWave = 0.028 * cos(a_uv.x * 8.6 - 0.5) + 0.018 * sin(a_uv.x * 14.3 + 0.9);
          float bottomFade = smoothstep(0.04, 0.30, a_uv.y + botWave + (a_seed.y - 0.5) * 0.14);
          float topFade    = smoothstep(0.05, 0.32, (1.0 - a_uv.y) + topWave + (a_seed.x - 0.5) * 0.14);
          float borderFade = bottomFade * topFade;

          // Smooth, jittered organic probability ramp for constant horizontal side-rain
          // Expands inward at the upper & lower corners (above brows / below cheeks) while keeping both eyes crisp
          float distFromSide = min(a_uv.x, 1.0 - a_uv.x);
          float vertOut = smoothstep(0.14, 0.42, abs(a_uv.y - 0.50));
          float sideReach = mix(0.24, 0.41, vertOut);
          float rainWave = 0.032 * sin(a_uv.y * 11.0 + 0.5) + 0.020 * cos(a_uv.y * 19.0 - 1.1);
          float jitteredSide = distFromSide + rainWave + (a_seed.y - 0.5) * 0.075;
          float rainProb = smoothstep(sideReach, 0.01, jitteredSide) * 0.94;
          bool isSideRain = (rainProb > 0.001) && (a_seed.x < rainProb) && (lum > 0.012);

          // Identical vertical feather for BOTH portrait & rain + wide dissolution of anchored edge (zero step)
          float thinMask = smoothstep(0.0, 0.50, borderFade - a_seed.x * 0.48);
          float vertFade = pow(clamp(borderFade, 0.0, 1.0), 1.35) * thinMask;
          float anchorEdge = isSideRain ? 1.0 : smoothstep(0.0, 0.135 + 0.06 * vertOut, jitteredSide);
          float softFade = vertFade * anchorEdge;
          float headVis = smoothstep(0.004, 0.045, lum) * softFade;
          if (headVis <= 0.006 && !isSideRain) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            gl_PointSize = 0.0;
            v_col = vec3(0.0);
            v_alpha = 0.0;
            v_bokeh = 0.0;
            return;
          }

          // Subtle convex 3D spherical eyeball + corneal dome locked to exact live detected pupils (u_pupils)
          vec2 ebL = (a_uv - pL) / vec2(0.105, 0.165);
          vec2 ebR = (a_uv - pR) / vec2(0.105, 0.165);
          float ebR2L = dot(ebL, ebL);
          float ebR2R = dot(ebR, ebR);
          float ebMaskL = smoothstep(1.02, 0.38, sqrt(ebR2L));
          float ebMaskR = smoothstep(1.02, 0.38, sqrt(ebR2R));
          float sphereL = sqrt(max(0.0, 1.0 - min(ebR2L, 1.0))) * ebMaskL;
          float sphereR = sqrt(max(0.0, 1.0 - min(ebR2R, 1.0))) * ebMaskR;
          // Subtle corneal dome directly over each live iris
          vec2 coL = (a_uv - pL) / vec2(0.055, 0.095);
          vec2 coR = (a_uv - pR) / vec2(0.055, 0.095);
          float corneaL = sqrt(max(0.0, 1.0 - min(dot(coL, coL), 1.0))) * smoothstep(1.0, 0.38, length(coL));
          float corneaR = sqrt(max(0.0, 1.0 - min(dot(coR, coR), 1.0))) * smoothstep(1.0, 0.38, length(coR));
          float eyeballBulge = (sphereL + sphereR) * 0.11 + (corneaL + corneaR) * 0.04;
          float eyeballBlend = clamp(max(ebMaskL, ebMaskR), 0.0, 1.0);

          // Real 3D surface normal from the continuous depth state field + subtle convex eyeball sphere normal
          float eps = 1.0 / 640.0;
          float dL = texture(u_depth_state, a_uv - vec2(eps, 0.0)).r;
          float dR = texture(u_depth_state, a_uv + vec2(eps, 0.0)).r;
          float dD = texture(u_depth_state, a_uv - vec2(0.0, eps)).r;
          float dU = texture(u_depth_state, a_uv + vec2(0.0, eps)).r;
          vec3 dNorm = normalize(vec3((dL - dR) * 6.5, (dD - dU) * 6.5, 0.34));
          if (eyeballBlend > 0.005) {
            vec2 ebXY = (ebMaskL >= ebMaskR) ? ebL : ebR;
            float ebZ = max(0.32, (ebMaskL >= ebMaskR) ? sphereL : sphereR);
            vec3 sphereNorm = normalize(vec3(ebXY.x * 0.72, ebXY.y * 0.72, ebZ * 1.25));
            dNorm = normalize(mix(dNorm, sphereNorm, eyeballBlend * 0.45));
          }
          vec3 keyL = normalize(vec3(-0.45, 0.52, 0.72));
          float ndl = max(dot(dNorm, keyL), 0.0);
          vec3 halfV = normalize(keyL + vec3(0.0, 0.0, 1.0));
          float spec3d = pow(max(dot(dNorm, halfV), 0.0), 28.0);

          // General 3D lighting boosted 50% brighter (1.5x diffuse & specular)
          float stretched = smoothstep(0.025, 0.90, lum * (1.23 + 0.66 * ndl));
          float curved = pow(max(stretched, 1e-4), u_gamma);
          float contrast = clamp(mix(curved, curved * curved * (3.0 - 2.0 * curved), 0.42), 0.0, 1.0);

          vec3 burntUmber  = vec3(0.0);
          vec3 venousSlate = vec3(0.1098, 0.1333, 0.1686);
          vec3 subCrimson  = vec3(0.4314, 0.1686, 0.1373);
          vec3 paleBone    = vec3(0.8471, 0.7961, 0.7216);

          vec3 chiTone = mix(burntUmber, venousSlate, smoothstep(0.015, 0.22, contrast));
          float fleshDrive = clamp(t.r * 0.65 + (1.0 - t.b) * 0.35, 0.0, 1.0);
          chiTone = mix(chiTone, subCrimson, clamp(smoothstep(0.12, 0.52, fleshDrive * 0.4 + contrast * 0.6) * u_crimson, 0.0, 1.0));
          chiTone = mix(chiTone, paleBone, smoothstep(0.58, 0.94, contrast) * u_bone);

          float safeLum = max(lum, 0.055);
          vec3 rawHueScale = clamp(t / safeLum, vec3(0.45), vec3(1.85));
          vec3 tintedChi = clamp(chiTone * mix(vec3(1.0), rawHueScale, 0.56), 0.0, 1.0);
          vec3 naturalGraded = clamp(t * (contrast / safeLum), 0.0, 1.0);
          vec3 col = naturalGraded;
          // True HDR 3D specular & corneal catchlight emission (unclamped > 1.0 in RGBA16F, neutral so baked greyscale stays pure)
          float catchlightHdr = smoothstep(0.76, 0.98, lum) * (0.45 + 1.35 * eyeballBlend);
          col += vec3(0.98, 0.99, 1.0) * spec3d * 0.56 * smoothstep(0.25, 0.85, depth);
          col += vec3(1.0, 0.99, 0.98) * (catchlightHdr * 1.15);

          // 3D sculpted pair-of-eyes coordinates (exact 2.3:1 aspect ratio + convex spherical eyeball bulge)
          vec3 pos = vec3(
            (a_uv.x - 0.5) * 2.30,
            (a_uv.y - 0.5) * 1.00,
            (depth - 0.45) * 1.18 + eyeballBulge
          );

          // Apply 3D eyelid bulge & subtle lash-line shadow during Blink-to-Transform (Idea 1)
          if (blinkMask > 0.005 || blinkCrease > 0.005) {
            pos.z += blinkMask * 0.055;
            col *= (1.0 - blinkCrease * 0.42);
          }

          // Idea 6: Iris Colour Shedding (sparse coloured iris particles lift off into 3D DoF bokeh on eye transition)
          float shedFade = 1.0;
          if (u_shed > 0.002 && a_seed.x > 0.855) {
            vec2 sL = (a_uv - pL) / vec2(0.11, 0.15);
            vec2 sR = (a_uv - pR) / vec2(0.11, 0.15);
            float inIris = clamp(max(exp(-dot(sL, sL) * 1.8), exp(-dot(sR, sR) * 1.8)), 0.0, 1.0);
            if (inIris > 0.15 && lum > 0.06) {
              float sp = u_shed;
              float ease = sp * (2.0 - sp);
              float ang = a_seed.y * 6.28318 + sp * 2.2;
              vec2 outVec = (a_uv.x < 0.5) ? normalize(sL + vec2(1e-4)) : normalize(sR + vec2(1e-4));
              pos.xy += (outVec * 0.24 + vec2(cos(ang), sin(ang) + 0.45) * 0.08) * ease * inIris;
              pos.z  += (0.28 * ease + 0.06 * sin(ang)) * inIris;
              col = clamp(col * 1.45, 0.0, 4.0);
              shedFade = 1.0 - smoothstep(0.45, 1.0, sp) * inIris;
            }
          }

          // 1. Smooth, continuous 3D swirling arc driven strictly by integrated particle activity (zero snapping)
          if (act > 0.004) {
            float ang = a_seed.x * 6.28318 + a_seed.y * 3.14159 + u_time * (0.85 + 1.15 * a_seed.y);
            float arcAmp = act * (0.055 + 0.22 * abs(velD) + 0.055 * a_seed.y);
            vec3 reformArc = vec3(
              cos(ang) * 0.58,
              sin(ang * 1.15) * 0.58,
              0.72 + 0.28 * sin(ang * 0.7)
            ) * arcAmp;
            pos += reformArc;
            col = clamp(col + paleBone * (act * 0.24), 0.0, 4.0);
          }

          // 2b. Wide, silky edge particle feathering along the top & bottom perimeter (left/right flow directly into side-rain)
          vec2 fromC = a_uv - vec2(0.50, 0.50);
          float rEdge = abs(fromC.y) / 0.30;
          float edgeZone = smoothstep(0.74, 1.18, rEdge);
          float radialAng = atan(fromC.y, fromC.x);
          vec2 outDir = normalize(vec2(fromC.x * 0.35, sign(fromC.y) + 1e-4));
          vec2 perpDir = vec2(-outDir.y, outDir.x);
          float clump = 0.80 + 0.12 * sin(radialAng * 5.0 + u_time * 0.12)
                             + 0.08 * cos(radialAng * 9.0 - u_time * 0.09);
          float radialSpread = pow(a_seed.x, 2.15);
          float breath = 0.90 + 0.14 * sin(u_time * (0.30 + 0.42 * a_seed.y) + a_seed.x * 12.56);
          float scatterDist = edgeZone * radialSpread * (0.30 * clump) * breath;
          float sideJitter = (a_seed.y - 0.5) * 0.09 * edgeZone * pow(a_seed.x, 1.6);
          pos.xy += outDir * scatterDist + perpDir * sideJitter;
          pos.z  += (a_seed.y - 0.52) * 0.18 * edgeZone * pow(a_seed.x, 1.5);
          float scatterLift = smoothstep(0.015, 0.13, scatterDist);
          col = clamp(col * (1.0 + 0.16 * scatterLift), 0.0, 4.0);
          float edgeFade = 1.0 - smoothstep(0.11, 0.32, scatterDist);

          // 2b.5 Constant horizontal particle rain peeling seamlessly off the left/right edges & upper/lower corners
          if (isSideRain) {
            float sideDir = (a_uv.x < 0.5) ? -1.0 : 1.0;
            float speed = 0.06 + 0.095 * a_seed.y;
            float phase = fract(u_time * speed + a_seed.x * 7.31 + a_uv.y * 2.17 + a_seed.y * 3.19);
            float rainNorm = clamp(rainProb / 0.94, 0.0, 1.0);
            float travel = (1.35 + 1.25 * a_seed.y) * (0.55 + 0.45 * rainNorm) * (0.16 * phase + 0.84 * phase * phase);
            pos.x += sideDir * travel;
            // Gentle vertical fan-out into the upper & lower corners as particles stream outward
            pos.y += (a_uv.y - 0.50) * (0.24 * phase)
                   + (a_seed.y - 0.5) * 0.048 * phase
                   + sin(phase * 6.28318 + a_seed.x * 19.0) * 0.011 * phase;
            pos.z += (a_seed.x - 0.5) * 0.16 * phase;
            float rainEnv = 1.0 - smoothstep(0.66, 1.0, phase);
            float cornerLift = smoothstep(0.01, 0.22, min(a_uv.y, 1.0 - a_uv.y) + (a_seed.y - 0.5) * 0.14);
            float rainVert = mix(vertFade, cornerLift, 0.50 * vertOut * smoothstep(0.0, 0.20, phase));
            headVis = smoothstep(0.004, 0.045, lum) * rainVert * rainEnv;
            edgeFade = 1.0;
          }

          // 2c. Refractive glass-like 3D teardrop & wet capillary trail rendered strictly on the 1x1 particles
          if (u_tear_alpha > 0.005) {
            float dropDist = max(0.0, u_tear_origin.y - u_tear_head_y);
            float tSpan = clamp((u_tear_origin.y - a_uv.y) / 0.24, 0.0, 1.0);
            float tMeander = u_tear_dir * 0.012 * smoothstep(0.0, 0.78, tSpan)
                           + 0.0032 * sin(a_uv.y * 26.0 + u_tear_origin.x * 19.0 + u_time * 0.14) * smoothstep(0.0, 0.25, tSpan);
            float tDx = a_uv.x - (u_tear_origin.x + tMeander);

            // Teardrop dome coordinates (prominent aspect-corrected 2.3:1 liquid glass bulb, tapered top)
            float dyDrop = a_uv.y - u_tear_head_y;
            float rxDrop = 0.0112 * (1.0 - 0.24 * clamp(dyDrop / 0.032, -0.35, 1.0));
            float ryDrop = 0.0320;
            vec2 bUV = vec2(tDx / max(rxDrop, 1e-4), dyDrop / ryDrop);
            float r2Drop = dot(bUV, bUV);
            float domeMask = smoothstep(1.06, 0.58, r2Drop);
            float domeH = sqrt(max(0.0, 1.0 - min(r2Drop, 1.0)));

            // Well-up liquid meniscus inside the white sclera corner before drop detaches
            float poolFade = 1.0 - smoothstep(0.015, 0.095, dropDist);
            vec2 pUV = vec2(tDx / 0.0125, (a_uv.y - u_tear_origin.y) / 0.0245);
            float r2Pool = dot(pUV, pUV);
            float poolMask = smoothstep(1.05, 0.52, r2Pool) * poolFade;
            float poolH = sqrt(max(0.0, 1.0 - min(r2Pool, 1.0))) * poolFade;

            // Combined 3D liquid glass dome mask & surface normal
            float glassMask = clamp(max(domeMask, poolMask), 0.0, 1.0) * u_tear_alpha;
            float glassH = max(domeH * domeMask, poolH * poolMask);
            vec2 normXY = (domeMask >= poolMask) ? bUV : pUV;
            vec3 dropNorm = normalize(vec3(normXY.x * 1.15, normXY.y * 1.15, max(0.18, glassH * 1.35)));

            // Crisp contact shadow directly underneath the lower-right rim (makes clear glass pop off skin)
            vec2 shUV = vec2((tDx - 0.0032) / (rxDrop * 1.22), (dyDrop + 0.0092) / (ryDrop * 1.15));
            float contactShadow = exp(-dot(shUV, shUV) * 1.55) * (1.0 - domeMask * 0.78) * u_tear_alpha;
            col *= (1.0 - contactShadow * 0.65);

            // Transparent wet capillary trail above the falling drop (damp darkening + crisp specular ridge)
            float tLen = max(0.014, dropDist);
            float relHead = clamp((a_uv.y - u_tear_head_y) / tLen, 0.0, 1.0);
            float fadeEye = 1.0 - smoothstep(0.05, 0.92, relHead);
            float inTrack = (1.0 - smoothstep(u_tear_origin.y - 0.006, u_tear_origin.y + 0.006, a_uv.y))
                          * smoothstep(u_tear_head_y - 0.004, u_tear_head_y + 0.018, a_uv.y);
            float trackProfile = exp(-(tDx / 0.0046) * (tDx / 0.0046) * 0.90) * inTrack * (0.26 + 0.74 * fadeEye) * (1.0 - domeMask);
            float trackSpec = exp(-((tDx + 0.0014) / 0.0024) * ((tDx + 0.0014) / 0.0024)) * inTrack * fadeEye * (1.0 - domeMask);
            col *= (1.0 - trackProfile * 0.32 * u_tear_alpha);
            col = clamp(col + vec3(0.88, 0.95, 1.0) * (trackSpec * 0.72 * u_tear_alpha), 0.0, 4.0);
            pos.z += trackProfile * 0.022 * u_tear_alpha;

            // Real optical Snell refraction + subtle glass chromatic dispersion through the 3D liquid dome
            if (glassMask > 0.01) {
              vec2 refrOffset = dropNorm.xy * vec2(0.018, 0.042) * glassMask;
              vec2 disp = dropNorm.xy * vec2(0.0022, 0.0048) * glassMask;
              float rR = clamp(texture(u_fbo, clamp(a_uv - refrOffset + disp, 0.002, 0.998)).r * 0.5 + 0.5, 0.0, 1.0);
              float rG = clamp(texture(u_fbo, clamp(a_uv - refrOffset,        0.002, 0.998)).g * 0.5 + 0.5, 0.0, 1.0);
              float rB = clamp(texture(u_fbo, clamp(a_uv - refrOffset - disp, 0.002, 0.998)).b * 0.5 + 0.5, 0.0, 1.0);
              vec3 refrCol = vec3(rR, rG, rB) * 1.28;

              // Strong Fresnel glass rim + bright HDR pinpoint specular catchlight + warm focused lower-rim caustic
              float fresnel = pow(1.0 - max(dropNorm.z, 0.0), 2.3);
              float specPin = pow(max(dot(dropNorm, halfV), 0.0), 48.0);
              vec3 causticDir = normalize(vec3(0.45, -0.58, 0.68));
              float caustic = pow(max(dot(dropNorm, causticDir), 0.0), 4.0) * smoothstep(0.12, 0.72, r2Drop);

              // Clear glass body shows refracted skin/eye magnified underneath + luminous HDR glass reflections
              vec3 glassCol = refrCol * mix(vec3(0.95, 0.99, 1.04), vec3(1.18, 1.22, 1.26), caustic * 0.75);
              glassCol += vec3(0.84, 0.92, 1.0) * (fresnel * 0.82);
              glassCol += vec3(1.0, 0.99, 0.97) * (specPin * 2.15 + caustic * 0.58);
              col = mix(col, clamp(glassCol, 0.0, 4.0), glassMask * 0.96);

              // Physically bulge the refractive droplet forward in 3D Z
              pos.z += glassH * 0.115 * u_tear_alpha;
              headVis = max(headVis, glassMask * 0.96);
            }
          }
          if (headVis <= 0.006) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            gl_PointSize = 0.0;
            v_col = vec3(0.0);
            v_alpha = 0.0;
            v_bokeh = 0.0;
            return;
          }

          // Pixel-exact UnrealGlow HDR emission + Idea 6 (Chromatic Iris Ignition) + Idea 1 (Iris Eclipse)
          // All gated strictly by baked coloured iris pixels (pixSat) so alignment is 100% pixel-exact & never touches sclera/lids
          float pixSat = max(t.r, max(t.g, t.b)) - min(t.r, min(t.g, t.b));
          float eclipseBlack = 0.0;
          if (u_fx.x > 0.002 && !isSideRain) {
            float isBakedIris = smoothstep(0.035, 0.13, pixSat);
            if (isBakedIris > 0.004) {
              vec2 ecL = vec2((a_uv.x - pL.x) * 2.3, a_uv.y - pL.y);
              vec2 ecR = vec2((a_uv.x - pR.x) * 2.3, a_uv.y - pR.y);
              bool ecIsL = length(ecL) <= length(ecR);
              float ecRIris = ecIsL ? u_eye_geom_l.x : u_eye_geom_r.x;
              float ecRDist = length(ecIsL ? ecL : ecR);
              float swallowR = mix(ecRIris * 0.20, ecRIris * 1.45, u_fx.x);
              float inSwallow = smoothstep(swallowR, swallowR * 0.55, ecRDist) * (1.0 - blinkMask);
              float catchKeep = smoothstep(0.68, 0.88, lum);
              eclipseBlack = inSwallow * isBakedIris * u_fx.x * (1.0 - catchKeep * 0.94);
              col *= (1.0 - eclipseBlack * 0.98);
