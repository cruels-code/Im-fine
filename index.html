<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROSOPAGNOSIA — The Face Critic's Nightmare</title>
  <link rel="icon" href="data:," />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      cursor: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      dynamic-range-limit: no-limit;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    canvas.ready {
      opacity: 1;
    }
    #cursor-reticle {
      position: fixed;
      top: 0;
      left: 0;
      width: 19px;
      height: 19px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.8s ease;
    }
    #cursor-reticle.active {
      opacity: 0.85;
      transition: opacity 0.12s ease;
    }
    #cursor-reticle::before,
    #cursor-reticle::after {
      content: "";
      position: absolute;
      background: rgba(216, 203, 184, 0.9);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.85);
    }
    #cursor-reticle::before {
      left: 9px;
      top: 0;
      width: 1px;
      height: 19px;
    }
    #cursor-reticle::after {
      top: 9px;
      left: 0;
      width: 19px;
      height: 1px;
    }
    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      border: 1.5px solid rgba(216, 203, 184, 0.14);
      border-top-color: rgba(216, 203, 184, 0.65);
      pointer-events: none;
      z-index: 5;
      opacity: 1;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      animation: loader-spin 1.6s linear infinite;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      animation: none;
    }
    #loader-status {
      position: fixed;
      top: calc(50% + 26px);
      left: 50%;
      transform: translateX(-50%);
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      color: rgba(216, 203, 184, 0.45);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hidden + #loader-status {
      opacity: 0;
      visibility: hidden;
    }
    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="monolith"></canvas>
  <div id="loader" aria-hidden="true"></div>
  <div id="loader-status" aria-hidden="true"></div>
  <div id="cursor-reticle" aria-hidden="true"></div>

  <!-- =========================================================================
       BACKGROUND FACE GENERATOR WEB WORKER (LIVE STYLEGAN2-FFHQ-1024)
       ========================================================================= -->
  <script id="gen-worker" type="javascript/worker">
    let genSession = null;
    let criticPort = null;
    const HI_SIZE = 1024;
    const SIZE = 128;
    const PIXELS = SIZE * SIZE;
    const CHANNELS = 3;
    const TENSOR_LEN = CHANNELS * PIXELS;
    const MASK_5568 = new Float32Array(5568).fill(1.0);
    const TRUNC_TENSOR_VAL = new Float32Array([0.50]);
    const VOID_ONE = new Float32Array([1.0]);

    // Precompute 1024x1024 gentle outer perimeter falloff LUT (no cutout masking)
    const VIG_1024 = new Float32Array(HI_SIZE * HI_SIZE);
    for (let y = 0; y < HI_SIZE; y++) {
      const dy = ((y + 0.5) / HI_SIZE - 0.50) / 0.44;
      const dy2 = dy * dy;
      const row = y * HI_SIZE;
      for (let x = 0; x < HI_SIZE; x++) {
        const dx = ((x + 0.5) / HI_SIZE - 0.50) / 0.37;
        const r = Math.sqrt(dx * dx + dy2);
        let vig = 1.0;
        if (r > 0.90) {
          const t = Math.min(1.0, (r - 0.90) / 0.34);
          vig = 1.0 - t * t * (3.0 - 2.0 * t);
        }
        VIG_1024[row + x] = vig;
      }
    }

    let vExpression = null;
    let vYaw = null;
    let vFemale = null;
    let vNoGlasses = null;
    let vBlueEyes = null;
    let vGreenEyes = null;
    let vBrightEyes = null;
    let srSession = null;
    let eyeFlipToggle = 0;
    let eyeColorPresetIdx = 0;
    // Native StyleGAN2 latent steering presets [blue, green, bright]: Blue, Red-base (bright), Green, Brown, Cyan, Hazel
    const GAN_EYE_PRESETS = [
      [ 3.8,  0.0, 2.5], // Blue
      [ 1.8,  0.0, 3.0], // Bright pale base for Red
      [ 1.2,  3.8, 2.4], // Green
      [-2.8, -1.2, 1.4], // Brown
      [ 3.4,  2.6, 2.8], // Cyan
      [-1.0,  2.8, 2.4], // Hazel
    ];
    // Target iris colours baked directly into the generated 1024x1024 greyscale+coloured-eyes image
    const WORKER_EYE_PALETTE = [
      [0.24, 0.56, 1.00], // Blue
      [1.00, 0.16, 0.14], // Red
      [0.20, 0.86, 0.40], // Green
      [0.64, 0.36, 0.18], // Brown
      [0.14, 0.90, 0.96], // Cyan
      [0.74, 0.62, 0.24], // Hazel
    ];
    // Online dark-background latent accumulator (unused in macro eye mode, kept for compatibility)
    const darkBgSum = new Float32Array(512);
    const brightBgSum = new Float32Array(512);
    let darkBgCount = 0;
    let brightBgCount = 0;
    let vDarkBg = null;
    const recentLatents = [];

    function randn(dim, psi = 1.0) {
      const z = new Float32Array(dim);
      for (let i = 0; i < dim; i += 2) {
        const u1 = Math.max(1e-6, Math.random());
        const u2 = Math.random();
        const mag = psi * Math.sqrt(-2.0 * Math.log(u1));
        z[i] = mag * Math.cos(2.0 * Math.PI * u2);
        if (i + 1 < dim) z[i + 1] = mag * Math.sin(2.0 * Math.PI * u2);
      }
      return z;
    }

    function normalizeVec(arr) {
      const v = new Float32Array(arr.length);
      let sq = 0.0;
      for (let i = 0; i < arr.length; i++) sq += arr[i] * arr[i];
      const inv = 1.0 / (Math.sqrt(sq) + 1e-8);
      for (let i = 0; i < arr.length; i++) v[i] = arr[i] * inv;
      return v;
    }

    async function fetchBytesWithRetry(u, attempts = 3) {
      let lastErr = null;
      for (let a = 0; a < attempts; a++) {
        try {
          const r = await fetch(u);
          if (r.ok) return new Uint8Array(await r.arrayBuffer());
          lastErr = new Error("HTTP " + r.status + " (" + u + ")");
          if (r.status === 404) throw lastErr;
        } catch (err) {
          lastErr = err;
          if (err && /HTTP 404/.test(String(err.message || ""))) throw err;
        }
        if (a + 1 < attempts) await new Promise((res) => setTimeout(res, 600 * (a + 1)));
      }
      throw lastErr || new Error("Failed to fetch " + u);
    }

    async function fetchPartsBytes(partUrls) {
      const mobile = typeof IS_MOBILE !== "undefined" && IS_MOBILE;
      let chunks;
      if (mobile) {
        chunks = [];
        for (let i = 0; i < partUrls.length; i++) {
          self.postMessage({ type: "status", text: `downloading model (${i + 1}/${partUrls.length})…` });
          chunks.push(await fetchBytesWithRetry(partUrls[i], 3));
        }
      } else {
        chunks = await Promise.all(partUrls.map((u) => fetchBytesWithRetry(u, 3)));
      }
      let total = 0;
      for (let i = 0; i < chunks.length; i++) total += chunks[i].byteLength;
      const merged = new Uint8Array(total);
      let off = 0;
      for (let i = 0; i < chunks.length; i++) {
        merged.set(chunks[i], off);
        off += chunks[i].byteLength;
        chunks[i] = null;
      }
      return merged;
    }

    async function fetchModelBytes(url, partUrls = null) {
      const hasParts = !!(partUrls && partUrls.length);
      const preferParts = hasParts && /\.github\.io\//i.test(url);
      if (preferParts) {
        try {
          return await fetchPartsBytes(partUrls);
        } catch (_partsErr) {
          return await fetchBytesWithRetry(url, 3);
        }
      }
      try {
        return await fetchBytesWithRetry(url, hasParts ? 2 : 3);
      } catch (singleErr) {
        if (!hasParts) throw singleErr;
        return await fetchPartsBytes(partUrls);
      }
    }

    async function fetchModelWithIDB(url, cacheKey, partUrls = null) {
      const openDb = () => new Promise((resolve, reject) => {
        const req = indexedDB.open("prosopagnosia_models_v1", 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("models")) db.createObjectStore("models");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      try {
        const db = await openDb();
        const cached = await new Promise((resolve, reject) => {
          const tx = db.transaction("models", "readonly");
          const req = tx.objectStore("models").get(cacheKey);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
        if (cached && cached.byteLength > 10000000) {
          return new Uint8Array(cached);
        }
        const bytes = await fetchModelBytes(url, partUrls);
        try {
          await new Promise((resolve, reject) => {
            const tx = db.transaction("models", "readwrite");
            const req = tx.objectStore("models").put(bytes.buffer, cacheKey);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
          });
        } catch (_cachePutErr) {}
        return bytes;
      } catch (_idbErr) {
        return await fetchModelBytes(url, partUrls);
      }
    }

    function updateDarkBgAxis(z, bgMean) {
      if (bgMean < 0.13) {
        for (let i = 0; i < 512; i++) darkBgSum[i] += z[i];
        darkBgCount++;
      } else if (bgMean > 0.22) {
        for (let i = 0; i < 512; i++) brightBgSum[i] += z[i];
        brightBgCount++;
      } else {
        return;
      }
      if (darkBgCount >= 2 && brightBgCount >= 2) {
        const diff = new Float32Array(512);
        const invD = 1.0 / darkBgCount;
        const invB = 1.0 / brightBgCount;
        for (let i = 0; i < 512; i++) diff[i] = darkBgSum[i] * invD - brightBgSum[i] * invB;
        if (vYaw) {
          let dotY = 0.0;
          for (let i = 0; i < 512; i++) dotY += diff[i] * vYaw[i];
          for (let i = 0; i < 512; i++) diff[i] -= dotY * vYaw[i];
        }
        if (vExpression) {
          let dotE = 0.0;
          for (let i = 0; i < 512; i++) dotE += diff[i] * vExpression[i];
          for (let i = 0; i < 512; i++) diff[i] -= dotE * vExpression[i];
        }
        vDarkBg = normalizeVec(diff);
      }
    }

    function nextFfhqLatent(attempt = 0) {
      const z = randn(512, 1.0);
      // Remove yaw so gaze looks dead straight ahead
      if (vYaw) {
        let dotY = 0.0;
        for (let i = 0; i < 512; i++) dotY += z[i] * vYaw[i];
        for (let i = 0; i < 512; i++) z[i] -= dotY * vYaw[i];
      }
      // Steer strongly toward female eyes (delicate lashes, arched brow, smooth lid skin)
      if (vFemale) {
        let dotF = 0.0;
        for (let i = 0; i < 512; i++) dotF += z[i] * vFemale[i];
        const pushF = 2.8 + 1.5 * Math.random() + Math.min(1.0, attempt * 0.25);
        for (let i = 0; i < 512; i++) z[i] += (pushF - dotF) * vFemale[i];
      }
      // Steer strongly away from all glasses & thin wire-frame reading glasses
      if (vNoGlasses) {
        let dotG = 0.0;
        for (let i = 0; i < 512; i++) dotG += z[i] * vNoGlasses[i];
        const pushG = 4.2 + 1.4 * Math.random() + Math.min(1.8, attempt * 0.40);
        for (let i = 0; i < 512; i++) z[i] += (pushG - dotG) * vNoGlasses[i];
      }
      // Gentle solemn expression so eyes remain wide open (not squinted by a grin)
      if (vExpression) {
        let dotE = 0.0;
        for (let i = 0; i < 512; i++) dotE += z[i] * vExpression[i];
        const pushE = -(1.4 + 1.1 * Math.random());
        for (let i = 0; i < 512; i++) z[i] += (pushE - dotE) * vExpression[i];
      }
      // Native StyleGAN2 latent eye-colour & brightness steering (zero post-effect tinting)
      const preset = GAN_EYE_PRESETS[eyeColorPresetIdx % GAN_EYE_PRESETS.length];
      if (vBlueEyes) {
        let dotB = 0.0;
        for (let i = 0; i < 512; i++) dotB += z[i] * vBlueEyes[i];
        const pushB = preset[0] + (Math.random() - 0.5) * 0.8;
        for (let i = 0; i < 512; i++) z[i] += (pushB - dotB) * vBlueEyes[i];
      }
      if (vGreenEyes) {
        let dotG2 = 0.0;
        for (let i = 0; i < 512; i++) dotG2 += z[i] * vGreenEyes[i];
        const pushG2 = preset[1] + (Math.random() - 0.5) * 0.8;
        for (let i = 0; i < 512; i++) z[i] += (pushG2 - dotG2) * vGreenEyes[i];
      }
      if (vBrightEyes) {
        let dotBr = 0.0;
        for (let i = 0; i < 512; i++) dotBr += z[i] * vBrightEyes[i];
        const pushBr = preset[2] + Math.random() * 0.8;
        for (let i = 0; i < 512; i++) z[i] += (pushBr - dotBr) * vBrightEyes[i];
      }
      return z;
    }

    // Pack full native 1024x1024 RGBA8 [0,255] (gentle outer vignette only, no cutout masking) + 128x128 NCHW [-1,1]
    function pack1024And128(nhwc) {
      const rgba1024 = new Uint8Array(HI_SIZE * HI_SIZE * 4);
      const nchw128 = new Float32Array(TENSOR_LEN);
      const rawLum128 = new Float32Array(PIXELS);
      const inv64 = 1.0 / 64.0;
      for (let by = 0; by < SIZE; by++) {
        const sy0 = by << 3;
        for (let bx = 0; bx < SIZE; bx++) {
          const sx0 = bx << 3;
          let rSum = 0.0, gSum = 0.0, bSum = 0.0, rawLSum = 0.0;
          for (let oy = 0; oy < 8; oy++) {
            const rowOff = (sy0 + oy) * HI_SIZE;
            for (let ox = 0; ox < 8; ox++) {
              const idx1024 = rowOff + sx0 + ox;
              const vig = VIG_1024[idx1024];
              const p3 = idx1024 * 3;
              const r0 = Math.max(0.0, Math.min(1.0, nhwc[p3]));
              const g0 = Math.max(0.0, Math.min(1.0, nhwc[p3 + 1]));
              const b0 = Math.max(0.0, Math.min(1.0, nhwc[p3 + 2]));
              rawLSum += 0.299 * r0 + 0.587 * g0 + 0.114 * b0;
              const rr = r0 * vig;
              const gg = g0 * vig;
              const bb = b0 * vig;
              const p4 = idx1024 << 2;
              rgba1024[p4] = (rr * 255.0 + 0.5) | 0;
              rgba1024[p4 + 1] = (gg * 255.0 + 0.5) | 0;
              rgba1024[p4 + 2] = (bb * 255.0 + 0.5) | 0;
              rgba1024[p4 + 3] = 255;
              rSum += rr;
              gSum += gg;
              bSum += bb;
            }
          }
          const idx = (by << 7) + bx;
          rawLum128[idx] = rawLSum * inv64;
          nchw128[idx] = rSum * inv64 * 2.0 - 1.0;
          nchw128[PIXELS + idx] = gSum * inv64 * 2.0 - 1.0;
          nchw128[2 * PIXELS + idx] = bSum * inv64 * 2.0 - 1.0;
        }
      }
      return { rgba1024, nchw128, rawLum128 };
    }

    function evalFaceQuality(face, rawLum128) {
      const lumAt = (x, y) => {
        const idx = y * SIZE + x;
        return 0.299 * (face[idx] * 0.5 + 0.5) + 0.587 * (face[PIXELS + idx] * 0.5 + 0.5) + 0.114 * (face[2 * PIXELS + idx] * 0.5 + 0.5);
      };
      // Measure natural background brightness around the head (left/right margins + top margin, before vignette)
      const bgVals = [];
      let bgSum = 0.0;
      for (let y = 10; y < 92; y += 2) {
        for (let x = 8; x < 22; x += 2) { const v = rawLum128[(y << 7) + x]; bgVals.push(v); bgSum += v; }
        for (let x = 106; x < 120; x += 2) { const v = rawLum128[(y << 7) + x]; bgVals.push(v); bgSum += v; }
      }
      for (let y = 6; y < 18; y += 2) {
        for (let x = 22; x < 106; x += 2) { const v = rawLum128[(y << 7) + x]; bgVals.push(v); bgSum += v; }
      }
      bgVals.sort((a, b) => a - b);
      const bgMean = bgSum / Math.max(1, bgVals.length);
      const bgP85 = bgVals[Math.floor(bgVals.length * 0.85)] || 0.0;
      const bgOk = bgMean <= 0.14 && bgP85 <= 0.22;
      const bgPenalty = Math.max(0.0, bgMean - 0.08) * 65.0 + Math.max(0.0, bgP85 - 0.14) * 35.0;

      // Cheek luminance reference (FFHQ 128x128: below eyes, beside nose)
      let cheekRefSum = 0.0, cheekRefCnt = 0;
      for (let y = 70; y < 82; y++) {
        for (let x = 52; x < 76; x++) {
          cheekRefSum += lumAt(x, y);
          cheekRefCnt++;
        }
      }
      const cheekRef = cheekRefSum / Math.max(1, cheekRefCnt) + 1e-5;

      // Glasses / eyewear bridge dip check between FFHQ eyes (x=59..69, y=55..66)
      let upSum = 0.0, dnSum = 0.0, midMin = 1e9;
      for (let y = 49; y < 55; y++) for (let x = 59; x < 69; x++) upSum += lumAt(x, y);
      for (let y = 66; y < 72; y++) for (let x = 59; x < 69; x++) dnSum += lumAt(x, y);
      for (let y = 55; y < 66; y++) {
        let rowSum = 0.0;
        for (let x = 59; x < 69; x++) rowSum += lumAt(x, y);
        const rm = rowSum / 10.0;
        if (rm < midMin) midMin = rm;
      }
      const bridgeDip = Math.min(upSum / 60.0, dnSum / 60.0) - midMin;

      // Eye socket visibility check (rejects sunglasses while allowing dark skin tones)
      const eyeStats = (x0, x1) => {
        const vals = [];
        for (let y = 56; y < 65; y++) {
          for (let x = x0; x < x1; x++) vals.push(lumAt(x, y));
        }
        vals.sort((a, b) => a - b);
        const n = vals.length;
        return { med: vals[n >> 1], p85: vals[Math.floor(n * 0.85)] };
      };
      const le = eyeStats(38, 56);
      const re = eyeStats(72, 90);
      const eyeOk =
        le.med >= 0.06 && re.med >= 0.06 &&
        le.p85 >= 0.12 && re.p85 >= 0.12 &&
        le.p85 / cheekRef >= 0.42 && re.p85 / cheekRef >= 0.42 &&
        bridgeDip <= 0.11;

      // Open-tooth smile check in FFHQ mouth box (y=88..98, x=52..76)
      let teethOk = true;
      for (let y = 88; y < 98 && teethOk; y++) {
        for (let x = 52; x < 76; x++) {
          const idx = y * SIZE + x;
          const r = face[idx] * 0.5 + 0.5;
          const g = face[PIXELS + idx] * 0.5 + 0.5;
          const b = face[2 * PIXELS + idx] * 0.5 + 0.5;
          const l = 0.299 * r + 0.587 * g + 0.114 * b;
          const sat = Math.max(r, g, b) - Math.min(r, g, b);
          const wt = l - sat * 1.25;
          if (wt > 0.34 || wt > cheekRef * 0.56) { teethOk = false; break; }
        }
      }

      // Strict passport-photo frontal alignment: eye centroids + bilateral facial symmetry
      const eyeCentroid = (x0, x1) => {
        const vals = [];
        for (let y = 54; y < 66; y++) for (let x = x0; x < x1; x++) vals.push(lumAt(x, y));
        vals.sort((a, b) => a - b);
        const thresh = vals[Math.floor(vals.length * 0.25)] + 0.04;
        let wx = 0.0, wy = 0.0, ws = 0.0;
        for (let y = 54; y < 66; y++) {
          for (let x = x0; x < x1; x++) {
            const d = thresh - lumAt(x, y);
            if (d > 0.0) { const w = d * d; wx += w * x; wy += w * y; ws += w; }
          }
        }
        return ws > 1e-6 ? { x: wx / ws, y: wy / ws } : { x: 0.5 * (x0 + x1), y: 60.0 };
      };
      const lEye = eyeCentroid(36, 57);
      const rEye = eyeCentroid(71, 92);
      const dL = 63.5 - lEye.x;
      const dR = rEye.x - 63.5;
      const midErr = Math.abs(0.5 * (lEye.x + rEye.x) - 63.5);
      const rollErr = Math.abs(lEye.y - rEye.y);
      const foreshort = Math.min(dL, dR) / Math.max(dL, dR, 1e-5);

      // Bilateral symmetry across face (rejects slight head turns & asymmetric side lighting)
      let symSum = 0.0, symCnt = 0;
      for (let y = 46; y < 96; y += 2) {
        for (let x = 38; x < 62; x += 2) {
          symSum += Math.abs(lumAt(x, y) - lumAt(127 - x, y));
          symCnt++;
        }
      }
      const symDiff = (symSum / Math.max(1, symCnt)) / cheekRef;

      // Nose-bridge horizontal centering check (x=57..70, y=64..82): rejects slight yaw turns
      const noseVals = [];
      for (let y = 64; y < 82; y++) for (let x = 57; x <= 70; x++) noseVals.push(lumAt(x, y));
      noseVals.sort((a, b) => a - b);
      const noseThresh = noseVals[Math.floor(noseVals.length * 0.65)] - 0.02;
      let nwx = 0.0, nws = 0.0;
      for (let y = 64; y < 82; y++) {
        for (let x = 57; x <= 70; x++) {
          const d = lumAt(x, y) - noseThresh;
          if (d > 0.0) { const w = d * d; nwx += w * x; nws += w; }
        }
      }
      const noseX = nws > 1e-6 ? nwx / nws : 63.5;
      const noseErr = Math.abs(noseX - 63.5);

      // Straight-ahead pupil/iris gaze check inside each eye box (rejects sideways glances)
      const pupilCenterX = (x0, x1) => {
        const vals = [];
        for (let y = 57; y <= 64; y++) for (let x = x0; x <= x1; x++) vals.push(lumAt(x, y));
        vals.sort((a, b) => a - b);
        const pThresh = vals[Math.floor(vals.length * 0.22)] + 0.03;
        let px = 0.0, pw = 0.0;
        for (let y = 57; y <= 64; y++) {
          for (let x = x0; x <= x1; x++) {
            const d = pThresh - lumAt(x, y);
            if (d > 0.0) { const w = d * d; px += w * x; pw += w; }
          }
        }
        return pw > 1e-6 ? px / pw : 0.5 * (x0 + x1);
      };
      const lGazeOff = pupilCenterX(40, 54) - 47.0;
      const rGazeOff = pupilCenterX(74, 88) - 81.0;
      const gazeSumErr = Math.abs(lGazeOff + rGazeOff);
      const gazeMaxErr = Math.max(Math.abs(lGazeOff), Math.abs(rGazeOff));
      const gazeOk = gazeMaxErr <= 2.2 && gazeSumErr <= 2.4;

      const poseOk =
        midErr <= 1.1 &&
        rollErr <= 1.2 &&
        foreshort >= 0.945 &&
        symDiff <= 0.16 &&
        noseErr <= 1.5 &&
        gazeOk &&
        cheekRef >= 0.05;
      const posePenalty =
        midErr * 2.6 +
        rollErr * 2.0 +
        Math.max(0.0, 0.96 - foreshort) * 40.0 +
        symDiff * 24.0 +
        noseErr * 2.2 +
        gazeMaxErr * 2.4 +
        gazeSumErr * 2.8 +
        Math.max(0.0, bridgeDip - 0.08) * 18.0 +
        bgPenalty;
      const ok = eyeOk && gazeOk && midErr <= 2.2 && rollErr <= 2.2 && bridgeDip <= 0.08 && cheekRef >= 0.06;
      return { ok, eyeOk, poseOk, teethOk, bgOk: true, bgMean, posePenalty };
    }

    function maxRecentSimilarity(zUnit) {
      let maxSim = 0.0;
      for (let k = 0; k < recentLatents.length; k++) {
        const rz = recentLatents[k];
        let dot = 0.0;
        for (let i = 0; i < 512; i++) dot += zUnit[i] * rz[i];
        if (dot > maxSim) maxSim = dot;
      }
      return maxSim;
    }

    // Native StyleGAN2-1024 Network Bending mask (5,568 internal synthesis channels):
    // 0..2559   (4x4, 8x8, 16x16): locked at 1.0 so facial anatomy & recognizability stay 100% intact
    // 2560..3583 (32x32): ultra-gentle sculptural nudge (no ablations or inversions)
    // 3584..4607 (64x64): light painterly surface articulation
    // 4608..5119 (128x128): subtle chromatic / oil-glaze shifts
    // 5120..5567 (256x256..1024x1024): fine painterly texture & neural micro-glitch detail
    function buildBendMask() {
      const m = new Float32Array(5568).fill(1.0);
      const bendRange = (start, end, prob, dimProb, invertProb, boostMin, boostMax) => {
        for (let i = start; i < end; i++) {
          const r = Math.random();
          if (r > prob) continue;
          const u = r / prob;
          if (u < dimProb) {
            m[i] = 0.25 + 0.35 * Math.random();
          } else if (u < dimProb + invertProb) {
            m[i] = -(0.12 + 0.18 * Math.random());
          } else {
            m[i] = boostMin + (boostMax - boostMin) * Math.random();
          }
        }
      };
      // 32x32: very subtle sculptural shift (never breaks eyes/nose/mouth)
      bendRange(2560, 3584, 0.03, 0.50, 0.0, 1.25, 1.48);
      // 64x64: light painterly plane & surface articulation
      bendRange(3584, 4608, 0.08, 0.45, 0.0, 1.30, 1.68);
      // 128x128: subtle iridescent / chromatic oil-glaze shifts
      bendRange(4608, 5120, 0.12, 0.40, 0.08, 1.35, 1.85);
      // 256x256..1024x1024: fine painterly brushwork grain & crisp micro-edges
      bendRange(5120, 5568, 0.14, 0.40, 0.05, 1.35, 1.90);
      return m;
    }

    let depthSession = null;
    const DEPTH_SIZE = 224;
    const DEPTH_PIXELS = DEPTH_SIZE * DEPTH_SIZE;
    const DEPTH_OUT_SIZE = 448; // 4x higher depth pixel quantity (448x448 float32 -> R16F GPU texture)
    const DEPTH_OUT_PIXELS = DEPTH_OUT_SIZE * DEPTH_OUT_SIZE;
    const depthInputBuf = new Float32Array(3 * DEPTH_PIXELS);
    const depthInputFlip = new Float32Array(3 * DEPTH_PIXELS);

    function fillDepthInputRect(rgba1024, rx0, ry0, rSize) {
      const step = rSize / DEPTH_SIZE;
      const m0 = 0.485, m1 = 0.456, m2 = 0.406;
      const s0 = 1.0 / 0.229, s1 = 1.0 / 0.224, s2 = 1.0 / 0.225;
      for (let y = 0; y < DEPTH_SIZE; y++) {
        const sy = Math.max(0, Math.min(HI_SIZE - 1, Math.floor(ry0 + (y + 0.5) * step)));
        const sRow = sy * HI_SIZE;
        const dRow = y * DEPTH_SIZE;
        for (let x = 0; x < DEPTH_SIZE; x++) {
          const sx = Math.max(0, Math.min(HI_SIZE - 1, Math.floor(rx0 + (x + 0.5) * step)));
          const p4 = (sRow + sx) << 2;
          const idx = dRow + x;
          depthInputBuf[idx] = (rgba1024[p4] / 255.0 - m0) * s0;
          depthInputBuf[DEPTH_PIXELS + idx] = (rgba1024[p4 + 1] / 255.0 - m1) * s1;
          depthInputBuf[2 * DEPTH_PIXELS + idx] = (rgba1024[p4 + 2] / 255.0 - m2) * s2;
        }
      }
    }

    function sampleBilinear224(arr, fx, fy) {
      const x0 = Math.max(0, Math.min(DEPTH_SIZE - 1, Math.floor(fx)));
      const y0 = Math.max(0, Math.min(DEPTH_SIZE - 1, Math.floor(fy)));
      const x1 = Math.min(DEPTH_SIZE - 1, x0 + 1);
      const y1 = Math.min(DEPTH_SIZE - 1, y0 + 1);
      const wx = Math.max(0, Math.min(1, fx - x0));
      const wy = Math.max(0, Math.min(1, fy - y0));
      const r0 = y0 * DEPTH_SIZE, r1 = y1 * DEPTH_SIZE;
      const top = arr[r0 + x0] * (1 - wx) + arr[r0 + x1] * wx;
      const bot = arr[r1 + x0] * (1 - wx) + arr[r1 + x1] * wx;
      return top * (1 - wy) + bot * wy;
    }

    // 6-Pass Multi-Scale Tiled Depth-Anything-V2 (2-pass Global TTA + 4 overlapping high-res local tiles)
    // Least-squares aligned & cosine-feathered into a 448x448 Float32Array (R16F) depth map
    async function estimateDepth224(rgba1024) {
      const out = new Float32Array(DEPTH_OUT_PIXELS);
      if (depthSession) {
        try {
          // 1. Global 2-pass TTA (full 1024x1024 -> 224x224)
          fillDepthInputRect(rgba1024, 0, 0, HI_SIZE);
          const res1 = await depthSession.run({
            pixel_values: new ort.Tensor("float32", depthInputBuf, [1, 3, DEPTH_SIZE, DEPTH_SIZE]),
          });
          const rawD1 = (res1.predicted_depth || Object.values(res1)[0]).data;

          for (let c = 0; c < 3; c++) {
            const cOff = c * DEPTH_PIXELS;
            for (let y = 0; y < DEPTH_SIZE; y++) {
              const rOff = cOff + y * DEPTH_SIZE;
              for (let x = 0; x < DEPTH_SIZE; x++) {
                depthInputFlip[rOff + x] = depthInputBuf[rOff + (DEPTH_SIZE - 1 - x)];
              }
            }
          }
          const res2 = await depthSession.run({
            pixel_values: new ort.Tensor("float32", depthInputFlip, [1, 3, DEPTH_SIZE, DEPTH_SIZE]),
          });
          const rawD2 = (res2.predicted_depth || Object.values(res2)[0]).data;

          const global224 = new Float32Array(DEPTH_PIXELS);
          for (let y = 0; y < DEPTH_SIZE; y++) {
            const rOff = y * DEPTH_SIZE;
            for (let x = 0; x < DEPTH_SIZE; x++) {
              global224[rOff + x] = 0.5 * (rawD1[rOff + x] + rawD2[rOff + (DEPTH_SIZE - 1 - x)]);
            }
          }

          // Upsample global depth smoothly to 448x448 reference
          const global448 = new Float32Array(DEPTH_OUT_PIXELS);
          for (let y = 0; y < DEPTH_OUT_SIZE; y++) {
            const fy = ((y + 0.5) / DEPTH_OUT_SIZE) * DEPTH_SIZE - 0.5;
            const rOff = y * DEPTH_OUT_SIZE;
            for (let x = 0; x < DEPTH_OUT_SIZE; x++) {
              const fx = ((x + 0.5) / DEPTH_OUT_SIZE) * DEPTH_SIZE - 0.5;
              global448[rOff + x] = sampleBilinear224(global224, fx, fy);
            }
          }

          // 2. Four overlapping high-res 640x640 local tiles -> least-squares affine aligned to global448
          const tileAccum = new Float32Array(DEPTH_OUT_PIXELS);
          const tileWeight = new Float32Array(DEPTH_OUT_PIXELS);
          const T_SIZE = 640;
          const tileCoords = [[0, 0], [384, 0], [0, 384], [384, 384]];
          const scaleOut = DEPTH_OUT_SIZE / HI_SIZE;

          for (let tIdx = 0; tIdx < tileCoords.length; tIdx++) {
            const [tx0, ty0] = tileCoords[tIdx];
            fillDepthInputRect(rgba1024, tx0, ty0, T_SIZE);
            const tRes = await depthSession.run({
              pixel_values: new ort.Tensor("float32", depthInputBuf, [1, 3, DEPTH_SIZE, DEPTH_SIZE]),
            });
            const tile224 = (tRes.predicted_depth || Object.values(tRes)[0]).data;

            const ox0 = Math.floor(tx0 * scaleOut);
            const oy0 = Math.floor(ty0 * scaleOut);
            const ox1 = Math.min(DEPTH_OUT_SIZE, Math.ceil((tx0 + T_SIZE) * scaleOut));
            const oy1 = Math.min(DEPTH_OUT_SIZE, Math.ceil((ty0 + T_SIZE) * scaleOut));
            const oW = Math.max(1, ox1 - ox0);
            const oH = Math.max(1, oy1 - oy0);

            // Closed-form least-squares fit: a * tile + b ≈ global448 (guarantees zero tile seams)
            let sX = 0.0, sY = 0.0, sXX = 0.0, sXY = 0.0, cnt = 0;
            for (let y = oy0; y < oy1; y += 2) {
              const v = (y - oy0 + 0.5) / oH;
              const fy = v * DEPTH_SIZE - 0.5;
              const rOff = y * DEPTH_OUT_SIZE;
              for (let x = ox0; x < ox1; x += 2) {
                const u = (x - ox0 + 0.5) / oW;
                const fx = u * DEPTH_SIZE - 0.5;
                const dT = sampleBilinear224(tile224, fx, fy);
                const dG = global448[rOff + x];
                sX += dT; sY += dG; sXX += dT * dT; sXY += dT * dG; cnt++;
              }
            }
            const invC = 1.0 / Math.max(1, cnt);
            const mX = sX * invC, mY = sY * invC;
            const varX = Math.max(1e-6, sXX * invC - mX * mX);
            const covXY = sXY * invC - mX * mY;
            const a = Math.max(0.25, Math.min(2.5, covXY / varX));
            const b = mY - a * mX;

            // Cosine-feathered accumulation into 448x448 high-res depth buffer
            for (let y = oy0; y < oy1; y++) {
              const v = (y - oy0 + 0.5) / oH;
              const fy = v * DEPTH_SIZE - 0.5;
              const wy = Math.sin(Math.PI * Math.max(0.01, Math.min(0.99, v)));
              const rOff = y * DEPTH_OUT_SIZE;
              for (let x = ox0; x < ox1; x++) {
                const u = (x - ox0 + 0.5) / oW;
                const fx = u * DEPTH_SIZE - 0.5;
                const wx = Math.sin(Math.PI * Math.max(0.01, Math.min(0.99, u)));
                const w = wx * wy + 0.02;
                const dAligned = a * sampleBilinear224(tile224, fx, fy) + b;
                tileAccum[rOff + x] += dAligned * w;
                tileWeight[rOff + x] += w;
              }
            }
          }

          // Fuse 35% global structure + 65% aligned high-res local tiles and normalize [0.0..1.0] in Float32
          let dMin = 1e9, dMax = -1e9;
          for (let i = 0; i < DEPTH_OUT_PIXELS; i++) {
            const localD = tileWeight[i] > 1e-5 ? (tileAccum[i] / tileWeight[i]) : global448[i];
            const fused = 0.35 * global448[i] + 0.65 * localD;
            out[i] = fused;
            if (fused < dMin) dMin = fused;
            if (fused > dMax) dMax = fused;
          }
          const invRange = 1.0 / Math.max(1e-5, dMax - dMin);
          for (let i = 0; i < DEPTH_OUT_PIXELS; i++) {
            out[i] = Math.max(0.0, Math.min(1.0, (out[i] - dMin) * invRange));
          }
          return out;
        } catch (_dErr) {}
      }
      // Fallback parametric depth map in Float32 [0..1]
      const step = HI_SIZE / DEPTH_OUT_SIZE;
      for (let y = 0; y < DEPTH_OUT_SIZE; y++) {
        const ny = (y + 0.5) / DEPTH_OUT_SIZE;
        const sy = Math.min(HI_SIZE - 1, Math.floor((y + 0.5) * step));
        for (let x = 0; x < DEPTH_OUT_SIZE; x++) {
          const nx = (x + 0.5) / DEPTH_OUT_SIZE;
          const sx = Math.min(HI_SIZE - 1, Math.floor((x + 0.5) * step));
          const p4 = (sy * HI_SIZE + sx) << 2;
          const lum = (0.299 * rgba1024[p4] + 0.587 * rgba1024[p4 + 1] + 0.114 * rgba1024[p4 + 2]) / 255.0;
          const hx = (nx - 0.50) / 0.40, hy = (ny - 0.50) / 0.36;
          out[y * DEPTH_OUT_SIZE + x] = Math.max(0.0, Math.min(1.0, Math.exp(-(hx * hx + hy * hy) * 1.1) * 0.6 + lum * 0.35));
        }
      }
      return out;
    }

    // Find exact dark pupil centroid in raw 1024x1024 FFHQ image around (nomX, nomY)
    function detectPupilCenter(fullRgba1024, nomX, nomY) {
      const bx0 = nomX - 44, bx1 = nomX + 44, by0 = nomY - 30, by1 = nomY + 30;
      const eyeLums = [];
      for (let y = by0; y <= by1; y += 2) {
        const row = y * HI_SIZE;
        for (let x = bx0; x <= bx1; x += 2) {
          const p4 = (row + x) << 2;
          eyeLums.push((0.299 * fullRgba1024[p4] + 0.587 * fullRgba1024[p4 + 1] + 0.114 * fullRgba1024[p4 + 2]) / 255.0);
        }
      }
      eyeLums.sort((a, b) => a - b);
      const pCut = (eyeLums[Math.floor(eyeLums.length * 0.14)] || 0.12) + 0.03;
      let exSum = 0.0, eySum = 0.0, ewSum = 0.0;
      for (let y = by0; y <= by1; y += 2) {
        const row = y * HI_SIZE;
        for (let x = bx0; x <= bx1; x += 2) {
          const p4 = (row + x) << 2;
          const lum = (0.299 * fullRgba1024[p4] + 0.587 * fullRgba1024[p4 + 1] + 0.114 * fullRgba1024[p4 + 2]) / 255.0;
          const d = pCut - lum;
          if (d > 0.0) {
            const w = d * d;
            exSum += w * x;
            eySum += w * y;
            ewSum += w;
          }
        }
      }
      const cx = Math.round(ewSum > 1e-5 ? Math.max(nomX - 28, Math.min(nomX + 28, exSum / ewSum)) : nomX);
      const cy = Math.round(ewSum > 1e-5 ? Math.max(nomY - 22, Math.min(nomY + 22, eySum / ewSum)) : nomY);
      return [cx, cy];
    }

    // Extract pixel-native overlapping left & right 256x256 tiles covering a 480x256 pair of eyes (32px center overlap)
    function cropEyePairTiles(fullRgba1024) {
      const [lx, ly] = detectPupilCenter(fullRgba1024, 378, 482);
      const [rx, ry] = detectPupilCenter(fullRgba1024, 646, 482);
      const midX = Math.round(0.5 * (lx + rx));
      const midY = Math.round(0.5 * (ly + ry));
      const CROP = 256;
      const plane = CROP * CROP;

      const extractTile = (x0, y0) => {
        const nchw = new Float32Array(3 * plane);
        for (let y = 0; y < CROP; y++) {
          const sy = Math.max(0, Math.min(HI_SIZE - 1, y0 + y));
          const rOff = sy * HI_SIZE;
          for (let x = 0; x < CROP; x++) {
            const sx = Math.max(0, Math.min(HI_SIZE - 1, x0 + x));
            const p4 = (rOff + sx) << 2;
            const idx = y * CROP + x;
            nchw[idx] = fullRgba1024[p4] / 255.0;
            nchw[plane + idx] = fullRgba1024[p4 + 1] / 255.0;
            nchw[2 * plane + idx] = fullRgba1024[p4 + 2] / 255.0;
          }
        }
        return nchw;
      };

      const y0 = midY - 128;
      const leftTile = extractTile(midX - 240, y0);
      const rightTile = extractTile(midX - 16, y0);
      // Exact projected pupil coordinates on the packed 1024x1024 eyeRgba1024 (X: 480px span, Y: 208px window 96..928)
      const estLx = Math.max(80, Math.min(460, ((lx - (midX - 240)) / 480.0) * HI_SIZE));
      const estRx = Math.max(564, Math.min(944, ((rx - (midX - 240)) / 480.0) * HI_SIZE));
      const estLy = Math.max(200, Math.min(824, ((ly - (midY - 104)) / 208.0) * HI_SIZE));
      const estRy = Math.max(200, Math.min(824, ((ry - (midY - 104)) / 208.0) * HI_SIZE));
      return { leftTile, rightTile, midX, midY, estLx, estLy, estRx, estRy };
    }

    // High-res 1024x1024 wire-frame / reading-glasses / nose-pad detector (catches 2px thin frames missed at 128x128)
    function detectEyewear1024(fullRgba1024, midX, midY) {
      const lum = (x, y) => {
        const cx = Math.max(0, Math.min(HI_SIZE - 1, x));
        const cy = Math.max(0, Math.min(HI_SIZE - 1, y));
        const p4 = (cy * HI_SIZE + cx) << 2;
        return (0.299 * fullRgba1024[p4] + 0.587 * fullRgba1024[p4 + 1] + 0.114 * fullRgba1024[p4 + 2]) / 255.0;
      };

      // 1. Nose-bridge horizontal wire/bar check (x = midX-34..midX+34, y = midY-44..midY+48)
      const rowMeans = new Float32Array(120);
      const yBase = midY - 56;
      for (let i = 0; i < 120; i++) {
        let s = 0.0, c = 0;
        const yy = yBase + i;
        for (let dx = -34; dx <= 34; dx += 2) { s += lum(midX + dx, yy); c++; }
        rowMeans[i] = s / Math.max(1, c);
      }
      let maxBridgeDip = 0.0;
      for (let i = 10; i < 108; i++) {
        const surr = 0.5 * (rowMeans[i - 8] + rowMeans[i + 8]);
        const dip = Math.max(surr - rowMeans[i], Math.abs(surr - rowMeans[i]) * 0.72);
        if (dip > maxBridgeDip) maxBridgeDip = dip;
      }

      // 2. Nose-pad & inner rim vertical edge check right beside the nose bridge & tear ducts
      let maxPadDip = 0.0;
      let sharpPadFrac = 0.0;
      let padTotal = 0, padSharp = 0;
      for (let side = -1; side <= 1; side += 2) {
        const xStart = midX + (side < 0 ? -64 : 26);
        const xEnd = midX + (side < 0 ? -26 : 64);
        const colMeans = new Float32Array(xEnd - xStart + 1);
        for (let x = xStart; x <= xEnd; x++) {
          let s = 0.0, c = 0;
          for (let dy = -12; dy <= 52; dy += 2) {
            const yy = midY + dy;
            const lC = lum(x, yy);
            s += lC;
            c++;
            // High-contrast vertical wire / metallic nose-pad gradient
            const gx = Math.abs(lum(x + 2, yy) - lum(x - 2, yy));
            const gy = Math.abs(lum(x, yy + 2) - lum(x, yy - 2));
            if (Math.max(gx, gy) > 0.14) padSharp++;
            padTotal++;
          }
          colMeans[x - xStart] = s / Math.max(1, c);
        }
        for (let k = 6; k < colMeans.length - 6; k++) {
          const surr = 0.5 * (colMeans[k - 6] + colMeans[k + 6]);
          const dip = surr - colMeans[k];
          if (dip > maxPadDip) maxPadDip = dip;
        }
      }
      sharpPadFrac = padSharp / Math.max(1, padTotal);

      // 3. Outer temple-arm horizontal line check (x = ±175..±235, y = midY-38..midY+24)
      let maxTempleDip = 0.0;
      for (let side = -1; side <= 1; side += 2) {
        const tRows = new Float32Array(80);
        const tyBase = midY - 46;
        for (let i = 0; i < 80; i++) {
          let s = 0.0, c = 0;
          for (let k = 176; k <= 232; k += 4) { s += lum(midX + side * k, tyBase + i); c++; }
          tRows[i] = s / Math.max(1, c);
        }
        for (let i = 8; i < 72; i++) {
          const surr = 0.5 * (tRows[i - 7] + tRows[i + 7]);
          const dip = surr - tRows[i];
          if (dip > maxTempleDip) maxTempleDip = dip;
        }
      }

      const hasGlasses =
        maxBridgeDip > 0.055 ||
        maxPadDip > 0.060 ||
        sharpPadFrac > 0.055 ||
        maxTempleDip > 0.085;
      const glassesPenalty =
        Math.max(0.0, maxBridgeDip - 0.035) * 450.0 +
        Math.max(0.0, maxPadDip - 0.040) * 380.0 +
        Math.max(0.0, sharpPadFrac - 0.035) * 420.0 +
        Math.max(0.0, maxTempleDip - 0.060) * 260.0 +
        (hasGlasses ? 120.0 : 0.0);
      return { hasGlasses, glassesPenalty };
    }

    // Score cropped eye tile for high-frequency lash/iris sharpness, wide aperture & crisp catchlight
    function scoreMacroEyeDetail(cropNchw) {
      const CROP = 256;
      const plane = CROP * CROP;
      let sharpSum = 0.0, sharpCnt = 0;
      let scleraCnt = 0, catchMax = 0.0, irisSatSum = 0.0, irisCnt = 0;
      for (let y = 92; y < 164; y++) {
        const rOff = y * CROP;
        for (let x = 52; x < 204; x++) {
          const i = rOff + x;
          const r = cropNchw[i], g = cropNchw[plane + i], b = cropNchw[2 * plane + i];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          const sat = Math.max(r, g, b) - Math.min(r, g, b);
          if (lum > catchMax) catchMax = lum;
          if (lum > 0.44 && sat < 0.22) scleraCnt++;
          if (lum > 0.07 && lum < 0.52) {
            irisSatSum += sat;
            irisCnt++;
          }
          const rR = cropNchw[i + 1], gR = cropNchw[plane + i + 1], bR = cropNchw[2 * plane + i + 1];
          const rD = cropNchw[i + CROP], gD = cropNchw[plane + i + CROP], bD = cropNchw[2 * plane + i + CROP];
          const lR = 0.299 * rR + 0.587 * gR + 0.114 * bR;
          const lD = 0.299 * rD + 0.587 * gD + 0.114 * bD;
          sharpSum += Math.abs(lR - lum) + Math.abs(lD - lum);
          sharpCnt++;
        }
      }
      const sharpness = sharpSum / Math.max(1, sharpCnt);
      const irisSat = irisSatSum / Math.max(1, irisCnt);
      const scleraFrac = Math.min(0.28, scleraCnt / 10944.0);
      return sharpness * 65.0 + irisSat * 14.0 + scleraFrac * 22.0 + Math.min(1.0, catchMax) * 3.5;
    }

    // Upscale left & right 256x256 eye tiles via Real-ESRGAN x4 -> seamless 1920x832 pair -> pack into 1024x1024 RGBA8
    async function upscaleAndPackEyePair(leftTile, rightTile) {
      const CROP = 256;
      const plane = CROP * CROP;
      const eyeRgba1024 = new Uint8Array(HI_SIZE * HI_SIZE * 4);
      let upscaled = false;
      if (srSession) {
        try {
          const inName = srSession.inputNames[0] || "input";
          const srL = await srSession.run({ [inName]: new ort.Tensor("float32", leftTile, [1, 3, CROP, CROP]) });
          const dL = (srL[srSession.outputNames[0]] || Object.values(srL)[0]).data;
          const srR = await srSession.run({ [inName]: new ort.Tensor("float32", rightTile, [1, 3, CROP, CROP]) });
          const dR = (srR[srSession.outputNames[0]] || Object.values(srR)[0]).data;

          // Seamless stitch across 128px center overlap (total 1920px wide x 1024px tall, vertical window 96..928 = 832px)
          const hiPlane = HI_SIZE * HI_SIZE;
          const fullW = 1920; // 1024 + 1024 - 128 overlap
          const yStart = 96, winH = 832;
          for (let y = 0; y < HI_SIZE; y++) {
            const fy = yStart + ((y + 0.5) / HI_SIZE) * winH - 0.5;
            const sy = Math.max(0, Math.min(HI_SIZE - 1, Math.round(fy)));
            const rowOff = sy * HI_SIZE;
            for (let x = 0; x < HI_SIZE; x++) {
              const fx = ((x + 0.5) / HI_SIZE) * fullW - 0.5;
              const p4 = (y * HI_SIZE + x) << 2;
              for (let c = 0; c < 3; c++) {
                const cOff = c * hiPlane + rowOff;
                let val;
                if (fx < 896.0) {
                  const sx = Math.max(0, Math.min(HI_SIZE - 1, Math.round(fx)));
                  val = dL[cOff + sx];
                } else if (fx >= 1024.0) {
                  const sx = Math.max(0, Math.min(HI_SIZE - 1, Math.round(fx - 896.0)));
                  val = dR[cOff + sx];
                } else {
                  const t = (fx - 896.0) / 128.0;
                  const w = t * t * (3.0 - 2.0 * t);
                  const sxL = Math.max(0, Math.min(HI_SIZE - 1, Math.round(fx)));
                  const sxR = Math.max(0, Math.min(HI_SIZE - 1, Math.round(fx - 896.0)));
                  val = dL[cOff + sxL] * (1.0 - w) + dR[cOff + sxR] * w;
                }
                eyeRgba1024[p4 + c] = (Math.max(0.0, Math.min(1.0, val)) * 255.0 + 0.5) | 0;
              }
              eyeRgba1024[p4 + 3] = 255;
            }
          }
          upscaled = true;
        } catch (_srErr) {}
      }
      if (!upscaled) {
        const fullW = 480;
        const yStart = 24, winH = 208;
        for (let y = 0; y < HI_SIZE; y++) {
          const sy = Math.max(0, Math.min(CROP - 1, Math.round(yStart + ((y + 0.5) / HI_SIZE) * winH - 0.5)));
          const rOff = sy * CROP;
          for (let x = 0; x < HI_SIZE; x++) {
            const fx = ((x + 0.5) / HI_SIZE) * fullW - 0.5;
            const p4 = (y * HI_SIZE + x) << 2;
            for (let c = 0; c < 3; c++) {
              const cOff = c * plane + rOff;
              let val;
              if (fx < 224.0) {
                val = leftTile[cOff + Math.max(0, Math.min(CROP - 1, Math.round(fx)))];
              } else if (fx >= 256.0) {
                val = rightTile[cOff + Math.max(0, Math.min(CROP - 1, Math.round(fx - 224.0)))];
              } else {
                const t = (fx - 224.0) / 32.0;
                val = leftTile[cOff + Math.round(fx)] * (1.0 - t) + rightTile[cOff + Math.round(fx - 224.0)] * t;
              }
              eyeRgba1024[p4 + c] = (Math.max(0.0, Math.min(1.0, val)) * 255.0 + 0.5) | 0;
            }
            eyeRgba1024[p4 + 3] = 255;
          }
        }
      }

      const eyeNchw128 = new Float32Array(TENSOR_LEN);
      const inv64 = 1.0 / 64.0;
      for (let by = 0; by < SIZE; by++) {
        const sy0 = by << 3;
        for (let bx = 0; bx < SIZE; bx++) {
          const sx0 = bx << 3;
          let rS = 0.0, gS = 0.0, bS = 0.0;
          for (let oy = 0; oy < 8; oy++) {
            const row = (sy0 + oy) * HI_SIZE;
            for (let ox = 0; ox < 8; ox++) {
              const p4 = (row + sx0 + ox) << 2;
              rS += eyeRgba1024[p4];
              gS += eyeRgba1024[p4 + 1];
              bS += eyeRgba1024[p4 + 2];
            }
          }
          const idx = (by << 7) + bx;
          eyeNchw128[idx] = (rS * inv64 / 255.0) * 2.0 - 1.0;
          eyeNchw128[PIXELS + idx] = (gS * inv64 / 255.0) * 2.0 - 1.0;
          eyeNchw128[2 * PIXELS + idx] = (bS * inv64 / 255.0) * 2.0 - 1.0;
        }
      }
      return { eyeRgba1024, eyeNchw128 };
    }

    // High-precision 1024x1024 per-eye iris center, limbal radius & upper/lower eyelid arch detector
    function detectExactIrises1024(eyeRgba1024, estLx = 248, estLy = 512, estRx = 776, estRy = 512) {
      const lum = (x, y) => {
        const cx = Math.max(0, Math.min(HI_SIZE - 1, x | 0));
        const cy = Math.max(0, Math.min(HI_SIZE - 1, y | 0));
        const p4 = (cy * HI_SIZE + cx) << 2;
        return (0.299 * eyeRgba1024[p4] + 0.587 * eyeRgba1024[p4 + 1] + 0.114 * eyeRgba1024[p4 + 2]) / 255.0;
      };
      const warmth = (x, y) => {
        const cx = Math.max(0, Math.min(HI_SIZE - 1, x | 0));
        const cy = Math.max(0, Math.min(HI_SIZE - 1, y | 0));
        const p4 = (cy * HI_SIZE + cx) << 2;
        return (eyeRgba1024[p4] - eyeRgba1024[p4 + 2]) / 255.0;
      };

      const findOne = (nomX, nomY, isLeft, halfSpanX = 64, halfSpanY = 68) => {
        const xMin = Math.max(64, Math.round(nomX - halfSpanX));
        const xMax = Math.min(HI_SIZE - 65, Math.round(nomX + halfSpanX));
        const yMin = Math.max(160, Math.round(nomY - halfSpanY));
        const yMax = Math.min(HI_SIZE - 161, Math.round(nomY + halfSpanY));

        // 1. Coarse-to-fine dark pupil+iris core matcher (stays strictly inside sclera, zero outward lash bias)
        const evalCandidate = (x, y) => {
          let coreSum = 0.0, coreCnt = 0;
          for (let dy = -30; dy <= 30; dy += 6) {
            const ny = dy / 32.0;
            const maxDx = Math.floor(14.0 * Math.sqrt(Math.max(0.0, 1.0 - ny * ny)));
            for (let dx = -maxDx; dx <= maxDx; dx += 4) {
              // Cap at 0.36 so bright specular catchlights inside the pupil/iris never push the center off-axis
              coreSum += Math.min(lum(x + dx, y + dy), 0.36);
              coreCnt++;
            }
          }
          const coreLum = coreSum / Math.max(1, coreCnt);
          // Tight bilateral sclera flanks (x ± 38px stays inside white sclera before outer lash shadow)
          const flL = 0.5 * (lum(x - 36, y) + lum(x - 44, y + 6));
          const flR = 0.5 * (lum(x + 36, y) + lum(x + 44, y + 6));
          const minFlank = Math.min(flL, flR);
          const belowLum = lum(x, y + 68);
          const dist2 = (x - nomX) * (x - nomX) * 2.0 + (y - nomY) * (y - nomY) * 1.4;
          return minFlank * 0.95 + belowLum * 0.25 - coreLum * 3.80 - dist2 * 0.00006;
        };

        let bestX = nomX, bestY = nomY, bestS = -1e9;
        for (let y = yMin; y <= yMax; y += 5) {
          for (let x = xMin; x <= xMax; x += 5) {
            const s = evalCandidate(x, y);
            if (s > bestS) { bestS = s; bestX = x; bestY = y; }
          }
        }
        const rx0 = bestX, ry0 = bestY;
        for (let y = ry0 - 6; y <= ry0 + 6; y += 2) {
          for (let x = rx0 - 6; x <= rx0 + 6; x += 2) {
            const s = evalCandidate(x, y);
            if (s > bestS) { bestS = s; bestX = x; bestY = y; }
          }
        }

        // 2. Refine BOTH cx & cy directly on the pitch-black pupil + inner iris core centroid (zero outward lash pull!)
        let wx = 0.0, wy = 0.0, ws = 0.0;
        let coreMin = 1.0;
        for (let dy = -34; dy <= 34; dy += 2) {
          const ny = dy / 36.0;
          const maxDx = Math.floor(17.0 * Math.sqrt(Math.max(0.0, 1.0 - ny * ny)));
          for (let dx = -maxDx; dx <= maxDx; dx += 2) {
            const l = lum(bestX + dx, bestY + dy);
            if (l < coreMin) coreMin = l;
            const w = Math.max(0.0, 0.28 - l);
            if (w > 0.0) {
              const w2 = w * w;
              wx += (bestX + dx) * w2;
              wy += (bestY + dy) * w2;
              ws += w2;
            }
          }
        }
        const cx = ws > 1e-4 ? (wx / ws) : bestX;
        const cy = ws > 1e-4 ? (wy / ws) : bestY;

        // 3. Measure true iris radius on the clean medial sclera side (immune to dark outer corner lashes)
        const stripLum = (x, y) => {
          let s = 0.0;
          for (let dy = -12; dy <= 12; dy += 4) s += Math.min(lum(x, y + dy), 0.85);
          return s / 7.0;
        };
        const scanLimbus = (dir) => {
          let peakSclera = 0.0;
          for (let d = 34; d <= 76; d += 2) {
            const l = stripLum(cx + dir * d, cy);
            if (l > peakSclera) peakSclera = l;
          }
          const thresh = coreMin + 0.44 * Math.max(0.15, peakSclera - coreMin);
          for (let d = 18; d <= 68; d++) {
            if (stripLum(cx + dir * d, cy) >= thresh) return d;
          }
          return 46;
        };
        const dMedial = scanLimbus(isLeft ? 1 : -1);
        const dLateral = scanLimbus(isLeft ? -1 : 1);
        const rxPx = Math.min(dLateral, dMedial + 6);
        const rIris = Math.max(0.092, Math.min(0.136, (rxPx / HI_SIZE) * 2.30));

        // 4. Measure exact upper eyelid lash/skin boundary (decreasing Y = upward in image) & lower lid boundary
        let upPx = 66;
        for (let dy = 24; dy <= 105; dy += 2) {
          let lSum = 0.0, wSum = 0.0;
          for (let dx = -12; dx <= 12; dx += 4) {
            lSum += lum(cx + dx, cy - dy);
            wSum += warmth(cx + dx, cy - dy);
          }
          const lAvg = lSum / 7.0;
          const wAvg = wSum / 7.0;
          if ((wAvg > 0.085 && lAvg > 0.22) || (dy > 42 && lAvg < coreMin * 0.78)) {
            upPx = dy;
            break;
          }
        }
        let loPx = 86;
        for (let dy = 28; dy <= 122; dy += 2) {
          let lSum = 0.0, wSum = 0.0;
          for (let dx = -12; dx <= 12; dx += 4) {
            lSum += lum(cx + dx, cy + dy);
            wSum += warmth(cx + dx, cy + dy);
          }
          const lAvg = lSum / 7.0;
          const wAvg = wSum / 7.0;
          if ((wAvg > 0.075 && lAvg > 0.28) || lAvg > 0.56) {
            loPx = dy;
            break;
          }
        }

        // 5. Measure exact inner tip of the white medial sclera right next to the tear duct (full-colour 1024x1024)
        // + strict 4-point anatomical confidence gate so a tear ONLY forms when placement is dead-certain
        const medDir = isLeft ? 1 : -1;
        let maxScleraL = 0.0;
        let lastWhiteD = dMedial + 46;
        let lastWhiteY = cy + 12;
        let hitCaruncle = false;
        for (let d = dMedial + 12; d <= dMedial + 112; d += 2) {
          const sx = cx + medDir * d;
          let colBestL = 0.0, colBestY = cy + 10, colWarm = 0.0;
          for (let dy = -6; dy <= 34; dy += 4) {
            const l = lum(sx, cy + dy);
            const w = warmth(sx, cy + dy);
            const scScore = l - Math.max(0.0, w - 0.05) * 1.6;
            if (scScore > colBestL) { colBestL = scScore; colBestY = cy + dy; colWarm = w; }
          }
          if (colBestL > maxScleraL) maxScleraL = colBestL;
          if (colBestL >= Math.max(0.32, maxScleraL * 0.64) && colWarm < 0.15) {
            lastWhiteD = d;
            lastWhiteY = colBestY;
          } else if (d > dMedial + 28 && maxScleraL > 0.42) {
            // Cleanly detected transition from bright white sclera into the pink/darker tear duct caruncle
            hitCaruncle = true;
            break;
          }
        }
        const targetD = Math.max(dMedial + 30, Math.min(dMedial + 92, lastWhiteD - 6));
        const tearPxX = cx + medDir * targetD;
        const tearPxY = Math.min(cy + 26, lastWhiteY + 8);

        // Verify the exact tear anchor pixel itself sits inside bright, low-warmth white sclera
        let anchorL = 0.0, anchorW = 0.0;
        for (let oy = -4; oy <= 4; oy += 4) {
          for (let ox = -4; ox <= 4; ox += 4) {
            anchorL += lum(tearPxX + ox, tearPxY + oy);
            anchorW += warmth(tearPxX + ox, tearPxY + oy);
          }
        }
        anchorL /= 9.0;
        anchorW /= 9.0;
        const scleraSpan = lastWhiteD - dMedial;
        const tearConf = (
          hitCaruncle &&
          maxScleraL >= 0.44 &&
          scleraSpan >= 26 && scleraSpan <= 86 &&
          anchorL >= 0.40 && anchorW < 0.13
        ) ? 1.0 : 0.0;

        const upOff = Math.max(0.042, Math.min(0.092, upPx / HI_SIZE));
        const loOff = Math.max(0.056, Math.min(0.115, loPx / HI_SIZE));
        return {
          cx, cy, score: bestS,
          px: cx / HI_SIZE, py: 1.0 - cy / HI_SIZE,
          tearX: tearPxX / HI_SIZE, tearY: 1.0 - tearPxY / HI_SIZE,
          tearConf,
          rIris, upOff, loOff,
        };
      };

      let L = findOne(estLx, estLy, true, 64, 68);
      let R = findOne(estRx, estRy, false, 64, 68);
      // Bilateral symmetry verification: if either eye drifted asymmetrically, re-lock around the mirrored peer
      if (Math.abs(L.cy - R.cy) > 30 || Math.abs((L.cx + R.cx) - HI_SIZE) > 48) {
        if (L.score >= R.score) {
          R = findOne(HI_SIZE - L.cx, L.cy, false, 24, 24);
        } else {
          L = findOne(HI_SIZE - R.cx, R.cy, true, 24, 24);
        }
      }
      return {
        pupils: [L.px, L.py, R.px, R.py],
        tears: [L.tearX, L.tearY, R.tearX, R.tearY],
        tearConf: [L.tearConf, R.tearConf],
        geomL: [L.rIris, L.upOff, L.loOff],
        geomR: [R.rIris, R.upOff, R.loOff],
      };
    }

    // Bake high-contrast greyscale + 2D flood-filled coloured irises directly into the generated 1024x1024 image
    // (eliminates post-process alignment drift: iris colour moves 100% locked to the actual pixels during all morphs)
    function bakeGreyscaleWithColouredEyes1024(eyeRgba1024, eyeNchw128, eyeGeom, tintRGB) {
      const irisMask = new Float32Array(HI_SIZE * HI_SIZE);
      const eyes = [
        { cx: eyeGeom.pupils[0] * HI_SIZE, cy: (1.0 - eyeGeom.pupils[1]) * HI_SIZE, g: eyeGeom.geomL },
        { cx: eyeGeom.pupils[2] * HI_SIZE, cy: (1.0 - eyeGeom.pupils[3]) * HI_SIZE, g: eyeGeom.geomR },
      ];

      for (let e = 0; e < 2; e++) {
        const cx = Math.round(eyes[e].cx);
        const cy = Math.round(eyes[e].cy);
        const rIris = eyes[e].g[0];
        const upOff = eyes[e].g[1];
        const loOff = eyes[e].g[2];
        const bx0 = Math.max(0, cx - 88), bx1 = Math.min(HI_SIZE - 1, cx + 88);
        const by0 = Math.max(0, cy - 150), by1 = Math.min(HI_SIZE - 1, cy + 150);
        const bw = bx1 - bx0 + 1;
        const bh = by1 - by0 + 1;
        const visited = new Uint8Array(bw * bh);
        const queue = new Int32Array(bw * bh);
        let qHead = 0, qTail = 0;

        // Seed 2D BFS from the dark pupil center
        const pushSeed = (sx, sy) => {
          if (sx < bx0 || sx > bx1 || sy < by0 || sy > by1) return;
          const li = (sy - by0) * bw + (sx - bx0);
          if (visited[li]) return;
          visited[li] = 1;
          queue[qTail++] = li;
        };
        for (let dy = -12; dy <= 12; dy += 3) {
          for (let dx = -6; dx <= 6; dx += 3) pushSeed(cx + dx, cy + dy);
        }

        const dirs = [-1, 1, -bw, bw];
        while (qHead < qTail) {
          const cur = queue[qHead++];
          const lx = cur % bw;
          const ly = (cur / bw) | 0;
          const px = bx0 + lx;
          const py = by0 + ly;
          const dxN = ((px - cx) / HI_SIZE) * 2.30;
          const dyN = (cy - py) / HI_SIZE; // positive upward
          const r = Math.hypot(dxN, dyN);

          for (let d = 0; d < 4; d++) {
            const nxt = cur + dirs[d];
            if (nxt < 0 || nxt >= bw * bh || visited[nxt]) continue;
            const nlx = nxt % bw;
            if (d === 0 && nlx === bw - 1) continue;
            if (d === 1 && nlx === 0) continue;
            const nly = (nxt / bw) | 0;
            const npx = bx0 + nlx;
            const npy = by0 + nly;

            const ndx = ((npx - cx) / HI_SIZE) * 2.30;
            const ndy = (cy - npy) / HI_SIZE;
            const nr = Math.hypot(ndx, ndy);
            if (nr > rIris * 1.06) continue;
            const upArch = upOff - 1.45 * ndx * ndx;
            const loArch = -loOff + 0.95 * ndx * ndx;
            if (ndy > upArch || ndy < loArch) continue;

            const p4 = (npy * HI_SIZE + npx) << 2;
            const rr = eyeRgba1024[p4] / 255.0;
            const gg = eyeRgba1024[p4 + 1] / 255.0;
            const bb = eyeRgba1024[p4 + 2] / 255.0;
            const l = 0.299 * rr + 0.587 * gg + 0.114 * bb;
            const sat = Math.max(rr, gg, bb) - Math.min(rr, gg, bb);
            // Stop cleanly at white sclera outside inner catchlight core
            if (nr > rIris * 0.46 && (l - sat * 0.55) > 0.41) continue;
            // Stop cleanly at warm upper/lower eyelid skin
            if (Math.abs(ndy) > 0.022 && (rr - bb) > 0.080 && l > 0.23) continue;

            visited[nxt] = 1;
            queue[qTail++] = nxt;
          }
        }

        // Anti-aliased 3px feather of the flood-filled iris mask into irisMask
        const tmp = new Float32Array(bw * bh);
        for (let ly = 0; ly < bh; ly++) {
          const row = ly * bw;
          for (let lx = 0; lx < bw; lx++) {
            let s = 0.0;
            for (let k = -2; k <= 2; k++) {
              const xx = Math.max(0, Math.min(bw - 1, lx + k));
              s += visited[row + xx];
            }
            tmp[row + lx] = s * 0.2;
          }
        }
        for (let ly = 0; ly < bh; ly++) {
          const py = by0 + ly;
          const outRow = py * HI_SIZE;
          for (let lx = 0; lx < bw; lx++) {
            let s = 0.0;
            for (let k = -2; k <= 2; k++) {
              const yy = Math.max(0, Math.min(bh - 1, ly + k));
              s += tmp[yy * bw + lx];
            }
            const v = s * 0.2;
            if (v > 0.005) {
              const px = bx0 + lx;
              const dxN = ((px - cx) / HI_SIZE) * 2.30;
              const dyN = (cy - py) / HI_SIZE;
              const r = Math.hypot(dxN, dyN);
              // Exclude pitch-black pupil core so pupil stays deep black while iris stroma gets vivid pigment
              const pupilHole = Math.max(0.0, Math.min(1.0, (r - rIris * 0.22) / (rIris * 0.20)));
              const m = v * pupilHole;
              if (m > irisMask[outRow + px]) irisMask[outRow + px] = m;
            }
          }
        }
      }

      // Bake high-contrast silver-gelatin greyscale everywhere + vivid iris colour directly into eyeRgba1024
      const [tr, tg, tb] = tintRGB;
      const totalPx = HI_SIZE * HI_SIZE;
      for (let i = 0; i < totalPx; i++) {
        const p4 = i << 2;
        const r = eyeRgba1024[p4] / 255.0;
        const g = eyeRgba1024[p4 + 1] / 255.0;
        const b = eyeRgba1024[p4 + 2] / 255.0;
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;

        // High-contrast silver-gelatin monochrome base
        let hc = Math.max(0.0, Math.min(1.0, (lum - 0.035) / 0.86));
        hc = Math.pow(hc, 0.90);
        const sc = hc * hc * (3.0 - 2.0 * hc);
        hc = hc * 0.25 + sc * 0.75;

        const m = irisMask[i];
        // Protect pure white specular catchlights & deep black pupil shadows
        const catchProt = Math.max(0.0, Math.min(1.0, (0.82 - lum) / 0.24)) * Math.max(0.0, Math.min(1.0, (lum - 0.04) / 0.09));
        const cm = m * catchProt;
        if (cm > 0.005) {
          const fiberLift = Math.pow(Math.max(lum, 0.01), 0.84) * 1.62;
          const cr = Math.min(1.0, tr * fiberLift);
          const cg = Math.min(1.0, tg * fiberLift);
          const cb = Math.min(1.0, tb * fiberLift);
          eyeRgba1024[p4]     = Math.round(Math.max(0, Math.min(255, (hc * (1.0 - cm) + cr * cm) * 255)));
          eyeRgba1024[p4 + 1] = Math.round(Math.max(0, Math.min(255, (hc * (1.0 - cm) + cg * cm) * 255)));
          eyeRgba1024[p4 + 2] = Math.round(Math.max(0, Math.min(255, (hc * (1.0 - cm) + cb * cm) * 255)));
        } else {
          const gv = Math.round(Math.max(0, Math.min(255, hc * 255)));
          eyeRgba1024[p4] = gv;
          eyeRgba1024[p4 + 1] = gv;
          eyeRgba1024[p4 + 2] = gv;
        }
      }

      // Sync 128x128 critic proxy buffer with the baked greyscale+coloured-eyes image
      const inv64 = 1.0 / 64.0;
      for (let by = 0; by < SIZE; by++) {
        const sy0 = by << 3;
        for (let bx = 0; bx < SIZE; bx++) {
          const sx0 = bx << 3;
          let rS = 0.0, gS = 0.0, bS = 0.0;
          for (let oy = 0; oy < 8; oy++) {
