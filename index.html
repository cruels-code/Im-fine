              col += vec3(1.0, 0.99, 0.98) * (catchlightHdr * 0.65 * inSwallow * isBakedIris * u_fx.x);
            }
          }
          if (pixSat > 0.10 && !isSideRain) {
            float glowAmt = smoothstep(0.10, 0.42, pixSat) * (1.0 - blinkMask) * (1.0 - eclipseBlack);
            float ignBoost = 1.0 + u_fx.w * 1.95;
            col += t * (1.28 * glowAmt * ignBoost);
          }

          // Pure Animated White Noise Event + 3D Particle Burst flying straight toward the viewer (+Z)
          if ((u_crt_static > 0.001 || u_crt_burst > 0.001) && !isSideRain) {
            vec2 cmL = vec2((a_uv.x - pL.x) * 2.3, a_uv.y - pL.y);
            vec2 cmR = vec2((a_uv.x - pR.x) * 2.3, a_uv.y - pR.y);
            bool isLeftEye = length(cmL) <= length(cmR);
            vec2 cmNear = isLeftEye ? cmL : cmR;
            vec3 eyeG = isLeftEye ? u_eye_geom_l : u_eye_geom_r;
            float rIris = eyeG.x;
            float upOff = eyeG.y;
            float loOff = eyeG.z;
            float rCornea = length(cmNear);
            float upperArchY = upOff - 1.45 * cmNear.x * cmNear.x;
            float lowerArchY = -loOff + 0.95 * cmNear.x * cmNear.x;
            float noiseLidClip = smoothstep(upperArchY + 0.022, upperArchY - 0.028, cmNear.y)
                               * smoothstep(lowerArchY - 0.055, lowerArchY + 0.020, cmNear.y);
            float noiseZone = smoothstep(rIris * 3.70, rIris * 0.53, rCornea) * noiseLidClip * (1.0 - blinkMask);
            if (noiseZone > 0.004) {
              uint fr = uint(u_frame);
              // 2x square white-noise grain cells (pattern-free PCG3D integer hash)
              uvec2 noiseCell = uvec2(floor(vec2(a_uv.x * 2.3, a_uv.y) * 165.0));
              float n = float(pcg3dV(uvec3(noiseCell.x, noiseCell.y, fr)).x) * (1.0 / 4294967295.0);
              float snow = smoothstep(0.10, 0.90, n);
              if (u_crt_static > 0.001) {
                float crtMask = pow(noiseZone, 1.55) * u_crt_static;
                vec3 noiseCol = vec3(snow * 1.42);
                noiseCol += vec3(1.0, 0.99, 0.97) * (catchlightHdr * 0.95);
                col = mix(col, noiseCol, crtMask);
                headVis = max(headVis, crtMask * 0.85 * smoothstep(0.08, 0.55, noiseZone));
              }
              // 3D radial particle burst toward the viewer (+Z) matching the slow, silky drift speed & style of the side-rain
              if (u_crt_burst > 0.001 && a_seed.x > 0.78 && noiseZone > 0.14) {
                float delay = a_seed.y * 0.18;
                float bt = clamp((u_crt_burst - delay) / max(1.0 - delay, 0.08), 0.0, 1.0);
                if (bt > 0.001 && bt < 0.999) {
                  float curve = 0.16 * bt + 0.84 * bt * bt;
                  float rndV = fract(a_seed.x * 37.3 + a_seed.y * 19.7);
                  float bAng = a_seed.y * 6.28318 + a_seed.x * 13.7;
                  vec2 radDir = normalize(cmNear + vec2(cos(bAng), sin(bAng)) * 0.03 + vec2(1e-4));
                  // Radial outward + slow silky drift forward toward the viewer (2x slower, fades out after 2.0s)
                  pos.xy += radDir * ((0.13 + 0.15 * rndV) * curve)
                          + vec2(cos(bAng), sin(bAng)) * (0.008 * bt * sin(bt * 6.28318 + a_seed.x * 19.0));
                  pos.z  += (0.27 + 0.30 * rndV) * curve;
                  col = vec3(0.22 + 0.95 * snow);
                  float burstEnv = 1.0 - smoothstep(0.68, 1.0, bt);
                  headVis = max(headVis, burstEnv * smoothstep(0.14, 0.45, noiseZone));
                  shedFade *= burstEnv;
                }
              }
            }
          }

          // Interactive 3D camera orbit, zoom & organic handheld roll/pan (defaults dead head-on: yaw=0, pitch=0, camZ=2.82)
          float cy = cos(u_cam.x), sy = sin(u_cam.x);
          float cp = cos(u_cam.y), sp = sin(u_cam.y);
          vec3 p1 = vec3(pos.x * cy + pos.z * sy, pos.y, -pos.x * sy + pos.z * cy);
          vec3 p2 = vec3(p1.x, p1.y * cp - p1.z * sp, p1.y * sp + p1.z * cp);
          float cr = cos(u_cam_handheld.x), sr = sin(u_cam_handheld.x);
          vec3 p3 = vec3(
            p2.x * cr - p2.y * sr + u_cam_handheld.y,
            p2.x * sr + p2.y * cr + u_cam_handheld.z,
            p2.z
          );

          float camZ = max(u_cam.z, 1.10);
          float zCam = camZ - p3.z;
          float asp = max(u_aspect, 0.1);
          vec2 aspectScale = (asp >= 1.0) ? vec2(1.0 / asp, 1.0) : vec2(1.0, asp);
          vec2 proj = (p3.xy * 2.38 * aspectScale) / max(zCam, 0.30);
          float zNdc = clamp((zCam - 0.30) / (camZ + 1.80), 0.0, 1.0) * 2.0 - 1.0;

          // 3. Subtle optical Depth of Field locked 100% onto BOTH live convex irises at all times
          float irisDepth = 0.5 * (texture(u_depth_state, pL).r + texture(u_depth_state, pR).r);
          float irisWorldZ = (irisDepth - 0.45) * 1.18 + 0.15;
          vec3 eyePos = vec3(0.0, 0.0, irisWorldZ);
          vec3 e1 = vec3(eyePos.x * cy + eyePos.z * sy, eyePos.y, -eyePos.x * sy + eyePos.z * cy);
          vec3 e2 = vec3(e1.x, e1.y * cp - e1.z * sp, e1.y * sp + e1.z * cp);
          float focalZCam = camZ - e2.z;

          // Keep both irises, pupils, catchlights & lashes 100% tack-sharp; softly defocus outer temples & brow
          vec2 irisDL = (a_uv - pL) / vec2(0.16, 0.18);
          vec2 irisDR = (a_uv - pR) / vec2(0.16, 0.18);
          float eyeFocusLock = clamp(max(exp(-dot(irisDL, irisDL)), exp(-dot(irisDR, irisDR))), 0.0, 1.0);
          float distFromEyes = abs(zCam - focalZCam);
          float coc = smoothstep(0.055, 0.46, distFromEyes) * (1.0 - eyeFocusLock);

          // Subtle disk-distributed optical defocus scatter + gentle energy-conserving bokeh bloom
          float bAng = a_seed.x * 6.28318 + a_seed.y * 12.566;
          float bRad = sqrt(a_seed.y) * coc * 0.0085;
          proj += vec2(cos(bAng), sin(bAng)) * bRad * aspectScale;

          gl_Position = vec4(proj, zNdc, 1.0);
          gl_PointSize = 1.0 + coc * 1.45;
          float dofDim = mix(1.0, 0.68, coc * (1.0 - 0.50 * scatterLift));
          float dofAlpha = mix(1.0, 0.46, coc * (1.0 - 0.50 * scatterLift));
          v_col = col * headVis * edgeFade * shedFade * dofDim;
          v_alpha = headVis * edgeFade * shedFade * dofAlpha;
          v_bokeh = coc;
        }
      `;

      const FS_PARTICLES = `#version 300 es
        precision highp float;
        in vec3 v_col;
        in float v_alpha;
        in float v_bokeh;
        out vec4 fragColor;

        void main() {
          float shape = 1.0;
          if (v_bokeh > 0.02) {
            vec2 d = gl_PointCoord - 0.5;
            float r2 = dot(d, d);
            if (r2 > 0.25) discard;
            shape = mix(1.0, exp(-r2 * 10.0), smoothstep(0.02, 0.35, v_bokeh));
          }
          fragColor = vec4(v_col, v_alpha * shape);
        }
      `;

      // Floating 3D Void Embers (~1,536 slow-drifting ambient dust motes orbiting around the 3D head)
      const VS_EMBERS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec4 a_orb; // radius, theta0, phi0, speed

        uniform float u_time;
        uniform vec2 u_orbit;

        out vec3 v_col;
        out float v_alpha;

        void main() {
          float rad = a_orb.x;
          float th = a_orb.y + u_time * a_orb.w;
          float ph = a_orb.z + sin(u_time * 0.22 + a_orb.y * 3.0) * 0.18;
          vec3 pos = vec3(
            rad * cos(ph) * cos(th),
            rad * sin(ph) * 0.88 + sin(u_time * 0.35 + a_orb.y * 5.0) * 0.06,
            rad * cos(ph) * sin(th) * 0.72
          );

          float yaw = u_orbit.x + sin(u_time * 0.32) * 0.19;
          float pitch = u_orbit.y + cos(u_time * 0.24) * 0.06;
          float cy = cos(yaw), sy = sin(yaw);
          float cp = cos(pitch), sp = sin(pitch);
          vec3 p1 = vec3(pos.x * cy + pos.z * sy, pos.y, -pos.x * sy + pos.z * cy);
          vec3 p2 = vec3(p1.x, p1.y * cp - p1.z * sp, p1.y * sp + p1.z * cp);

          float camZ = 2.08;
          float zCam = camZ - p2.z;
          vec2 proj = (p2.xy * 2.15) / max(zCam, 0.25);
          float zNdc = clamp((zCam - 1.15) / 2.20, 0.0, 1.0) * 2.0 - 1.0;

          float bokeh = smoothstep(0.12, 0.75, abs(p2.z - 0.20));
          float twinkle = 0.55 + 0.45 * sin(u_time * (0.9 + abs(a_orb.w) * 14.0) + a_orb.y * 19.0);
          gl_Position = vec4(proj, zNdc, 1.0);
          gl_PointSize = clamp(mix(2.2, 6.2, bokeh) * (2.05 / max(zCam, 0.4)), 1.5, 9.5);
          // Warm pale-bone & muted crimson-gold dust motes
          vec3 emberCol = mix(vec3(0.84, 0.78, 0.68), vec3(0.76, 0.36, 0.26), fract(a_orb.y * 13.7));
          v_col = emberCol;
          v_alpha = twinkle * mix(0.42, 0.16, bokeh);
        }
      `;

      const FS_EMBERS = `#version 300 es
        precision highp float;
        in vec3 v_col;
        in float v_alpha;
        out vec4 fragColor;

        void main() {
          vec2 c = gl_PointCoord - vec2(0.5);
          float r2 = dot(c, c);
          if (r2 > 0.25) discard;
          float glow = exp(-r2 * 14.0) * (1.0 - smoothstep(0.14, 0.25, r2));
          fragColor = vec4(v_col, v_alpha * glow);
        }
      `;

      // Afterimage Motion Trail Decay & Display Blit shaders
      const FS_TRAIL_DECAY = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;
        uniform sampler2D u_prev_trail;
        uniform float u_decay;
        uniform float u_hdr_decay;
        void main() {
          vec3 prev = max(texture(u_prev_trail, v_uv).rgb, vec3(0.0));
          float peak = max(prev.r, max(prev.g, prev.b));
          // Idea 9: Catchlight Ghost Trail (Phosphor Persistence) — True HDR catchlights linger ~300ms like CRT phosphor
          float isCatchlight = smoothstep(0.95, 1.45, peak);
          float effDecay = mix(u_decay, u_hdr_decay, isCatchlight);
          vec3 c = prev * effDecay;
          // Crisp floor to exact #000000 so trails never leave a grey haze in the void
          c *= smoothstep(0.004, 0.022, max(c.r, max(c.g, c.b)));
          fragColor = vec4(c, 1.0);
        }
      `;

      // Subtle UnrealGlow / UnrealBloom shaders (soft-knee highlight extraction + separable dual-radius Gaussian blur)
      const FS_BLOOM_THRESH = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;
        uniform sampler2D u_src;
        void main() {
          vec3 c = max(texture(u_src, v_uv).rgb, vec3(0.0));
          float br = max(c.r, max(c.g, c.b));
          float thresh = 0.60;
          float knee = 0.28;
          float soft = clamp(br - thresh + knee, 0.0, 2.0 * knee);
          soft = (soft * soft) / (4.0 * knee + 1e-5);
          float contrib = max(soft, br - thresh) / max(br, 1e-5);
          fragColor = vec4(c * max(contrib, 0.0), 1.0);
        }
      `;

      const FS_BLOOM_BLUR = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;
        uniform sampler2D u_src;
        uniform vec2 u_dir;
        void main() {
          vec3 sum = texture(u_src, v_uv).rgb * 0.227027;
          sum += texture(u_src, v_uv + u_dir * 1.384615).rgb * 0.316216;
          sum += texture(u_src, v_uv - u_dir * 1.384615).rgb * 0.316216;
          sum += texture(u_src, v_uv + u_dir * 3.230769).rgb * 0.070270;
          sum += texture(u_src, v_uv - u_dir * 3.230769).rgb * 0.070270;
          fragColor = vec4(sum, 1.0);
        }
      `;

      const FS_BLIT = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        out vec4 fragColor;
        uniform sampler2D u_tex;
        uniform sampler2D u_bloom;
        uniform float u_bloom_strength;
        uniform float u_grayscale;
        uniform float u_hdr_headroom;

        // Extended-range filmic HDR shoulder: preserves rich midtones & pure #000000 while letting
        // specular catchlights & teardrop caustics radiate smoothly up to u_hdr_headroom (1.0 SDR -> 2.4+ True HDR)
        vec3 hdrFilmicRoll(vec3 x, float headroom) {
          float peak = max(max(x.r, max(x.g, x.b)), 1e-5);
          float knee = 0.82;
          if (peak <= knee) return x;
          float span = max(headroom - knee, 0.18);
          float mapped = knee + span * (1.0 - exp(-(peak - knee) / span));
          return x * (mapped / peak);
        }

        void main() {
          vec3 base = max(texture(u_tex, v_uv).rgb, vec3(0.0));
          vec3 glow = max(texture(u_bloom, v_uv).rgb, vec3(0.0)) * u_bloom_strength;
          // Unclamped floating-point HDR composite -> extended filmic tone-mapping
          vec3 col = hdrFilmicRoll(base + glow, u_hdr_headroom);
          // High-contrast silver-gelatin greyscale toggle (G key) preserving true HDR catchlight headroom
          if (u_grayscale > 0.001) {
            float g = dot(col, vec3(0.299, 0.587, 0.114));
            float baseG = clamp((g - 0.045) / 0.84, 0.0, 1.0);
            baseG = pow(baseG, 0.90);
            float sc = baseG * baseG * (3.0 - 2.0 * baseG);
            float hc = clamp(mix(baseG, sc, 0.82), 0.0, 1.0);
            // Preserve extended HDR specular sparkle above 1.0 in monochrome HDR
            hc += max(0.0, g - 0.88) * 1.15;
            col = mix(col, vec3(hc), u_grayscale);
          }
          col = clamp(col, vec3(0.0), vec3(u_hdr_headroom));
          fragColor = vec4(col, 1.0);
        }
      `;

      const progChimera = createProgram(VS_QUAD, FS_CHIMERA);
      const progAdvect = createProgram(VS_QUAD, FS_ADVECTION);
      const progGrade = createProgram(VS_QUAD, FS_GRADE);
      const progDepthSim = createProgram(VS_QUAD, FS_DEPTH_SIM);
      const progParticles = createProgram(VS_PARTICLES, FS_PARTICLES);
      const progEmbers = createProgram(VS_EMBERS, FS_EMBERS);
      const progTrailDecay = createProgram(VS_QUAD, FS_TRAIL_DECAY);
      const progBloomThresh = createProgram(VS_QUAD, FS_BLOOM_THRESH);
      const progBloomBlur = createProgram(VS_QUAD, FS_BLOOM_BLUR);
      const progBlit = createProgram(VS_QUAD, FS_BLIT);

      // Build 262,144 grid-free R2 quasirandom (blue-noise-like) particles on GPU — zero rows, columns, or Moire
      const particleVao = gl.createVertexArray();
      gl.bindVertexArray(particleVao);
      const particleData = new Float32Array(PARTICLE_COUNT * 4);
      let pSeed = 918273;
      const pRand = () => {
        pSeed = (pSeed * 1664525 + 1013904223) >>> 0;
        return pSeed / 4294967296;
      };
      const r2A1 = 0.7548776662466927;
      const r2A2 = 0.5698402909980532;
      let uAcc = 0.5;
      let vAcc = 0.5;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        uAcc = (uAcc + r2A1) % 1.0;
        vAcc = (vAcc + r2A2) % 1.0;
        const idx = i * 4;
        particleData[idx + 0] = Math.min(0.999, Math.max(0.001, uAcc + (pRand() - 0.5) * 0.0016));
        particleData[idx + 1] = Math.min(0.999, Math.max(0.001, vAcc + (pRand() - 0.5) * 0.0016));
        particleData[idx + 2] = pRand();
        particleData[idx + 3] = pRand();
      }
      const particleVbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, particleVbo);
      gl.bufferData(gl.ARRAY_BUFFER, particleData, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);

      // Build 1,536 orbiting 3D void ember dust motes
      const EMBER_COUNT = 1536;
      const emberVao = gl.createVertexArray();
      gl.bindVertexArray(emberVao);
      const emberData = new Float32Array(EMBER_COUNT * 4);
      for (let i = 0; i < EMBER_COUNT; i++) {
        emberData[i * 4 + 0] = 0.78 + 0.78 * pRand();                   // 3D shell radius around head
        emberData[i * 4 + 1] = pRand() * Math.PI * 2.0;                 // theta0
        emberData[i * 4 + 2] = (pRand() - 0.5) * Math.PI * 0.88;        // elevation phi0
        emberData[i * 4 + 3] = (pRand() < 0.5 ? -1.0 : 1.0) * (0.04 + 0.11 * pRand()); // slow orbit speed
      }
      const emberVbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, emberVbo);
      gl.bufferData(gl.ARRAY_BUFFER, emberData, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
      gl.bindVertexArray(quadVao);

      function createDepthTex(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, w, h, 0, gl.RED, gl.FLOAT, new Float32Array(w * h));
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function uploadDepthTex(tex, floats) {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, DEPTH_SIZE, DEPTH_SIZE, gl.RED, gl.FLOAT, floats);
      }

      // 5 live 224x224 depth textures synchronized 1:1 with texHost + texDonor[0..3]
      const texDepthHost = createDepthTex(DEPTH_SIZE, DEPTH_SIZE);
      const texDepthDonor = [
        createDepthTex(DEPTH_SIZE, DEPTH_SIZE),
        createDepthTex(DEPTH_SIZE, DEPTH_SIZE),
        createDepthTex(DEPTH_SIZE, DEPTH_SIZE),
        createDepthTex(DEPTH_SIZE, DEPTH_SIZE),
      ];
      let hasDepthInit = false;

      function createFloatTex(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, FBO_INTERNAL_FMT, w, h, 0, gl.RGBA, FBO_SRC_TYPE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function createHiTex(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function uploadHiTex(tex, rgbaBytes) {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, HI_SIZE, HI_SIZE, gl.RGBA, gl.UNSIGNED_BYTE, rgbaBytes);
        gl.generateMipmap(gl.TEXTURE_2D);
      }

      // 5 full 1024x1024 mipmapped source portraits + 128x128 critic delta texture
      const texHost = createHiTex(HI_SIZE, HI_SIZE);
      const texDonor = [
        createHiTex(HI_SIZE, HI_SIZE),
        createHiTex(HI_SIZE, HI_SIZE),
        createHiTex(HI_SIZE, HI_SIZE),
        createHiTex(HI_SIZE, HI_SIZE),
      ];
      const texCriticDelta = createFloatTex(CRITIC_SIZE, CRITIC_SIZE);
      gl.bindTexture(gl.TEXTURE_2D, texCriticDelta);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CRITIC_SIZE, CRITIC_SIZE, gl.RGBA, gl.FLOAT, new Float32Array(CRITIC_SIZE * CRITIC_SIZE * 4));

      // Ping-pong 1024x1024 chimera FBO (Pass 0), advection FBO (Pass 1) & afterimage trail FBO (Pass 2)
      const chimeraTex = [createFloatTex(FBO_SIZE, FBO_SIZE), createFloatTex(FBO_SIZE, FBO_SIZE)];
      const chimeraFbo = [gl.createFramebuffer(), gl.createFramebuffer()];
      const fboTex = [createFloatTex(FBO_SIZE, FBO_SIZE), createFloatTex(FBO_SIZE, FBO_SIZE)];
      const fbo = [gl.createFramebuffer(), gl.createFramebuffer()];
      const trailTex = [createFloatTex(viewW, viewH), createFloatTex(viewW, viewH)];
      const trailFbo = [gl.createFramebuffer(), gl.createFramebuffer()];
      let bloomW = Math.max(2, viewW >> 1);
      let bloomH = Math.max(2, viewH >> 1);
      const bloomTex = [createFloatTex(bloomW, bloomH), createFloatTex(bloomW, bloomH)];
      const bloomFbo = [gl.createFramebuffer(), gl.createFramebuffer()];
      const depthStateTex = [createFloatTex(PARTICLE_GRID, PARTICLE_GRID), createFloatTex(PARTICLE_GRID, PARTICLE_GRID)];
      const depthStateFbo = [gl.createFramebuffer(), gl.createFramebuffer()];
      const trailDepthRb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, trailDepthRb);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, viewW, viewH);
      gl.bindRenderbuffer(gl.RENDERBUFFER, null);

      function resizeViewport() {
        const next = computeViewportSize();
        viewAspect = next.aspect;
        if (next.w === viewW && next.h === viewH) return;
        viewW = next.w;
        viewH = next.h;
        bloomW = Math.max(2, viewW >> 1);
        bloomH = Math.max(2, viewH >> 1);
        canvas.width = viewW;
        canvas.height = viewH;
        configureHdrDrawingBuffer(viewW, viewH);
        for (let i = 0; i < 2; i++) {
          gl.bindTexture(gl.TEXTURE_2D, trailTex[i]);
          gl.texImage2D(gl.TEXTURE_2D, 0, FBO_INTERNAL_FMT, viewW, viewH, 0, gl.RGBA, FBO_SRC_TYPE, null);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[i]);
          gl.texImage2D(gl.TEXTURE_2D, 0, FBO_INTERNAL_FMT, bloomW, bloomH, 0, gl.RGBA, FBO_SRC_TYPE, null);
        }
        gl.bindRenderbuffer(gl.RENDERBUFFER, trailDepthRb);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, viewW, viewH);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        for (let i = 0; i < 2; i++) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo[i]);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFbo[i]);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }
      window.addEventListener("resize", resizeViewport);

      gl.clearColor(-1.0, -1.0, -1.0, 0.0);
      for (let i = 0; i < 2; i++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, chimeraFbo[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, chimeraTex[i], 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex[i], 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      gl.clearColor(0.0, 0.0, 0.0, 1.0);
      for (let i = 0; i < 2; i++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, trailTex[i], 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, trailDepthRb);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFbo[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, bloomTex[i], 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, depthStateFbo[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, depthStateTex[i], 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      let chimeraIdx = 0;
      let fboIdx = 0;
      let trailIdx = 0;
      let depthStateIdx = 0;
      let needsDepthInit = false;
      let lastUpdateTime = performance.now();
      let lastRenderMs = 0;
      let latestTension = 0.0;
      let latestRadius = 0.088;
      let latestCriticWeight = 0.18;
      let latestChimeraBlend = 0.45;

      // Interactive 3D camera controls: drag to orbit, scroll/pinch to zoom, double-click or R to reset head-on
      const DEFAULT_CAM_Z = 3.51; // zoomed out 1 mouse-wheel detent from 2.82
      let targetYaw = 0.0, targetPitch = 0.0, targetCamZ = DEFAULT_CAM_Z;
      let camYaw = 0.0, camPitch = 0.0, camZ = DEFAULT_CAM_Z;
      let handheldBlend = 1.0;
      let isDragging = false;

      // Smooth cubic-interpolated 1D value noise + 3-octave FBM for organic, non-periodic handheld camera feel
      const hhHash = (n) => {
        const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
        return (s - Math.floor(s)) * 2.0 - 1.0;
      };
      const hhNoise1D = (x, seed) => {
        const i = Math.floor(x);
        const f = x - i;
        const u = f * f * (3.0 - 2.0 * f);
        return hhHash(i + seed * 57.0) * (1.0 - u) + hhHash(i + 1 + seed * 57.0) * u;
      };
      const hhFbm = (t, seed) => (
        hhNoise1D(t * 0.24, seed) * 0.62 +
        hhNoise1D(t * 0.78, seed + 13.7) * 0.28 +
        hhNoise1D(t * 2.35, seed + 29.3) * 0.10
      );
      let dragStartX = 0, dragStartY = 0;
      const activePointers = new Map();
      let pinchStartDist = 0;

      function resetCamera() {
        targetYaw = 0.0;
        targetPitch = 0.0;
        targetCamZ = DEFAULT_CAM_Z;
      }

      window.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activePointers.size === 1) {
          isDragging = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
        } else if (activePointers.size === 2) {
          isDragging = false;
          const pts = Array.from(activePointers.values());
          pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
      });
      window.addEventListener("pointermove", (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }
        if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (pinchStartDist > 0) {
            const delta = (pinchStartDist - dist) * 0.008;
            targetCamZ = Math.max(1.25, Math.min(5.20, targetCamZ + delta));
          }
          pinchStartDist = dist;
          return;
        }
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        const MAX_ORBIT_RAD = (10.0 * Math.PI) / 180.0;
        targetYaw = Math.max(-MAX_ORBIT_RAD, Math.min(MAX_ORBIT_RAD, targetYaw + dx * 0.004));
        targetPitch = Math.max(-MAX_ORBIT_RAD, Math.min(MAX_ORBIT_RAD, targetPitch + dy * 0.004));
      });
      const endPointer = (e) => {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) pinchStartDist = 0;
        if (activePointers.size === 0) isDragging = false;
      };
      window.addEventListener("pointerup", endPointer);
      window.addEventListener("pointercancel", endPointer);
      window.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomStep = e.deltaY * 0.0022;
        targetCamZ = Math.max(1.25, Math.min(5.20, targetCamZ * Math.exp(zoomStep)));
      }, { passive: false });
      canvas.addEventListener("dblclick", resetCamera);

      // Visual-only auto-fading crosshair cursor (no mouse-over effect on portrait or particles)
      let cursorX = 0.5;
      let cursorY = 0.5;
      let smoothCursorX = 0.5;
      let smoothCursorY = 0.5;
      let cursorVel = 0.0;
      const reticle = document.getElementById("cursor-reticle");
      let reticleIdleTimer = null;
      window.addEventListener("mousemove", (e) => {
        if (reticle) {
          reticle.style.left = e.clientX + "px";
          reticle.style.top = e.clientY + "px";
          reticle.classList.add("active");
          clearTimeout(reticleIdleTimer);
          reticleIdleTimer = setTimeout(() => reticle.classList.remove("active"), 1400);
        }
      });
      document.addEventListener("mouseleave", () => {
        clearTimeout(reticleIdleTimer);
        if (reticle) reticle.classList.remove("active");
      });

      // Launch inline Blob Web Workers with subpath-safe base URL & mobile flag (works on localhost, LAN & GitHub Pages /<repo>/)
      const appBasePreamble = `const APP_BASE_URL = ${JSON.stringify(new URL("./", window.location.href).href)};\nconst IS_MOBILE = ${IS_MOBILE};\n`;
      const workerBlob = new Blob(
        [appBasePreamble, document.getElementById("critic-worker").textContent],
        { type: "application/javascript" }
      );
      const worker = new Worker(URL.createObjectURL(workerBlob));
      const genBlob = new Blob(
        [appBasePreamble, document.getElementById("gen-worker").textContent],
        { type: "application/javascript" }
      );
      const genWorker = new Worker(URL.createObjectURL(genBlob));
      const loaderStatusEl = document.getElementById("loader-status");
      genWorker.onmessage = (e) => {
        if (e.data && e.data.type === "status" && loaderStatusEl) {
          loaderStatusEl.textContent = e.data.text || "";
        }
      };
      const channel = new MessageChannel();
      worker.postMessage({ type: "connect_gen" }, [channel.port1]);
      genWorker.postMessage({ type: "init" }, [channel.port2]);

      // Drag-and-drop any portrait image onto the monolith to seed the neural critic & 1024x1024 GPU canvas
      canvas.addEventListener("dragover", (e) => e.preventDefault());
      canvas.addEventListener("drop", (e) => {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        const img = new Image();
        img.onload = () => {
          const offHi = document.createElement("canvas");
          offHi.width = HI_SIZE;
          offHi.height = HI_SIZE;
          const ctxHi = offHi.getContext("2d");
          ctxHi.drawImage(img, 0, 0, HI_SIZE, HI_SIZE);
          const hiBytes = new Uint8Array(ctxHi.getImageData(0, 0, HI_SIZE, HI_SIZE).data.buffer);
          uploadHiTex(texHost, hiBytes);
          needsChimeraInit = true;

          const off = document.createElement("canvas");
          off.width = CRITIC_SIZE;
          off.height = CRITIC_SIZE;
          const ctx = off.getContext("2d");
          ctx.drawImage(img, 0, 0, CRITIC_SIZE, CRITIC_SIZE);
          const pixels = ctx.getImageData(0, 0, CRITIC_SIZE, CRITIC_SIZE).data;
          const nchw = new Float32Array(3 * CRITIC_SIZE * CRITIC_SIZE);
          const plane = CRITIC_SIZE * CRITIC_SIZE;
          for (let i = 0; i < plane; i++) {
            nchw[i] = (pixels[i * 4 + 0] / 127.5) - 1.0;
            nchw[plane + i] = (pixels[i * 4 + 1] / 127.5) - 1.0;
            nchw[2 * plane + i] = (pixels[i * 4 + 2] / 127.5) - 1.0;
          }
          worker.postMessage({ type: "seed", nchw: nchw.buffer }, [nchw.buffer]);
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);
      });

      let pendingDelta = null;
      let pendingHiQueue = [];
      let hasHiInit = false;
      let needsChimeraInit = false;
      let hasFirstFrame = false;
      let liveEyes = [0.36, 0.48, 0.64, 0.48];
      let liveTearConf = [0.0, 0.0];
      let livePupils = [0.223, 0.50, 0.777, 0.50];
      let smoothPupils = [0.223, 0.50, 0.777, 0.50];
      let hasExactEyeGeom = false;
      let liveEyeGeom = [0.116, 0.066, 0.086, 0.116, 0.066, 0.086];
      let smoothEyeGeom = [0.116, 0.066, 0.086, 0.116, 0.066, 0.086];
      let liveMouth = [0.50, 0.277];
      let smoothMouthX = 0.50;
      let smoothMouthY = 0.277;
      let liveFeature = [0.50, 0.56, 0.0];
      let smoothFeatX = 0.50;
      let smoothFeatY = 0.56;
      let smoothFeatCycle = 0.0;
      let tearSide = 0;
      let tearStartMs = 0;
      let tearCycleDur = 52.0;
      let tearOriginLocked = false;
      let pendingTearTrigger = false;
      let smoothTearX = 0.415;
      let smoothTearY = 0.515;

      // Autonomous gallery-grade special events: Blink, Pupil Dilation, Iris Shedding, Micro-Saccade, CRT Static Eyes
      let blinkStartMs = performance.now() + 9000;
      let blinkNextMs = blinkStartMs;
      let smoothPupilDil = 0.0;
      let shedStartMs = -99999;
      let crtStartMs = -99999;
      let crtNextMs = performance.now() + 8000;
      let crtDurMs = 2000;
      // Novel Ideas 1 (Iris Eclipse), 6 (Chromatic Iris Ignition)
      let eclipseStartMs = -99999;
      let eclipseNextMs = performance.now() + 15000;
      let ignitionStartMs = -99999;
      let liveIrisTint = [0.24, 0.56, 1.00];
      // Idea 1: Micro-Saccade Glance (main glance every 10-18s + smaller fine micro-saccades twice as often, every 5-9s)
      let saccadeStartMs = -99999;
      let saccadeNextMs = performance.now() + 7500 + Math.random() * 6000;
      let saccadeHoldMs = 600;
      let saccadeTargetX = 0.0, saccadeTargetY = 0.0;
      let microSacStartMs = -99999;
      let microSacNextMs = performance.now() + 3500 + Math.random() * 3500;
      let microSacHoldMs = 280;
      let microSacTargetX = 0.0, microSacTargetY = 0.0;
      // Colour modes toggled by G: 0 = Generated Greyscale + Coloured Eyes (default), 1 = Pure High-Contrast Greyscale
      let colorMode = 0;
      let smoothGrayscale = 0.0;
      let smoothCorneaOnly = 0.0;
      let blitFrame = 0;
      // 6 iris colour palette: Blue, Red, Green, Brown, Cyan, Hazel
      const EYE_PALETTE = [
        [0.24, 0.56, 1.00], // Blue
        [1.00, 0.16, 0.14], // Red
        [0.20, 0.86, 0.40], // Green
        [0.64, 0.36, 0.18], // Brown
        [0.14, 0.90, 0.96], // Cyan
        [0.74, 0.62, 0.24], // Hazel
      ];
      let irisPaletteIdx = Math.floor(Math.random() * EYE_PALETTE.length);
      const smoothIrisTint = EYE_PALETTE[irisPaletteIdx].slice();
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.key === " ") {
          e.preventDefault();
          if (!e.repeat) pendingTearTrigger = true;
        } else if ((e.key === "r" || e.key === "R") && !e.ctrlKey && !e.metaKey && !e.altKey) {
          resetCamera();
        } else if ((e.key === "g" || e.key === "G") && !e.ctrlKey && !e.metaKey && !e.altKey) {
          if (!e.repeat) colorMode = (colorMode + 1) % 2;
        }
      });
      worker.onmessage = (e) => {
        if (e.data && e.data.type === "donor_hi" && e.data.rgba1024) {
          pendingHiQueue.push({
            role: e.data.role,
            slot: e.data.slot,
            bytes: new Uint8Array(e.data.rgba1024),
            depthBytes: e.data.depth224 ? new Float32Array(e.data.depth224) : null,
            eyeGeom: e.data.eyeGeom || null,
          });
        } else if (e.data && e.data.type === "critic_step") {
          pendingDelta = new Float32Array(e.data.delta);
          latestTension = e.data.tension;
          if (!hasExactEyeGeom && e.data.eyes) liveEyes = e.data.eyes;
          if (e.data.pupils) livePupils = e.data.pupils;
          if (e.data.mouth) liveMouth = e.data.mouth;
          if (e.data.feature) liveFeature = e.data.feature;
          if (typeof e.data.radius === "number") latestRadius = e.data.radius;
          if (typeof e.data.criticWeight === "number") latestCriticWeight = e.data.criticWeight;
          if (typeof e.data.chimeraBlend === "number") latestChimeraBlend = e.data.chimeraBlend;
        }
      };

      function applyExactEyeGeom(eyeGeom, snap = false) {
        if (!eyeGeom || !eyeGeom.pupils) return;
        hasExactEyeGeom = true;
        livePupils = eyeGeom.pupils.slice();
        if (eyeGeom.tears) liveEyes = eyeGeom.tears.slice();
        if (eyeGeom.tearConf) liveTearConf = eyeGeom.tearConf.slice();
        if (eyeGeom.tint) liveIrisTint = eyeGeom.tint.slice();
        if (eyeGeom.geomL && eyeGeom.geomR) {
          liveEyeGeom = [
            eyeGeom.geomL[0], eyeGeom.geomL[1], eyeGeom.geomL[2],
            eyeGeom.geomR[0], eyeGeom.geomR[1], eyeGeom.geomR[2],
          ];
        }
        if (snap) {
          for (let i = 0; i < 4; i++) smoothPupils[i] = livePupils[i];
          for (let i = 0; i < 6; i++) smoothEyeGeom[i] = liveEyeGeom[i];
          if (eyeGeom.tint) for (let c = 0; c < 3; c++) smoothIrisTint[c] = liveIrisTint[c];
        }
      }

      function render(now) {
        // Upload any newly generated 1024x1024 portraits & 224x224 depth maps 1:1 into host & donor slots
        while (pendingHiQueue.length > 0) {
          const item = pendingHiQueue.shift();
          if (item.role === "init") {
            uploadHiTex(texHost, item.bytes);
            for (let k = 0; k < 4; k++) uploadHiTex(texDonor[k], item.bytes);
            if (item.depthBytes) {
              uploadDepthTex(texDepthHost, item.depthBytes);
              for (let k = 0; k < 4; k++) uploadDepthTex(texDepthDonor[k], item.depthBytes);
              hasDepthInit = true;
              needsDepthInit = true;
            }
            applyExactEyeGeom(item.eyeGeom, true);
            hasHiInit = true;
            needsChimeraInit = true;
          } else if (item.role === "seed1") {
            uploadHiTex(texDonor[1], item.bytes);
            uploadHiTex(texDonor[3], item.bytes);
            uploadHiTex(texHost, item.bytes);
            if (item.depthBytes) {
              uploadDepthTex(texDepthDonor[1], item.depthBytes);
              uploadDepthTex(texDepthDonor[3], item.depthBytes);
              uploadDepthTex(texDepthHost, item.depthBytes);
            }
            applyExactEyeGeom(item.eyeGeom, false);
          } else if (item.role === "seed2") {
            uploadHiTex(texDonor[2], item.bytes);
            if (item.depthBytes) uploadDepthTex(texDepthDonor[2], item.depthBytes);
          } else if (item.role === "seed3") {
            uploadHiTex(texDonor[3], item.bytes);
            if (item.depthBytes) uploadDepthTex(texDepthDonor[3], item.depthBytes);
          } else if (item.role === "host") {
            uploadHiTex(texHost, item.bytes);
            if (item.depthBytes) uploadDepthTex(texDepthHost, item.depthBytes);
            applyExactEyeGeom(item.eyeGeom, false);
            // Advance to a fresh iris colour from Blue, Red, Green, Brown, Cyan, Hazel
            irisPaletteIdx = (irisPaletteIdx + 1 + Math.floor(Math.random() * (EYE_PALETTE.length - 1))) % EYE_PALETTE.length;
            // Trigger Iris Colour Shedding, Chromatic Iris Ignition (Idea 6) & simultaneous Blink on new identity arrival
            shedStartMs = now;
            ignitionStartMs = now;
            if (now - blinkStartMs > 6000) {
              blinkStartMs = now;
              blinkNextMs = now + 18000 + Math.random() * 14000;
            }
          } else {
            const s = item.slot & 3;
            uploadHiTex(texDonor[s], item.bytes);
            if (item.depthBytes) uploadDepthTex(texDepthDonor[s], item.depthBytes);
            shedStartMs = now;
          }
        }

        if (pendingDelta) {
          gl.bindTexture(gl.TEXTURE_2D, texCriticDelta);
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CRITIC_SIZE, CRITIC_SIZE, gl.RGBA, gl.FLOAT, pendingDelta);
          pendingDelta = null;
          lastUpdateTime = now;
        }

        if (!hasHiInit) {
          requestAnimationFrame(render);
          return;
        }

        const dtSec = lastRenderMs > 0 ? Math.min(0.14, Math.max(0.008, (now - lastRenderMs) * 0.001)) : (1.0 / 60.0);
        lastRenderMs = now;
        cursorVel *= 0.92;
        smoothCursorX += (cursorX - smoothCursorX) * 0.08;
        smoothCursorY += (cursorY - smoothCursorY) * 0.08;
        smoothFeatX += (liveFeature[0] - smoothFeatX) * 0.18;
        smoothFeatY += (liveFeature[1] - smoothFeatY) * 0.18;
        smoothFeatCycle += (liveFeature[2] - smoothFeatCycle) * 0.25;
        smoothMouthX += (liveMouth[0] - smoothMouthX) * 0.15;
        smoothMouthY += (liveMouth[1] - smoothMouthY) * 0.15;

        // Pass 0: Full 1024x1024 GPU 2-Band Laplacian Chimera & Critic Delta Step
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        const nextChimera = 1 - chimeraIdx;
        gl.bindFramebuffer(gl.FRAMEBUFFER, chimeraFbo[nextChimera]);
        gl.viewport(0, 0, FBO_SIZE, FBO_SIZE);
        gl.useProgram(progChimera);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, chimeraTex[chimeraIdx]);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_prev_chimera"), 0);

        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, texHost);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_host"), 1);

        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, texDonor[0]);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_d0"), 2);

        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, texDonor[1]);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_d1"), 3);

        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, texDonor[2]);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_d2"), 4);

        gl.activeTexture(gl.TEXTURE5);
        gl.bindTexture(gl.TEXTURE_2D, texDonor[3]);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_d3"), 5);

        gl.activeTexture(gl.TEXTURE6);
        gl.bindTexture(gl.TEXTURE_2D, texCriticDelta);
        gl.uniform1i(gl.getUniformLocation(progChimera, "u_critic_delta"), 6);

        gl.uniform2f(gl.getUniformLocation(progChimera, "u_spot"), smoothFeatX, 1.0 - smoothFeatY);
        gl.uniform1f(gl.getUniformLocation(progChimera, "u_radius"), latestRadius);
        gl.uniform1f(gl.getUniformLocation(progChimera, "u_critic_weight"), latestCriticWeight);
        gl.uniform1f(gl.getUniformLocation(progChimera, "u_chimera_blend"), latestChimeraBlend);
        gl.uniform1f(gl.getUniformLocation(progChimera, "u_dt_step"), Math.min(2.0, Math.max(0.25, dtSec * 28.0)));
        gl.uniform1f(gl.getUniformLocation(progChimera, "u_init"), needsChimeraInit ? 1.0 : 0.0);

        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        chimeraIdx = nextChimera;

        if (needsChimeraInit) {
          // Mirror initial crisp 1024x1024 portrait into both chimera FBO buffers (rebind TEXTURE0 to avoid feedback loop)
          const other = 1 - chimeraIdx;
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, chimeraTex[chimeraIdx]);
          gl.bindFramebuffer(gl.FRAMEBUFFER, chimeraFbo[other]);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          needsChimeraInit = false;
        }

        if (!hasFirstFrame) {
          hasFirstFrame = true;
          tearStartMs = now + 600;
          tearCycleDur = 21.0 + Math.random() * 5.0;
          tearOriginLocked = false;
          smoothTearX = liveEyes[0];
          smoothTearY = liveEyes[1];
          canvas.classList.add("ready");
          const loaderEl = document.getElementById("loader");
          if (loaderEl) loaderEl.classList.add("hidden");
        }

        const nextIdx = 1 - fboIdx;

        // Pass 1: Advection FBO (1024x1024)
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[nextIdx]);
        gl.viewport(0, 0, FBO_SIZE, FBO_SIZE);
        gl.useProgram(progAdvect);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, chimeraTex[1 - chimeraIdx]);
        gl.uniform1i(gl.getUniformLocation(progAdvect, "u_prev_neural"), 0);

        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, chimeraTex[chimeraIdx]);
        gl.uniform1i(gl.getUniformLocation(progAdvect, "u_curr_neural"), 1);

        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, fboTex[fboIdx]);
        gl.uniform1i(gl.getUniformLocation(progAdvect, "u_feedback"), 2);

        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_blend"), 1.0);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_tension"), latestTension);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_flow_scale"), 0.017);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_fbo_blend"), 0.24);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_edge_curl"), 1.10);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_brush_streak"), 0.74);
        // High-confidence tear duct gate: ONLY produce a tear when exact white-sclera + tear-duct confidence >= 0.85
        const pickConfidentTearSide = (preferred) => {
          const ok0 = liveTearConf[0] >= 0.85;
          const ok1 = liveTearConf[1] >= 0.85;
          if (!ok0 && !ok1) return -1;
          if (ok0 && ok1) return preferred;
          return ok0 ? 0 : 1;
        };
        if (pendingTearTrigger) {
          pendingTearTrigger = false;
          const pref = tearOriginLocked ? (1 - tearSide) : tearSide;
          const chosen = pickConfidentTearSide(pref);
          if (chosen !== -1) {
            tearSide = chosen;
            tearStartMs = now;
            tearCycleDur = 21.0 + Math.random() * 5.0;
            tearOriginLocked = false;
          }
        }
        let tearElapsed = (now - tearStartMs) * 0.001;
        if (tearElapsed >= tearCycleDur) {
          const pref = Math.random() < 0.78 ? (1 - tearSide) : tearSide;
          const chosen = pickConfidentTearSide(pref);
          if (chosen !== -1) {
            tearSide = chosen;
            tearStartMs = now;
            tearCycleDur = 21.0 + Math.random() * 5.0;
            tearElapsed = 0.0;
            tearOriginLocked = false;
          } else {
            // Hold off silently until a face with high tear-duct confidence arrives
            tearElapsed = -1.0;
          }
        }
        if (tearElapsed >= 0.0 && !tearOriginLocked) {
          if (liveTearConf[tearSide] >= 0.85) {
            smoothTearX = liveEyes[tearSide * 2];
            smoothTearY = liveEyes[tearSide * 2 + 1];
            tearOriginLocked = true;
          } else {
            tearElapsed = -1.0;
          }
        } else if (tearElapsed >= 0.0 && tearElapsed < 2.0) {
          // Gently track the active eye's live tear duct while the tear wells up before detaching
          smoothTearX += (liveEyes[tearSide * 2] - smoothTearX) * 0.14;
          smoothTearY += (liveEyes[tearSide * 2 + 1] - smoothTearY) * 0.14;
        }
        let tearAlpha = 0.0;
        let tearHeadY = smoothTearY;
        if (tearElapsed >= 0.0 && tearElapsed < 2.0) {
          const u = tearElapsed / 2.0;
          tearAlpha = u * u * (3.0 - 2.0 * u);
        } else if (tearElapsed >= 2.0 && tearElapsed < 16.0) {
          tearAlpha = 1.0;
          const d = (tearElapsed - 2.0) / 14.0;
          const sd = d * d * (3.0 - 2.0 * d);
          tearHeadY = smoothTearY - 0.24 * sd;
        } else if (tearElapsed >= 16.0 && tearElapsed < 18.5) {
          // Exact 2.5-second smooth fade-out
          const f = (tearElapsed - 16.0) / 2.5;
          tearAlpha = 1.0 - f * f * (3.0 - 2.0 * f);
          tearHeadY = smoothTearY - 0.24;
        }
        tearAlpha *= 0.95;

        gl.uniform2f(gl.getUniformLocation(progAdvect, "u_cursor"), cursorX, cursorY);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_cursor_vel"), cursorVel);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_mood"), 0.5 + 0.5 * Math.sin(now * 0.00045));
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_time"), now * 0.001);
        gl.uniform2f(gl.getUniformLocation(progAdvect, "u_tear_origin"), smoothTearX, smoothTearY);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_tear_head_y"), tearHeadY);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_tear_alpha"), tearAlpha);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_tear_dir"), tearSide === 0 ? -1.0 : 1.0);
        gl.uniform2f(gl.getUniformLocation(progAdvect, "u_feature_pos"), smoothFeatX, smoothFeatY);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_feature_cycle"), smoothFeatCycle);
        gl.uniform1f(gl.getUniformLocation(progAdvect, "u_dt"), dtSec);
        gl.uniform4f(gl.getUniformLocation(progAdvect, "u_tear_eyes"), liveEyes[0], liveEyes[1], liveEyes[2], liveEyes[3]);
        gl.uniform2f(gl.getUniformLocation(progAdvect, "u_mouth_pos"), smoothMouthX, smoothMouthY);

        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Pass 1.5: Continuous 512x512 GPU Chimera Depth Stitching & Spring-Damper Integrator (always matches live face shape)
        const nextDepthState = 1 - depthStateIdx;
        gl.bindFramebuffer(gl.FRAMEBUFFER, depthStateFbo[nextDepthState]);
        gl.viewport(0, 0, PARTICLE_GRID, PARTICLE_GRID);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        gl.useProgram(progDepthSim);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, depthStateTex[depthStateIdx]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_prev_state"), 0);

        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, texDepthHost);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_d_host"), 1);

        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, texDepthDonor[0]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_d0"), 2);

        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, texDepthDonor[1]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_d1"), 3);

        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, texDepthDonor[2]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_d2"), 4);

        gl.activeTexture(gl.TEXTURE5);
        gl.bindTexture(gl.TEXTURE_2D, texDepthDonor[3]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_d3"), 5);

        gl.activeTexture(gl.TEXTURE6);
        gl.bindTexture(gl.TEXTURE_2D, fboTex[nextIdx]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_fbo"), 6);

        gl.activeTexture(gl.TEXTURE7);
        gl.bindTexture(gl.TEXTURE_2D, fboTex[fboIdx]);
        gl.uniform1i(gl.getUniformLocation(progDepthSim, "u_fbo_prev"), 7);

        gl.uniform2f(gl.getUniformLocation(progDepthSim, "u_spot"), smoothFeatX, smoothFeatY);
        gl.uniform1f(gl.getUniformLocation(progDepthSim, "u_radius"), latestRadius);
        gl.uniform1f(gl.getUniformLocation(progDepthSim, "u_chimera_blend"), latestChimeraBlend);
        gl.uniform1f(gl.getUniformLocation(progDepthSim, "u_dt"), dtSec);
        gl.uniform1f(gl.getUniformLocation(progDepthSim, "u_init"), needsDepthInit ? 1.0 : 0.0);

        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        depthStateIdx = nextDepthState;
        if (needsDepthInit) {
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, depthStateTex[depthStateIdx]);
          gl.bindFramebuffer(gl.FRAMEBUFFER, depthStateFbo[1 - depthStateIdx]);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          needsDepthInit = false;
        }

        // Pass 2A: Afterimage Motion Trail Decay into ping-pong full-screen trailFbo[nextTrail]
        const nextTrail = 1 - trailIdx;
        gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo[nextTrail]);
        gl.viewport(0, 0, viewW, viewH);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        gl.useProgram(progTrailDecay);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, trailTex[trailIdx]);
        gl.uniform1i(gl.getUniformLocation(progTrailDecay, "u_prev_trail"), 0);
        const dt60 = Math.min(3.0, dtSec * 60.0);
        gl.uniform1f(gl.getUniformLocation(progTrailDecay, "u_decay"), Math.pow(0.84, dt60));
        gl.uniform1f(gl.getUniformLocation(progTrailDecay, "u_hdr_decay"), Math.pow(0.94, dt60));
        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Pass 2B: Render 3D Sculpted Head Particles (continuous spring physics + DoF bokeh + critic spotlight)
        gl.depthMask(true);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(progParticles);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, fboTex[nextIdx]);
        gl.uniform1i(gl.getUniformLocation(progParticles, "u_fbo"), 0);

        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, depthStateTex[depthStateIdx]);
        gl.uniform1i(gl.getUniformLocation(progParticles, "u_depth_state"), 1);

        const camAlpha = 1.0 - Math.exp(-dtSec * 10.0);
        camYaw += (targetYaw - camYaw) * camAlpha;
        camPitch += (targetPitch - camPitch) * camAlpha;
        camZ += (targetCamZ - camZ) * camAlpha;

        // Organic handheld camera feel: slow breathing/stance drift + medium weight-shift + micro-tremor (damps while dragging)
        const targetHh = isDragging ? 0.30 : 1.0;
        handheldBlend += (targetHh - handheldBlend) * (1.0 - Math.exp(-dtSec * 4.0));
        const hhT = now * 0.001;
        const hhBreath = Math.sin(hhT * 1.18 + hhNoise1D(hhT * 0.14, 91.0) * 1.4);
        const hhYaw   = hhFbm(hhT, 1.3) * 0.026 * handheldBlend;
        const hhPitch = (hhFbm(hhT, 4.7) * 0.018 + hhBreath * 0.0045) * handheldBlend;
        const hhZ     = (hhFbm(hhT, 8.2) * 0.026 + hhBreath * 0.012) * handheldBlend;
        const hhRoll  = hhFbm(hhT, 12.9) * 0.012 * handheldBlend;
        const hhPanX  = hhFbm(hhT, 17.4) * 0.020 * handheldBlend;
        const hhPanY  = (hhFbm(hhT, 23.1) * 0.015 + hhBreath * 0.004) * handheldBlend;

        // Evaluate autonomous special events (Ideas 1, 2, 6, 8)
        // Idea 1: Simultaneous Blink-to-Transform (70% faster: 106ms close + 212ms open = 318ms total)
        if (now >= blinkNextMs) {
          blinkStartMs = now;
          blinkNextMs = now + 18000 + Math.random() * 14000;
        }
        const evalBlink = (tMs) => {
          if (tMs < 0 || tMs > 318) return 0.0;
          if (tMs < 106) {
            const u = tMs / 106;
            return u * u * (3.0 - 2.0 * u);
          }
          const u = 1.0 - (tMs - 106) / 212;
          return u * u * (3.0 - 2.0 * u);
        };
        const blinkL = evalBlink(now - blinkStartMs);
        const blinkR = blinkL;

        // Idea 2: Tension-driven pupil dilation + subtle biological hippus
        const targetDil = (latestTension - 0.50) * 1.5 + Math.sin(now * 0.00115) * 0.28 + Math.cos(now * 0.00053) * 0.16;
        smoothPupilDil += (Math.max(-1.0, Math.min(1.0, targetDil)) - smoothPupilDil) * (1.0 - Math.exp(-dtSec * 2.5));

        // Iris Colour Shedding (3.8s gentle particle lift on eye updates)
        const shedT = (now - shedStartMs) / 3800.0;
        const shedProg = (shedT >= 0.0 && shedT <= 1.0) ? shedT : 0.0;

        // New Idea 1: Micro-Saccade Glance (every 10-18s: 95ms dart -> 450-900ms hold -> 125ms snap back)
        if (now >= saccadeNextMs) {
          saccadeStartMs = now;
          saccadeHoldMs = 450 + Math.random() * 450;
          saccadeNextMs = now + 10000 + Math.random() * 8000;
          const ang = Math.random() * Math.PI * 2.0;
          const mag = 0.009 + Math.random() * 0.007;
          saccadeTargetX = Math.cos(ang) * mag;
          saccadeTargetY = Math.sin(ang) * mag * 0.85;
        }
        let sacAmt = 0.0;
        const sacElapsed = now - saccadeStartMs;
        if (sacElapsed >= 0 && sacElapsed < 95) {
          const u = sacElapsed / 95;
          sacAmt = 1.0 - Math.pow(1.0 - u, 3.0);
        } else if (sacElapsed >= 95 && sacElapsed < 95 + saccadeHoldMs) {
          sacAmt = 1.0;
        } else if (sacElapsed >= 95 + saccadeHoldMs && sacElapsed < 220 + saccadeHoldMs) {
          const u = (sacElapsed - 95 - saccadeHoldMs) / 125;
          sacAmt = 1.0 - u * u * (3.0 - 2.0 * u);
        }
        // Smaller fine micro-saccades happening twice as often (every 5-9s: 55ms dart -> 180-420ms hold -> 75ms return)
        if (now >= microSacNextMs) {
          microSacStartMs = now;
          microSacHoldMs = 180 + Math.random() * 240;
          microSacNextMs = now + 5000 + Math.random() * 4000;
          const mAng = Math.random() * Math.PI * 2.0;
          const mMag = 0.0032 + Math.random() * 0.0030;
          microSacTargetX = Math.cos(mAng) * mMag;
          microSacTargetY = Math.sin(mAng) * mMag * 0.85;
        }
        let microAmt = 0.0;
        const mElapsed = now - microSacStartMs;
        if (mElapsed >= 0 && mElapsed < 55) {
          const u = mElapsed / 55;
          microAmt = 1.0 - Math.pow(1.0 - u, 3.0);
        } else if (mElapsed >= 55 && mElapsed < 55 + microSacHoldMs) {
          microAmt = 1.0;
        } else if (mElapsed >= 55 + microSacHoldMs && mElapsed < 130 + microSacHoldMs) {
          const u = (mElapsed - 55 - microSacHoldMs) / 75;
          microAmt = 1.0 - u * u * (3.0 - 2.0 * u);
        }
        const sacX = Math.max(-0.017, Math.min(0.017, saccadeTargetX * sacAmt + microSacTargetX * microAmt));
        const sacY = Math.max(-0.014, Math.min(0.014, saccadeTargetY * sacAmt + microSacTargetY * microAmt));

        gl.uniform1f(gl.getUniformLocation(progParticles, "u_time"), now * 0.001);
        gl.uniform3f(gl.getUniformLocation(progParticles, "u_cam"), camYaw + hhYaw, camPitch + hhPitch, camZ + hhZ);
        gl.uniform3f(gl.getUniformLocation(progParticles, "u_cam_handheld"), hhRoll, hhPanX, hhPanY);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_aspect"), viewAspect);
        gl.uniform2f(gl.getUniformLocation(progParticles, "u_spot"), smoothFeatX, smoothFeatY);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_gamma"), 1.24);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_crimson"), 0.58);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_bone"), 0.34);
        gl.uniform2f(gl.getUniformLocation(progParticles, "u_tear_origin"), smoothTearX, smoothTearY);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_tear_head_y"), tearHeadY);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_tear_alpha"), tearAlpha);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_tear_dir"), tearSide === 0 ? -1.0 : 1.0);
        const pAlpha = 1.0 - Math.exp(-dtSec * 3.0);
        for (let i = 0; i < 4; i++) smoothPupils[i] += (livePupils[i] - smoothPupils[i]) * pAlpha;
        for (let i = 0; i < 6; i++) smoothEyeGeom[i] += (liveEyeGeom[i] - smoothEyeGeom[i]) * pAlpha;
        gl.uniform2f(gl.getUniformLocation(progParticles, "u_blink"), blinkL, blinkR);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_pupil_dil"), smoothPupilDil);
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_shed"), shedProg);
        gl.uniform4f(gl.getUniformLocation(progParticles, "u_pupils"), smoothPupils[0], smoothPupils[1], smoothPupils[2], smoothPupils[3]);
        gl.uniform3f(gl.getUniformLocation(progParticles, "u_eye_geom_l"), smoothEyeGeom[0], smoothEyeGeom[1], smoothEyeGeom[2]);
        gl.uniform3f(gl.getUniformLocation(progParticles, "u_eye_geom_r"), smoothEyeGeom[3], smoothEyeGeom[4], smoothEyeGeom[5]);
        gl.uniform2f(gl.getUniformLocation(progParticles, "u_saccade"), sacX, sacY);
        const cmAlpha = 1.0 - Math.exp(-dtSec * 8.0);
        smoothGrayscale += ((colorMode === 1 ? 1.0 : 0.0) - smoothGrayscale) * cmAlpha;
        smoothCorneaOnly += ((colorMode === 2 ? 1.0 : 0.0) - smoothCorneaOnly) * cmAlpha;
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_cornea_only"), smoothCorneaOnly);
        const irisAlpha = 1.0 - Math.exp(-dtSec * 2.2);
        for (let c = 0; c < 3; c++) smoothIrisTint[c] += (liveIrisTint[c] - smoothIrisTint[c]) * irisAlpha;
        gl.uniform3f(gl.getUniformLocation(progParticles, "u_iris_tint"), smoothIrisTint[0], smoothIrisTint[1], smoothIrisTint[2]);

        // Detuned CRT TV Static Eyes event (every 18-30s, random 0.2-1.0s duration with crisp glitchy onset & recovery)
        if (now >= crtNextMs) {
          crtStartMs = now;
          crtDurMs = 200 + Math.random() * 800;
          crtNextMs = now + 18000 + Math.random() * 12000;
        }
        let crtStatic = 0.0;
        const crtEl = now - crtStartMs;
        if (crtEl >= 0 && crtEl < crtDurMs) {
          const attackMs = Math.min(70, crtDurMs * 0.22);
          const releaseMs = Math.min(80, crtDurMs * 0.24);
          if (crtEl < attackMs) {
            const f = crtEl / attackMs;
            crtStatic = (Math.sin(crtEl * 0.18) > -0.25) ? (0.55 + 0.45 * f) : 0.15;
          } else if (crtEl > crtDurMs - releaseMs) {
            const f = (crtDurMs - crtEl) / releaseMs;
            crtStatic = (Math.sin(crtEl * 0.20) > -0.20) ? f : 0.0;
          } else {
            crtStatic = 0.96 + 0.04 * Math.sin(crtEl * 0.09);
          }
        }
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_crt_static"), crtStatic);
        const crtBurstT = crtEl / 2900.0;
        const crtBurst = (crtBurstT >= 0.0 && crtBurstT <= 1.0) ? crtBurstT : 0.0;
        gl.uniform1f(gl.getUniformLocation(progParticles, "u_crt_burst"), crtBurst);

        // Novel Idea 1: Iris Eclipse (every 32-48s: 0.9s swallow -> 0.9s obsidian hold -> 1.0s slow recede)
        if (now >= eclipseNextMs) {
          eclipseStartMs = now;
          eclipseNextMs = now + 32000 + Math.random() * 16000;
        }
        let eclipseAmt = 0.0;
        const ecEl = now - eclipseStartMs;
        if (ecEl >= 0 && ecEl < 900) {
          const u = ecEl / 900;
          eclipseAmt = u * u * (3.0 - 2.0 * u);
        } else if (ecEl >= 900 && ecEl < 1800) {
          eclipseAmt = 1.0;
        } else if (ecEl >= 1800 && ecEl < 2800) {
          const u = 1.0 - (ecEl - 1800) / 1000;
          eclipseAmt = u * u * (3.0 - 2.0 * u);
        }

        // Novel Idea 6: Chromatic Iris Ignition (440ms True HDR flare surge on new eye arrival)
        let ignitionAmt = 0.0;
        const igEl = now - ignitionStartMs;
        if (igEl >= 0 && igEl < 120) {
          const u = igEl / 120;
          ignitionAmt = 1.0 - Math.pow(1.0 - u, 2.5);
        } else if (igEl >= 120 && igEl < 480) {
          const u = 1.0 - (igEl - 120) / 360;
          ignitionAmt = u * u;
        }

        gl.uniform4f(gl.getUniformLocation(progParticles, "u_fx"), eclipseAmt, 0.0, 0.0, ignitionAmt);
        gl.uniform1i(gl.getUniformLocation(progParticles, "u_frame"), blitFrame);

        gl.bindVertexArray(particleVao);
        gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
        gl.disable(gl.BLEND);

        // Pass 2B.5: Subtle UnrealGlow (soft-knee highlight extraction + dual-radius separable Gaussian blur)
        gl.disable(gl.DEPTH_TEST);
        gl.viewport(0, 0, bloomW, bloomH);
        gl.bindVertexArray(quadVao);

        // Extract bright highlights -> bloomFbo[0]
        gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFbo[0]);
        gl.useProgram(progBloomThresh);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, trailTex[nextTrail]);
        gl.uniform1i(gl.getUniformLocation(progBloomThresh, "u_src"), 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Tight inner glow (H -> V) + wide ethereal Unreal halo (H -> V)
        gl.useProgram(progBloomBlur);
        const uBlurSrc = gl.getUniformLocation(progBloomBlur, "u_src");
        const uBlurDir = gl.getUniformLocation(progBloomBlur, "u_dir");
        const invBW = 1.0 / bloomW;
        const invBH = 1.0 / bloomH;
        const radii = [1.5, 3.6];
        for (let r = 0; r < radii.length; r++) {
          const sp = radii[r];
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFbo[1]);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
          gl.uniform1i(uBlurSrc, 0);
          gl.uniform2f(uBlurDir, invBW * sp, 0.0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFbo[0]);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[1]);
          gl.uniform1i(uBlurSrc, 0);
          gl.uniform2f(uBlurDir, 0.0, invBH * sp);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        // Pass 2C: Blit accumulated full-screen trail buffer + subtle UnrealGlow cleanly to screen
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, viewW, viewH);
        gl.useProgram(progBlit);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, trailTex[nextTrail]);
        gl.uniform1i(gl.getUniformLocation(progBlit, "u_tex"), 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
        gl.uniform1i(gl.getUniformLocation(progBlit, "u_bloom"), 1);
        gl.uniform1f(gl.getUniformLocation(progBlit, "u_bloom_strength"), 0.24);
        gl.uniform1f(gl.getUniformLocation(progBlit, "u_grayscale"), smoothGrayscale);
        gl.uniform1f(gl.getUniformLocation(progBlit, "u_hdr_headroom"), hdrHeadroom);
        blitFrame = (blitFrame + 1) & 0x7fffffff;
        gl.bindVertexArray(quadVao);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        trailIdx = nextTrail;
        fboIdx = nextIdx;
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
